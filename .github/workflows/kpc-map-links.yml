name: KPC map-page link extractor (agency map pages -> official park maps; merged through the waiting room)
# Oct 31 2026 (chat 10; HQ 5:45 PM, Brandon 'let him look to fix map page link'): the outside coder's link extractor
# (.github/scripts/tools/kpc_map_links), fixed: a 403 page is opened in its headless browser (tnstateparks.com, tn.gov/twra);
# national index pages (Forest Service, FWS, NPS, BLM) are replaced by each unit's own page. test=yes = Tennessee only.
# Answers -> data/intake/docs-found-maplinks(.json|-possible.json) -> kpc_docs_merge.py (opens + names the park, never a sign /
# logo, never over an ok map; waiting room; chat 11). By hand; chains while agencies are left. Never red.
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'yes = Tennessee only'
        default: 'yes'
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '10 5 2 * *'   # monthly, whole US (chat 10 Oct 31: HQ 9:25 PM 'wired, not hand fed')   # G9 Nov 2: was '11 5 2 * *' (spread the start times; now 1 min earlier)
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-map-links
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The side branch (resume state, tools-out links/)
        id: kept_green_1
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin tools-out:tools-out && git worktree add -q ../out tools-out || true   # ok: optional git step; the next step reports
      - name: Extract
        id: x
        continue-on-error: true
        run: |
          cd kpcdata
          pip install -q -r .github/scripts/tools/kpc_map_links/requirements.txt || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"
          python -m playwright install --with-deps chromium >/dev/null 2>&1 || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"
          D=../out/links2${{ inputs.test == 'yes' && '-test' || '' }}
          python3 .github/scripts/kpc_tools_run.py prep-links "${{ inputs.test }}" $D-in || echo "::error title=kpc_tools_run.py::stopped with an error (exit $?), see the log above"
          set +e
          python3 .github/scripts/tools/kpc_map_links/kpc_map_links.py --agencies $D-in/agency_pages.json --out $D --resume --max-minutes 50 2>&1 | tail -25
          [ "${PIPESTATUS[0]}" = 3 ] && echo "more=yes" >> $GITHUB_OUTPUT
          python3 .github/scripts/kpc_tools_run.py post-links $D || echo "::error title=kpc_tools_run.py::stopped with an error (exit $?), see the log above"
          cd ../out && git add -A && git commit -qm "map links (run ${{ github.run_id }})" && git push -q origin tools-out || echo "::error title=git push::a push failed (exit $?); this run is NOT saved"
          cd ../kpcdata && bash ../links/.github/scripts/kpc_push_data.sh . "map-page link extractor: finds (merged through the waiting room)" data/intake/docs-found-maplinks.json data/intake/docs-found-maplinks-possible.json || echo "::error title=kpc_push_data.sh::stopped with an error (exit $?), see the log above"
      - name: Merge what it found / next run
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.x.outputs.more }}" = yes ]; then gh workflow run kpc-map-links.yml -R ${{ github.repository }} --ref main -f test="${{ inputs.test }}" || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
          else gh workflow run kpc-docs-merge.yml -R ${{ github.repository }} --ref main || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"; fi
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
