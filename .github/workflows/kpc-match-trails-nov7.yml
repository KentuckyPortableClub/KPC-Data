# Outside agent's trail-park matcher (Nov 7 2026; Brandon 7:39 PM CST: 'Enter everything you got'), reviewed by Grok Bot: it asks each
# candidate trail LINE layer by name and by 2 km around the POTA pin through convert_layers.polite_get (blocked hosts, robots.txt
# 401/403/5xx = refused, Crawl-delay, 3 tries). Layers on services*.arcgis.com and apps.fs.usda.gov answer robots.txt with 403, so their
# pairs come back as refused, not asked. MANUAL ONLY (no schedule). Writes matches.csv / best_per_park.csv / matches_report.txt as a run
# artifact: every row is a CANDIDATE for a person, nothing is committed or pushed.
name: KPC match trails (manual, artifact only)
on:
  workflow_dispatch:
    inputs:
      only:
        description: "State/province prefix, e.g. US-UT (blank = all 243 parks)"
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: kpc-match-trails-nov7
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Get our own intake files branch (read from git, not raw.githubusercontent.com)
        run: git fetch --depth 1 origin intake-files:refs/remotes/origin/intake-files
      - name: Match
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only sent to raw.githubusercontent.com
          ONLY: ${{ inputs.only }}
        run: |
          case "$ONLY" in *[!A-Z-]*) echo "::error::only takes a prefix like US-UT"; exit 1;; esac
          D=.github/scripts/draft/tools/kpc_layers_nov7
          cd "$D" && python3 match_trails.py --parks inputs/kpc-pota-trail-parks-no-outline-nov7.csv \
            --layers inputs/kpc-trail-line-layers-nov7.csv --out "$GITHUB_WORKSPACE/matches" --only "$ONLY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: trail-matches, path: matches/, retention-days: 14 }
