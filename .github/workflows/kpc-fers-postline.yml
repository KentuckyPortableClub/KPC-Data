name: KPC 2-fer post-line check (hidden)
# Nov 4 (Brandon, directly (Mapping chat), 4:52 AM CST Nov 4: "2fer line review? Plan and install any pre and post line bots for the
# 2fer system."; chain step 6: per Brandon via Super Head Bot (relayed), 4:55 AM CST Nov 4): after every 2-fer run (a line started by hand / the small batches / 'next', or the chain's lines,
# which run inside the chain workflow), compare the HELD new 2-fer output with the previous one and write a report for Quality.
# workflow_run only, no cron. Read-only on the 2-fers; never fails; saves only data/status/fers-postline/ and the chain gate state
# (data/status/fers-chain/gate.json + gate-log.md). Releases nothing.
on:
  workflow_run:
    workflows: ['KPC 2-fer assembly line (hidden)', 'KPC 2-fer chain after a new key (hidden)']
  # Nov 9 (Quality must-fix 4, run 42594981324): after a HAND-STARTED 2-fer bot run (kpc-fers.yml), one step, by hand:
  #   gh workflow run kpc-fers-postline.yml -R KentuckyPortableClub/KPC-Data -f prev_ref=auto
  # (auto = the parent of the newest '2-fer bot pass' save). Not a workflow_run on kpc-fers.yml: that job is red-on-caught-error
  # (KPC_FAIL_SAFE), and a followed job may not be (tests/test_nextround_hidden_failures_nov5.py).
    types: [completed]
  # Nov 4 PM fix bundle item 3: a chain run started by dispatch fires no workflow_run, so the chain's 'postline' job starts this
  workflow_dispatch:
    inputs:
      run_url:
        description: 'The 2-fer chain or line run to report on (set by kpc-fers-chain.yml)'
        required: false
        default: ''
      prev_ref:
        description: 'Nov 9: after a hand-started kpc-fers.yml run, the KPC-Data commit to compare against (auto = the parent of the newest 2-fer bot save; blank = the waiting-room compare as before)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-fers-postline
  cancel-in-progress: false
jobs:
  postline:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion != 'skipped' && github.event.workflow_run.conclusion != 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: The save before a hand-started 2-fer bot run (kpc-fers.yml saves live, no waiting room)
        # Nov 9: the newest '2-fer bot pass' commit = the new output; its parent's data/fers = the previous one (PREV_DIR)
        if: ${{ inputs.prev_ref != '' }}
        continue-on-error: true
        env:
          PREV_REF: ${{ inputs.prev_ref }}
        run: |
          git fetch -q --deepen=200 origin || true
          NEW=$(git log -1 --format=%H --grep='^2-fer bot pass' -- data/fers)
          [ "$PREV_REF" = auto ] && PREV_REF=''
          REF=${PREV_REF:-${NEW:+$NEW^}}
          [ -n "$REF" ] || { echo "::warning title=post-line::no 2-fer bot save found"; exit 0; }
          mkdir -p "$RUNNER_TEMP/prev" && git archive "$REF" data/fers | tar -x -C "$RUNNER_TEMP/prev"
          echo "PREV_DIR=$RUNNER_TEMP/prev" >> "$GITHUB_ENV"; echo "post-line compares the live data/fers with $REF"
      - name: 2-fer post-line check (read-only report)
        continue-on-error: true
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url || inputs.run_url }}
        run: |
          if [ ! -f links/.github/scripts/kpc_fers_postline.py ]; then echo "::warning title=2-fer post-line check::KPC-Links has no kpc_fers_postline.py (links-05 not merged): no report"; exit 0; fi
          DATA=. LINKS=links python3 links/.github/scripts/kpc_fers_postline.py || { kpc_rc=$?; echo "::error title=kpc_fers_postline.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers_postline.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # next round C4: was '|| true'
          [ -f data/status/fers-postline/latest.md ] && cat data/status/fers-postline/latest.md >> "$GITHUB_STEP_SUMMARY"; true
      - name: Map-audit gate, automatic re-enable (per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4) - counts this report; 3 clean post-key + post-line checks in a row (or a Brandon / KZ4CP GOOD) turn the gate on, once; it never turns it off
        continue-on-error: true
        run: |
          if [ -f .github/scripts/kpc_fers_chain_gate.py ]; then DATA=. LINKS=links python3 .github/scripts/kpc_fers_chain_gate.py update || { kpc_rc=$?; echo "::error title=kpc_fers_chain_gate.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers_chain_gate.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi   # next round C4: was '|| true'
      - name: Save the report and the gate state (only data/status/fers-postline + data/status/fers-chain)
        continue-on-error: true
        run: bash links/.github/scripts/kpc_push_data.sh . "2-fer post-line check (report for Quality) + chain gate state" data/status/fers-postline data/status/fers-chain || { kpc_rc=$?; echo "::error title=Save::the post-line report and the gate state were not saved (exit $kpc_rc)"; echo "Save - the post-line report and the gate state were not saved (exit $kpc_rc)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # next round C4: was '|| true'
      - name: Report hidden failures (Nov 2 review, G8; next round C4, this job records caught errors)
        if: always()
        continue-on-error: true   # the post-line never fails (Nov 4 fix bundle): this report only lists
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
