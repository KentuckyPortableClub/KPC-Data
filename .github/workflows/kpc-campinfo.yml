name: KPC campground info bot (facts only)
# Oct 28 2026 (HQ job 4, built by Fable in chat 10 'bot workshop'): for every campground we list (federal from Recreation.gov
# RIDB, state from the agency's own campground page, Kentucky's hand-checked list as the answer key) ONE record of facts: sites
# + types, hookups, dump station, showers, restrooms, water, fees as published, reservable + the official booking link (never
# availability), season, check-in / out, rules (pets, generators, quiet hours, fires, stay limit), phone, map link, elevation
# (USGS / NRCan) and a cell-coverage note (FCC map; needs a free token). EVERY fact carries its source url, date and quoted line.
# GATHERS FACTS, DECIDES NOTHING. Own script (kpc_campinfo_bot.py + kpc_manners.py), own folder (data/campinfo).
# Manners: robots.txt obeyed, 1 request / 2 s per host (RIDB too), back-off, three strikes = a day's rest.
# A job = up to 5 chunks of 55 min, ONE commit per chunk; when areas remain and 'chain' allows, the job starts the next one.
# Oct 28 later (chat 8's grade C-1..C-6): negation-aware reading ('no water, electricity or dump station' = False), footer
# phones dropped, all phones on a line kept, duplicate ids merged (same name within 300 m), agency .com/.us hosts in sources.json.
# Never fails except a failed save. NO CRON YET: a monthly schedule comes later, once chat 8 has graded review.md.
# Secrets (Settings -> Secrets and variables -> Actions): RIDB_API_KEY (federal rows), FCC_BDC_USERNAME + FCC_BDC_TOKEN (cell).
on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'Areas (e.g. "US-KY US-TN"); blank = the next unfinished areas in queue order (Kentucky, then the 2-fer regions: southeast first)'
        default: ''
      chunks:
        description: 'Chunks of 55 min in this job (max 5)'
        default: '5'
      chain:
        description: 'How many MORE jobs may follow this one by themselves when areas remain (0 = none)'
        default: '6'
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-campinfo
  cancel-in-progress: false
jobs:
  campinfo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Kentucky hand-checked campgrounds + federal list (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Tools
        continue-on-error: true
        run: pip install -q --break-system-packages pypdf || pip install -q pypdf || true
      - name: Read campground facts, in chunks, one save per chunk
        continue-on-error: true
        env:
          AREAS: ${{ inputs.areas }}
          LINKS: ../links
          RIDB_API_KEY: ${{ secrets.RIDB_API_KEY }}
          FCC_BDC_TOKEN: ${{ secrets.FCC_BDC_TOKEN }}
          FCC_BDC_USERNAME: ${{ secrets.FCC_BDC_USERNAME }}
        run: |
          cd kpcdata
          N=${{ inputs.chunks || 5 }}; [ "$N" -gt 5 ] && N=5
          for i in $(seq 1 $N); do
            MINUTES=55 python3 .github/scripts/kpc_campinfo_bot.py | tee /tmp/campinfo.log || true
            bash ../links/.github/scripts/kpc_push_data.sh . "campground info bot: chunk $i (facts with source lines)" data/campinfo || true
            LEFT=$(python3 -c "
          import json,os,sys
          sys.path.insert(0, '.github/scripts'); import kpc_campinfo_bot as B
          s = json.load(open('data/campinfo/state.json'))
          want = os.environ.get('AREAS', '').upper().split()
          q = [a for a in B.QUEUE if a in want] if want else B.QUEUE
          print(sum(1 for a in q if (s['areas'].get(a) or {}).get('status') != 'done'))" 2>/dev/null || echo 1)
            echo "chunk $i done, $LEFT areas left"
            [ "$LEFT" = 0 ] && break
          done
          echo "LEFT=$LEFT" >> "$GITHUB_ENV"
      - name: Areas remain, so the next job starts itself
        if: ${{ inputs.areas == '' && env.LEFT != '0' && env.LEFT != '' && inputs.chain != '0' && inputs.chain != '' }}
        continue-on-error: true
        run: |
          C=$(( ${{ inputs.chain }} - 1 ))
          echo "::notice title=Campground info bot::$LEFT areas left: the next job starts itself (then $C more may follow)"
          gh workflow run kpc-campinfo.yml -R ${{ github.repository }} -f areas= -f chunks=5 -f chain=$C || true
