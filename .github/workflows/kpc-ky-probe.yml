name: TEMP Boiling Springs probe (delete after)
# Oct 28 (HQ, Brandon's point 37.2953451, -85.8320279): a state-owned polygon containing it? Never fails.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probe
        continue-on-error: true
        shell: python3 {0}
        run: |
          import json, math, urllib.request, urllib.parse
          UA = {'User-Agent': 'KPC park-map bot (https://kentuckyportableclub.github.io/KPC-Links/)'}
          def note(t, m): print(f'::notice title={t}::{m}'[:1000], flush=True)
          def q(u, p):
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u + '?' + urllib.parse.urlencode(p), headers=UA), timeout=90).read())
              except Exception as e: return {'ERR': str(e)[:120]}
          def acres(rings):
              t = 0
              for r in rings:
                  la0 = sum(p[1] for p in r) / len(r); kx = 111320 * math.cos(math.radians(la0)); ky = 110570
                  t += sum(r[i - 1][0] * kx * r[i][1] * ky - r[i][0] * kx * r[i - 1][1] * ky for i in range(len(r))) / 2
              return round(abs(t) / 4046.86, 1)
          pt = '-85.8320279,37.2953451'
          P = {'geometry': pt, 'geometryType': 'esriGeometryPoint', 'inSR': 4326, 'spatialRel': 'esriSpatialRelIntersects', 'outFields': '*', 'returnGeometry': 'true', 'outSR': 4326, 'f': 'json'}
          K = 'https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/'
          for nm, u in (('PAD-US', 'https://edits.nationalmap.gov/arcgis/rest/services/PAD-US/PAD_US/MapServer/0/query'),
                        ('OKNP natural areas', K + 'Ky_KNP_Natural_Areas_WGS84WM/MapServer/0/query'), ('OKNP nature preserves', K + 'Ky_KNP_State_Nature_Preserves_WGS84WM/MapServer/0/query'),
                        ('KDFWR hunting areas', K + 'Ky_Public_Hunting_Areas_WGS84WM/MapServer/1/query'), ('KY state parks', K + 'Ky_State_Parks_Features_WGS84WM/MapServer/8/query'),
                        ('KY PVA parcels', 'https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/Ky_PVA_Parcels_WGS84WM/MapServer/0/query'),
                        ('KY state-owned property', K + 'Ky_State_Owned_Property_WGS84WM/MapServer/0/query')):
              j = q(u, P)
              if 'ERR' in j: note(nm, 'ERR ' + j['ERR']); continue
              fs = j.get('features') or []
              rows = [({k: v for k, v in (f.get('attributes') or {}).items() if v not in (None, '', ' ') and 'shape' not in k.lower() and 'objectid' not in k.lower()}, acres((f.get('geometry') or {}).get('rings') or [])) for f in fs]
              note(nm, (f'{len(fs)} polygon(s): ' + str(rows)[:900]) if fs else ('none at the point' if 'features' in j else str(j)[:300]))
          # which PVA / parcel services exist on the state server
          j = q('https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services', {'f': 'json'})
          note('state services with parcel/owner', ', '.join(s['name'].split('/')[-1] for s in j.get('services', []) if any(w in s['name'].lower() for w in ('pva', 'parcel', 'owned', 'property', 'cadast')))[:900])
