name: TEMP Kentucky outline probe (delete after)
# Oct 28 (HQ): LBL Forest Service land, Mammoth Cave NPS-owned land, Green River SNA's Boiling Springs unit. Never fails.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: probe
        continue-on-error: true
        shell: python3 {0}
        run: |
          import json, math, urllib.request, urllib.parse
          UA = {'User-Agent': 'KPC park-map bot (https://kentuckyportableclub.github.io/KPC-Links/)'}
          def note(t, m): print(f'::notice title={t}::{m}'[:1000], flush=True)
          def q(u, p):
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u + '?' + urllib.parse.urlencode(p), headers=UA), timeout=90).read())
              except Exception as e: return {'ERR': str(e)[:120]}
          def acres(rings):
              t = 0
              for r in rings:
                  la0 = sum(p[1] for p in r) / len(r); kx = 111320 * math.cos(math.radians(la0)); ky = 110570
                  t += sum(r[i - 1][0] * kx * r[i][1] * ky - r[i][0] * kx * r[i - 1][1] * ky for i in range(len(r))) / 2
              return abs(t) / 4046.86
          SNA = 'https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/Ky_KNP_Natural_Areas_WGS84WM/MapServer/0/query'
          for w in ("MANAME LIKE '%Green River%'", "MANAME LIKE '%Boiling%'", "UPPER(MANAME) LIKE '%SPRING%'"):
              j = q(SNA, {'where': w, 'outFields': 'MANAME,ACRES,MA_ID,Webpage', 'returnGeometry': 'false', 'f': 'json'})
              note('SNA ' + w[:30], str(j.get('ERR') or [(f['attributes']['MANAME'], f['attributes'].get('ACRES'), f['attributes'].get('MA_ID')) for f in j.get('features', [])])[:900])
          j = q(SNA, {'where': '1=1', 'returnCountOnly': 'true', 'f': 'json'}); note('SNA count', str(j))
          for lay in ('Ky_KNP_State_Nature_Preserves_WGS84WM/MapServer/0', 'Ky_KNP_Natural_Areas_WGS84WM/MapServer/0'):
              j = q('https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/' + lay + '/query', {'geometry': '-85.92,37.27,-85.80,37.36', 'geometryType': 'esriGeometryEnvelope', 'inSR': 4326, 'spatialRel': 'esriSpatialRelIntersects', 'outFields': 'MANAME,ACRES', 'returnGeometry': 'false', 'f': 'json'})
              note('near Munfordville ' + lay[:22], str(j.get('ERR') or [(f['attributes']['MANAME'], f['attributes'].get('ACRES')) for f in j.get('features', [])])[:900])
