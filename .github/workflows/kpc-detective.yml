name: KPC park detective (missing outlines + questions)
# Oct 28 2026 (Fable, chat 10 'bot workshop'; grown from kpc-detective.yml the same morning). Brandon: 'a bot dedicated to finding missing
# park information like Boiling Springs'. LEADS AND ANSWERS ONLY. (A) QUESTIONS from data/detective/questions.json (what is missing for a
# park: a tract, acreage, owner, who runs it, a handover, an access point) hunted through our layers -> agency pages + PDFs -> open-data
# portal -> PAD-US -> parcel sites where allowed -> news releases, answered in data/detective/answers.md. (B) THE GAP FILLER: for every park on the scoreboard with no outline it looks for the official polygon under the POTA pin (layers we
# already read, the agency's own ArcGIS, the state open-data portal, PAD-US) and writes what it found to data/detective/<area>.json
# + review.md, plus one intake-queue row per layer found (data/intake/queue.json, from 'gap-filler'). It never changes a key, an
# outline or a card. Manners: kpc_manners.py (robots.txt, 2 s per host, three strikes = a day's rest). Never fails except a failed save.
# A job works in MINUTES chunks (max 5 chunks x 55 min); when areas remain and 'chain' allows, the job starts the next one.
# WEEKLY (Monday 10:41 UTC): only once data/detective/state.json says 'proven' (Brandon's GO after chat 8 graded the first batches).
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      areas:
        description: 'Areas (e.g. "US-KY US-NV"); blank = the next unfinished areas in queue order (KY NV ID MS WA UT AR OR NC, the rest of the US, then ON QC NB NS, other provinces)'
        default: ''
      chunks:
        description: 'How many 55-minute chunks this job may work (max 5)'
        default: '5'
      chain:
        description: 'How many MORE jobs may follow this one by themselves when areas remain (0 = none)'
        default: '6'
      jobs:
        description: 'Which jobs, in order: questions gaps (any subset)'
        default: 'questions'
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '39 10 * * *'   # Oct 31 (Brandon 'fold detective into look up'): daily, answers the look-up branch's 'dig' questions   # G9 Nov 2: was '41 10 * * *' (spread the start times; now 2 min earlier)
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-detective
  cancel-in-progress: false
jobs:
  detective:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      GH_TOKEN: ${{ github.token }}
      LINKS: ../links
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Keys, layer lists and the Kentucky answer key (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: The look-up branch (dig questions in, answers out)
        id: kept_green_1
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: lookup
          path: lk
      - name: Daily runs only when a dig question waits
        id: gate
        continue-on-error: true
        run: |
          cd kpcdata
          N=$(python3 .github/scripts/kpc_dig_bridge.py in ../lk | grep -o '^NEW=[0-9]*' | cut -d= -f2)
          if [ "${{ (inputs.as_schedule && 'schedule') || github.event_name }}" = schedule ]; then
            OPEN=$(python3 -c "import json;q=json.load(open('data/detective/questions.json')).get('questions',[]);a=json.load(open('data/detective/answers.json')).get('answers',{});print(sum(1 for x in q if x.get('id') not in a))" 2>/dev/null || echo 0)
            if [ "${N:-0}" = 0 ] && [ "$OPEN" = 0 ]; then echo "no dig question waiting"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "AREAS=" >> "$GITHUB_ENV"; echo "JOBS=questions" >> "$GITHUB_ENV"
            P=$(python3 -c "import json;print((json.load(open('data/detective/state.json')).get('proven') or ''))" 2>/dev/null || echo '')
            if [ -z "$P" ]; then exit 0; fi
            python3 -c "
          import json; p='data/detective/state.json'; s=json.load(open(p))
          for a in s.get('areas',{}).values(): a['status']='queued'
          json.dump(s,open(p,'w'),indent=1)" || { kpc_rc=$?; echo "::warning title=inline python::a small python step failed (exit $kpc_rc)"; echo "inline python - a small python step failed (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          fi
      - name: Work in chunks, one save per chunk
        if: steps.gate.outputs.skip != '1'
        id: kept_green_2
        continue-on-error: true
        env:
          AREAS: ${{ inputs.areas }}
          MINUTES: '55'
          JOBS: ${{ inputs.jobs || 'questions' }}
          DIG: '1'   # Oct 30 (HQ audit 3): job A 'gaps' = the GIS hunter's work now; by hand only
        run: |
          cd kpcdata
          N="${{ inputs.chunks || 5 }}"; [ "$N" -gt 5 ] 2>/dev/null && N=5; [ "$N" -lt 1 ] 2>/dev/null && N=1
          LEFT=
          for i in $(seq 1 "$N"); do
            echo "::group::chunk $i of $N"
            python3 .github/scripts/kpc_detective_bot.py | tee /tmp/detective.log; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { kpc_rc=$?; echo "::warning title=kpc_detective_bot.py::stopped with an error (exit $rc), see the log above"; echo "kpc_detective_bot.py - stopped with an error (exit $rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            echo "::endgroup::"
            L=$(grep -o '^LEFT=[0-9]*' /tmp/detective.log | tail -1 | cut -d= -f2); LEFT="${L:-$LEFT}"
            bash ../links/.github/scripts/kpc_push_data.sh . "park detective: chunk $i" data/detective data/intake data/status || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            if [ -n "${{ inputs.areas }}" ]; then
              D=$(python3 -c "import json,os;s=json.load(open('data/detective/state.json'));a=os.environ['AREAS'].upper().split();print('1' if all((s['areas'].get(x) or {}).get('status')=='done' for x in a) else '')" 2>/dev/null || echo '')
              [ "$D" = 1 ] && break
            else
              [ "$LEFT" = 0 ] && break
            fi
          done
          echo "LEFT=${LEFT:-}" >> "$GITHUB_ENV"
          python3 .github/scripts/kpc_dig_bridge.py out ../lk || { kpc_rc=$?; echo "::error title=kpc_dig_bridge.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_dig_bridge.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          (cd ../lk && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add answers && git commit -qm 'park detective: dig answers' && { saved=0; for i in 1 2 3; do git pull -q --rebase origin lookup && git push -q origin HEAD:lookup && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; }) || true   # ok: nothing new to commit; a lost save is reported by the loop itself
          python3 .github/scripts/kpc_status.py board 'park detective' green "answers in data/detective/answers.md, outline leads in data/detective/review.md, intake rows in data/intake/queue.json" "chat 8 grades the sample; chat 2 reads the name-mismatch list; nothing goes in a key by itself" "left: ${LEFT:-?}" || true   # ok: a status-board line (reporting only)
          bash ../links/.github/scripts/kpc_push_data.sh . "park detective: status" data/detective data/intake data/status || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Areas remain, so the next job starts itself
        if: ${{ inputs.areas == '' && env.LEFT != '0' && env.LEFT != '' && inputs.chain != '0' && inputs.chain != '' }}
        id: kept_green_3
        continue-on-error: true
        run: |
          C=$(( ${{ inputs.chain }} - 1 ))
          echo "::notice title=Park detective::$LEFT areas left: the next job starts itself (then $C more may follow)"
          gh workflow run kpc-detective.yml -R ${{ github.repository }} -f areas= -f chunks=5 -f chain=$C -f jobs="${{ inputs.jobs || 'questions gaps' }}" || { kpc_rc=$?; echo "::error title=Next run::could not start the next run; the chain stops here (exit $kpc_rc)"; echo "Next run - could not start the next run; the chain stops here (exit $kpc_rc)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
