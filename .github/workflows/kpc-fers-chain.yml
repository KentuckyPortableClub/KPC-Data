name: KPC 2-fer chain after a new key (hidden)
# Nov 4 (per Brandon via Super Head Bot (relayed), 4:55 AM CST Nov 4): after the merge the whole chain runs by itself, NO new cron, only workflow_run:
#   1 KPC-Links 'KPC US answer key' (its own nightly; builds ALL states on new rules: links-04)
#   2 KPC-Links 'KPC key check (after a key build)' (links-01, kpc-key-postcheck.yml; workflow_run on the 3 keys)
#   3 KPC-Data 'KPC copy site data to KPC-Data (Step B3)' (its own hourly cron) brings the build over, HELD in data/waiting/in
#   4 THIS workflow (dispatched by 3, only when it copied a key): kpc_fers_chain_plan.py picks the areas of a NEW current-rules, post-checked build
#     (map-audit gate KPC_FERS_CHAIN_GATE: default OFF for testing, it turns ON by itself and stays on: kpc_fers_chain_gate.py;
#     per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4)
#   5 kpc-fers-line.yml (workflow_call, key=build): its 'preline' job = the 2-fer pre-line check (Brandon, directly (Mapping chat),
#     4:52 AM CST Nov 4); HOLD = the line does not build;
#     GO = fetcher -> worker -> checker; the checker diverts the 2-fers into data/waiting/in (HELD, kpc_waiting_room.py divert)
#   6 kpc-fers-postline.yml (dispatched by this workflow; workflow_run on a stand-alone line): the read-only post-line check for Quality
# Nothing here releases or publishes: no kpc_release_approved.py, no approved.json, no KPC-Links kpc-fers-publish.yml (and it could
# not: that workflow is in another repo and this token cannot start it). The release hold stays: a person (Brandon / KZ4CP) signs off first.
on:
  # owner rule, 2026-11-10: dispatch only (no workflow_run). kpc-copy-from-links.yml's 'chain' job starts this once per copy that
  # really copied a key. A double start is harmless: the concurrency group queues it and kpc_fers_chain_plan.py skips areas
  # already in data/status/fers-chain/seen.json.
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-fers-chain
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run: ${{ steps.plan.outputs.run }}
      areas: ${{ steps.plan.outputs.areas }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Which areas get a 2-fer line on the new key build
        id: plan
        env:
          # repo variable KPC_FERS_CHAIN_GATE = on | off, set BY HAND (always wins: Brandon's off). Unset = 'on' once the gate turned on by
          # itself (data/status/fers-chain/gate.json: a Brandon / KZ4CP GOOD on a 2-fer run, or 3 clean checks in a row), else
          # GATE_DEFAULT = 'off' in kpc_fers_chain_plan.py (per Brandon via Super Head Bot (relayed), 5:48 AM CST Nov 4)
          GATE: ${{ vars.KPC_FERS_CHAIN_GATE }}
        run: DATA=. LINKS=links python3 .github/scripts/kpc_fers_chain_plan.py
      - name: Remember the areas started and the gate state (only data/status/fers-chain)
        if: ${{ steps.plan.outputs.run == 'yes' || steps.plan.outputs.gate_changed == 'yes' }}
        run: |
          bash links/.github/scripts/kpc_push_data.sh . "2-fer chain: areas started on a new key build / gate state" data/status/fers-chain || { kpc_rc=$?; echo "::warning title=2-fer chain::seen list not saved"; echo "2-fer chain - seen list not saved" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8; Nov 4 PM fix bundle item 7)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
  line:
    needs: plan
    if: ${{ needs.plan.outputs.run == 'yes' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.areas) }}
    uses: ./.github/workflows/kpc-fers-line.yml
    with:
      states: ${{ matrix.area.states }}
      tag: ${{ matrix.area.tag }}
      stage: all
      minutes: '280'
      parks: ''
      next: ''
      key: build
      force: 'no'
  # owner rule, 2026-11-10: the post-line check for Quality is started here, once per chain run (kpc-fers-postline.yml does not
  # listen to this workflow).
  postline:
    needs: [plan, line]
    if: ${{ !cancelled() && needs.plan.outputs.run == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the 2-fer post-line check (read-only report)
        run: |
          U="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if gh api -X POST "repos/${{ github.repository }}/actions/workflows/kpc-fers-postline.yml/dispatches" -f ref=main -f "inputs[run_url]=$U"; then
            echo "::notice title=2-fer chain::post-line check started for $U"
          else
            echo "::error title=2-fer chain::could not start the post-line check (exit $?); start kpc-fers-postline.yml by hand with run_url=$U"
            echo "**2-fer chain:** the post-line check could NOT be started; start kpc-fers-postline.yml by hand (run_url=$U)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
