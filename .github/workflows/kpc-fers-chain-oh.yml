name: KPC 2-fer line, start Ohio after Kentucky's bundle (once)
# Oct 27 8:07 PM CDT (HQ: queue Ohio to start by itself once Kentucky's bundle is safely in KPC-Data; two at once, no more).
# Kentucky's run (40608978435) started before the 'next' input existed, so this one-off watcher looks every 15 min: when the
# release asset bundle-ky.tar.gz is newer than that run's start, it starts Ohio on the line and then deletes itself. Never fails.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-fers-chain-oh
  cancel-in-progress: false
jobs:
  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Ohio when Kentucky's bundle is up
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UP=$(gh api repos/${{ github.repository }}/releases --jq '.[]|select(.tag_name=="fers-bundles")|.assets[]|select(.name=="bundle-ky.tar.gz")|.updated_at' 2>/dev/null | head -1)
          echo "bundle-ky updated: ${UP:-none}"
          [ -n "$UP" ] && [ "$UP" \> "2026-10-28T00:28:00Z" ] || { echo "not yet"; exit 0; }
          # already started (a second line run exists besides Kentucky's)? then only remove this watcher
          N=$(gh run list -R ${{ github.repository }} -w kpc-fers-line.yml -L 10 --json createdAt --jq '[.[]|select(.createdAt > "2026-10-28T00:30:00Z")]|length')
          if [ "${N:-0}" -lt 2 ]; then
            gh workflow run kpc-fers-line.yml -R ${{ github.repository }} -f states=US-OH -f tag=oh -f stage=all -f minutes=280 && echo "::notice title=2-fer line::Ohio started on the line (Kentucky's bundle is up)"
          fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q .github/workflows/kpc-fers-chain-oh.yml && git commit -qm "chain: Ohio started, watcher removed" && for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 10; done
          true
