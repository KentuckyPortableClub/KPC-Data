name: KPC hard look reader (outside research rows -> questions for chat 11)
# Nov 1 2026 (chat 10; Brandon's Canada Hard Look, AUTOMATION FIRST): the intake reader pulls hardlook-*.json from branch intake-files,
# kpc_hardlook.py asks each layer for the park's own record, measures the POTA pin (R-G12 / R-G13) and writes
# data/waiting/questions/hardlook.json (+ pin-typos.json). Daily, chains until every row is read. Never red.
on:
  workflow_dispatch:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '13 6 * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-hardlook
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/kpc_push_data.sh
            /kpc-ky-data.json
          sparse-checkout-cone-mode: false
      - name: Read
        id: r
        continue-on-error: true
        env:
          MINUTES: '40'
          LINKS: ../links
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_intake_reader.py hardlook || echo "::error title=kpc_intake_reader.py::stopped with an error (exit $?), see the log above"
          BAD=0
          for chunk in 1 2 3 4 5 6 7; do   # Nov 1 storage fix: up to 7 chunks in ONE job, ONE save (was 276 commits a week)
            python3 .github/scripts/kpc_hardlook.py | tee /tmp/h.txt; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { BAD=$rc; echo "::warning title=kpc_hardlook.py::stopped with an error (exit $rc), see the log above"; }
            grep -q 'title=Hard look reader::stopped' /tmp/h.txt && BAD=1   # the reader says 'stopped (...)' and exits 0 on a crash
            L=$(grep -o '^LEFT=[0-9]*' /tmp/h.txt | cut -d= -f2); [ -z "$L" ] || [ "$L" = 0 ] && break
          done
          # Nov 2 bot fixes (Quality 4a): carry the answers chats wrote on main while this job ran into our copy before the save
          # (the save overwrote the whole question file). A failed merge does not save over main.
          MERGED=1; python3 .github/scripts/kpc_hardlook.py merge-main || { MERGED=0; BAD=1; echo "::error title=Hard look reader::could not merge main's answers: NOT saved this time (the next run reads again)"; }
          python3 .github/scripts/kpc_status.py board 'Hard look reader' $([ "$BAD" = 0 ] && echo green || echo amber) "$(grep -o 'record found [0-9]*' /tmp/h.txt | head -1) $(date -u +%F); left $(grep -o '^LEFT=[0-9]*' /tmp/h.txt | cut -d= -f2)" 'chat 11 answers data/waiting/questions/hardlook.json' || true   # ok: a pipeline (its exit status is the last command; follow-up: pipefail)
          if [ "$MERGED" = 1 ]; then bash ../links/.github/scripts/kpc_push_data.sh . "hard look reader (questions for chat 11)" data/waiting/questions data/intake/intake-seen.json data/status || echo "::error title=kpc_push_data.sh::stopped with an error (exit $?), see the log above"; fi
          echo "left=$(grep -o '^LEFT=[0-9]*' /tmp/h.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: Next run
        if: steps.r.outputs.left != '' && steps.r.outputs.left != '0'
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR2 (fewer runs, Nov 2): CHAIN BRAKE. A self-starting chain stops for the day after 8 runs in 24 h (Nov 2: the hard look
          # reader chained 187 times and the WDPA phone book 178 times in one day, each one a commit and a site rebuild). The next
          # scheduled run picks the work up again. Raise the number here if a backlog really needs more.
          kpc_brake() { n=$(gh api "repos/${{ github.repository }}/actions/workflows/kpc-hardlook.yml/runs?created=>=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=1" --jq .total_count 2>/dev/null || echo 0); if [ "${n:-0}" -ge 8 ]; then echo "::notice title=Chain brake::kpc-hardlook.yml ran $n times in 24 h (limit 8): no next run now; the next scheduled run goes on"; return 1; fi; return 0; }
          kpc_brake || exit 0
          gh workflow run kpc-hardlook.yml -R ${{ github.repository }} || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
