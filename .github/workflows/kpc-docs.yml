name: KPC official documents bot (hidden)
# Oct 28 2026 (HQ 1:24 AM, built by Fable): for every POTA park in the US + Canada, the agency's OFFICIAL MAP (link + date),
# its RULES page and who runs it now -> data/docs/<area>.json + data/docs/review.md (chat 8 grades a sample; cards only after
# Brandon's GO). A NEW bot: own script (kpc_docs_bot.py), own folder; it touches nothing else.
# Manners in the script: robots.txt obeyed, 1 request / 2 s per host, back-off, three strikes = a day's rest, PDFs read by range.
# A job = up to 5 chunks of 55 min, ONE commit per chunk; when areas remain and 'chain' allows, the job starts the next job
# itself (like the world harvester). Never fails except a failed save.
on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'Areas (e.g. "US-MO US-FL"); blank = the next unfinished areas in queue order (Kentucky, then the 2-fer regions: southeast first)'
        default: ''
      chunks:
        description: 'Chunks of 55 min in this job (max 5)'
        default: '5'
      chain:
        description: 'How many MORE jobs may follow this one by themselves when areas remain (0 = none)'
        default: '6'
      browser:
        description: 'yes = also the headless-Chromium pass for pages that hide their map links'
        default: 'yes'
      then_queue:
        description: 'For named test areas: "yes" = when the test PASSES (Missouri 90%+ maps ok, Florida browser pass found maps), start the whole queue by itself'
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-docs
  cancel-in-progress: false
jobs:
  docs:
    runs-on: ubuntu-24.04   # Nov 9: Playwright has no build for ubuntu 26.04 (Guide PDFs run 42637107981)
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Chat 8's survey + the Kentucky answer key (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Tools
        id: kept_green_1
        continue-on-error: true
        run: |
          pip install -q --break-system-packages pypdf || pip install -q pypdf || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          if [ "${{ inputs.browser }}" = yes ]; then pip install -q --break-system-packages playwright || pip install -q playwright || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; python3 -m playwright install --with-deps chromium >/dev/null 2>&1 || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
      - name: Read, in chunks, ONE save at the end (Nov 3)
        timeout-minutes: 338   # Nov 3: the step stops before the job's limit, so the one save below always runs
        id: kept_green_2
        continue-on-error: true
        env:
          KPC_SAVE_EACH_CHUNK: ${{ vars.KPC_SAVE_EACH_CHUNK || 'no' }}   # Nov 3 (Brandon YES 5:29 PM): yes = the old way, a save after every chunk
          AREAS: ${{ inputs.areas }}
          BROWSER: ${{ inputs.browser == 'yes' && '1' || '0' }}
          LINKS: ../links
        run: |
          cd kpcdata
          N=${{ inputs.chunks }}; [ "$N" -gt 5 ] && N=5
          for i in $(seq 1 $N); do
            LINKS=../links python3 .github/scripts/kpc_waiting_room.py resume data/docs || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Brandon Oct 29 7:55 PM: work from the held copy
            MINUTES=55 python3 .github/scripts/kpc_docs_bot.py || { kpc_rc=$?; echo "::error title=kpc_docs_bot.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_docs_bot.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            LINKS=../links python3 .github/scripts/kpc_waiting_room.py divert data/docs || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # changed area files wait in data/waiting/in/ (not live)
            python3 .github/scripts/kpc_status.py grade-me "official documents bot" "$(python3 -c "import json;s=json.load(open('data/docs/state.json'));print(' '.join((s.get('last') or {}).get('areas') or []))" 2>/dev/null)" "data/docs/<area>.json + review.md" "chunk $i" || true   # ok: a status-board line (reporting only) (Oct 28 (HQ automation, chat 10): one 'grade me' line per batch for chat 8)
            python3 .github/scripts/kpc_status.py board "official documents bot" green "chunk $i saved" "chat 8 grades review.md samples" || true   # ok: a status-board line (reporting only)
            [ "${KPC_SAVE_EACH_CHUNK:-no}" != yes ] || bash ../links/.github/scripts/kpc_push_data.sh . "documents bot: chunk $i (held in the waiting room)" data/docs data/status data/waiting || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            LEFT=$(python3 -c "
          import json,os,sys
          sys.path.insert(0, '.github/scripts'); import kpc_docs_bot as B
          s = json.load(open('data/docs/state.json'))
          want = os.environ.get('AREAS', '').upper().split()
          q = [a for a in B.QUEUE if a in want] if want else B.QUEUE
          print(sum(1 for a in q if (s['areas'].get(a) or {}).get('status') != 'done'))" 2>/dev/null || echo 1)
            echo "chunk $i done, $LEFT areas left"
            [ "$LEFT" = 0 ] && break
          done
          echo "LEFT=$LEFT" >> "$GITHUB_ENV"
      - name: ONE save for the whole run (Nov 3, Brandon YES 5:29 PM; was one save per chunk = up to 5 commits a run)
        if: always()
        id: save_once
        continue-on-error: true
        run: |
          cd kpcdata
          [ "${{ vars.KPC_SAVE_EACH_CHUNK || 'no' }}" = yes ] && { echo 'saved after every chunk (KPC_SAVE_EACH_CHUNK=yes)'; exit 0; }
          bash ../links/.github/scripts/kpc_push_data.sh . "documents bot: one save for the run (held in the waiting room)" data/docs data/status data/waiting || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: A passed test starts the queue
        if: ${{ inputs.areas != '' && inputs.then_queue == 'yes' }}
        id: kept_green_3
        continue-on-error: true
        env:
          AREAS: ${{ inputs.areas }}
        run: |
          cd kpcdata
          P=$(python3 -c "
          import json, os
          ok = True
          for a in os.environ['AREAS'].upper().split():
              c = json.load(open(f'data/docs/{a}.json')).get('counts') or {}
              if a == 'US-MO': ok = ok and c.get('map ok', 0) >= 0.9 * max(1, c.get('parks', 0))
              elif a == 'US-FL': ok = ok and c.get('map ok', 0) >= 20
              else: ok = ok and c.get('map ok', 0) >= 0.5 * max(1, c.get('parks', 0))
          print('PASS' if ok else 'FAIL')" 2>/dev/null || echo FAIL)
          echo "::notice title=Documents bot::test $AREAS: $P"
          # PAUSED Nov 4 (fix bundle; Brandon's yes relayed via Super Head Bot 4:53 PM CST; revert this one commit to resume): was: [ "$P" = PASS ] && gh workflow run kpc-docs.yml -R ${{ github.repository }} -f areas= -f chunks=5 -f chain=${{ inputs.chain }} -f browser=${{ inputs.browser }} && echo "::notice title=Documents bot::the long run has started (queue order: Kentucky, southeast, midwest, northeast, south central, mountain, pacific, Canada; ${{ inputs.chain }} more jobs may follow)"
          [ "$P" = PASS ] && echo "::warning title=Paused bot::kpc-docs.yml is paused (Nov 4 fix bundle) - its next run was NOT started, start it by hand (workflow_dispatch) if it is needed"
          true
      - name: Carry on in a new job when areas remain
        if: ${{ inputs.areas == '' && inputs.chain != '0' }}
        id: kept_green_4
        continue-on-error: true
        run: |
          [ "${LEFT:-0}" = 0 ] && { echo "::notice title=Documents bot::queue finished"; exit 0; }
          NEXT=$(( ${{ inputs.chain }} - 1 ))
          # PAUSED Nov 4 (fix bundle; Brandon's yes relayed via Super Head Bot 4:53 PM CST; revert this one commit to resume): was: gh workflow run kpc-docs.yml -R ${{ github.repository }} -f areas= -f chunks=5 -f chain=$NEXT -f browser=${{ inputs.browser }} && echo "::notice title=Documents bot::$LEFT areas left: the next job starts by itself ($NEXT more allowed after it)"
          echo "::warning title=Paused bot::kpc-docs.yml is paused (Nov 4 fix bundle) - its next run was NOT started, start it by hand (workflow_dispatch) if it is needed"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
