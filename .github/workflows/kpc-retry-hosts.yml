name: KPC retry list - the research's blocked servers, one honest try from GitHub (monthly)
# Nov 1 2026 (chat 10; Brandon 6:11 PM 'try the blocked list try again list in the notes'). kpc_retry_hosts.py asks each address on
# the outside research's 'RETRY FROM ANOTHER NETWORK' list once (robots.txt obeyed; a 403 / robot check / sign-in is never bypassed).
# Answering layer services go on the club layer list (data/intake/queue.json) -> engine pin test -> collector -> chat 11.
# Results in data/intake/retry-github.json. Monthly (the 3rd) or by hand. Never red, never emails.
on:
  workflow_dispatch:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '26 9 3 * *'   # G9 Nov 2: was '27 9 3 * *' (spread the start times; now 1 min earlier)
permissions:
  contents: write
concurrency:
  group: kpc-retry-hosts
  cancel-in-progress: false
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/kpc_push_data.sh
          sparse-checkout-cone-mode: false
      - name: One honest try per address
        id: kept_green_1
        continue-on-error: true
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_retry_hosts.py || { kpc_rc=$?; echo "::error title=kpc_retry_hosts.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_retry_hosts.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_status.py board 'Retry list (GitHub try)' green "$(python3 -c "import json;d=json.load(open('data/intake/retry-github.json'));print(sum(1 for r in d['tries'] if isinstance(r['answer'],int) and r['answer']<400),'of',len(d['tries']),'answered;',d['added_to_layer_list'],'layers to the list',d['date'])" 2>/dev/null)" 'the engine tests the new layers; a person follows the pages that answered' || true   # ok: a status-board line (reporting only)
          bash ../links/.github/scripts/kpc_push_data.sh . "retry list: one try from GitHub" data/intake/retry-github.json data/intake/queue.json data/status || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED == 'all' && '1' || '0' }}   # Nov 10 (quiet runs): caught errors go to the job summary and the job ends green; red only when a person has to act (KPC_HIDDEN_RED=all = the old red-on-any-caught-error)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
