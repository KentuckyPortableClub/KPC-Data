name: KPC 2-fer assembly lines, several at once (hidden)
# Oct 28 2026 (HQ 4:40 AM, Brandon: 'duplicate the line'): up to THREE assembly lines side by side, each one a full line
# (fetcher -> worker -> checker, kpc-fers-line.yml called as a reusable workflow) with its own bundle tag, its own output files and
# its own checker result; no two lines write the same file (each saves only its own area's files); the outside servers see at most
# 3 lines' worth of requests, each line with the usual manners. THE QUEUE (HQ Oct 28 7:50 AM, after chat 8's Kentucky READY):
# the default 'areas' list in HQ's order, 3 at a time, the next area starting when a line frees up (the matrix does that);
# every area's data stays hidden until chat 8 grades it (the checker writes one 'grade me' line per area into
# data/status/inbox-checkers.md + inbox-chat-8.md); a broken area is recorded and the queue moves on; two breaks in a row
# cancel the whole run (kpc-fers-line.yml 'broke' job).
on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'Lines, one per entry "STATES|tag" separated by ";" (e.g. "US-MI|mi; US-UT|ut"); or an area name of .github/fers-areas.json per entry (southeast; plains; …); "@worker" after an entry = start from its saved fetcher bundle'
        default: 'southeast; midatlantic; newyork; newengland; greatlakes; plains; southcentral; mountain; southwest; pacific; southinland; appalachia; canadabc; canadawest; canadaon; canadaeast'   # KPC owner, 2026-11-13: the 16 areas of .github/fers-areas.json (southeast and midatlantic split so a line stays under the memory guard)
      minutes:
        description: 'Minutes for each of fetcher and worker per line (default 280)'
        default: '280'
      at_once:
        description: 'Lines running at the same time (1-3; never more: the outside servers)'
        default: '3'
      round:
        description: 'Retry round (0 = first; areas parked on the USGS water map are run once more as round 1, never more)'
        default: '0'
permissions:
  contents: write
  actions: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.p.outputs.lines }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - uses: actions/checkout@v5   # KPC owner, 2026-11-12: only to read .github/fers-areas.json (the one area list)
        with:
          sparse-checkout: .github
      - id: p
        env:
          AREAS: ${{ inputs.areas }}
          AT_ONCE: ${{ inputs.at_once }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          R = json.load(open('.github/fers-areas.json', encoding='utf-8'))['areas']   # KPC owner, 2026-11-12: the ONE area list (the chain's old inline copy is retired)
          out = []
          for e in [x.strip() for x in os.environ['AREAS'].split(';') if x.strip()]:
              stage = 'all'
              if '@' in e: e, stage = [x.strip() for x in e.rsplit('@', 1)]   # 'midwest@worker' = from its saved fetcher bundle
              if stage not in ('all', 'worker', 'checker'): stage = 'all'
              if '|' in e: st, tag = [x.strip() for x in e.split('|', 1)]
              elif e.lower() in R: st, tag = R[e.lower()], e.lower()
              else: st, tag = e.upper(), re.sub(r'[^a-z0-9]', '', e.lower())
              out.append({'states': st.upper(), 'tag': re.sub(r'[^a-z0-9-]', '', tag.lower()), 'stage': stage})
          # Nov 2 (Brandon 7:01 AM 'Yes, tired of going in circles'): KEYS FIRST. A state whose new key file still waits for chat 11 in the
          # waiting room is left out (its outlines may still change); write 'US-XX|xx!' to run it anyway (by hand only)
          import subprocess
          def _held(kind):
              r = subprocess.run(['gh', 'api', f"repos/{os.environ.get('GITHUB_REPOSITORY', 'KentuckyPortableClub/KPC-Data')}/contents/data/waiting/in/data/{kind}", '--jq', '.[].name'], capture_output=True, text=True)
              return {x[:-5] for x in r.stdout.split() if x.endswith('.json')}
          HELD = _held('us-key') | _held('ca-key')
          keep, left = [], []
          for o in out:
              force = o['tag'].endswith('!') or '!' in o['states']
              o['tag'] = o['tag'].rstrip('!'); o['states'] = o['states'].replace('!', '')
              h = [s for s in o['states'].split() if s in HELD]
              (left if h and not force else keep).append((o, h))
          if left: print('::notice title=2-fer lines::keys first: left out until their key is released: ' + '; '.join(f"{o['tag']} ({' '.join(h)})" for o, h in left))
          out = [o for o, _ in keep]
          n = max(1, min(3, int(os.environ.get('AT_ONCE') or 3)))
          print('lines=' + json.dumps(out)); print(f'n={n}')
          print(f'::notice title=2-fer lines::{len(out)} line(s), {n} at a time: ' + '; '.join(f"{o['states']} ({o['tag']}, {o['stage']})" for o in out))
          PY
  ahead:
    # Oct 28 10:44 PM (Brandon: 'have your tiles for 3 runs ahead'): the 3 areas waiting behind the first lines get their USGS water
    # tiles filled now (kpc-fers-water.yml), so their lines never wait on water
    needs: plan
    if: needs.plan.outputs.lines != '[]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LINES: ${{ needs.plan.outputs.lines }}
      N: ${{ needs.plan.outputs.n }}
    steps:
      - run: |
          A=$(python3 -c "import json,os; L=json.loads(os.environ['LINES']); n=int(os.environ['N']); print('; '.join(f\"{l['states']}|{l['tag']}\" for l in L[n:n + 3] if any(s.startswith(('US-', 'CA-')) for s in l['states'].split())))")
          if [ -n "$A" ]; then gh workflow run kpc-fers-water.yml -R "${{ github.repository }}" -f "areas=$A" && echo "::notice title=2-fer lines::water tiles ahead for: $A"; else echo "nothing waiting"; fi
  line:
    needs: plan
    if: needs.plan.outputs.lines != '[]'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.n) }}
      matrix:
        line: ${{ fromJSON(needs.plan.outputs.lines) }}
    uses: ./.github/workflows/kpc-fers-line.yml
    with:
      states: ${{ matrix.line.states }}
      tag: ${{ matrix.line.tag }}
      stage: ${{ matrix.line.stage }}
      minutes: ${{ inputs.minutes }}
      next: ''
    secrets: inherit
  again:
    # Oct 28 (HQ 12:50 PM): an area STOPPED only because the USGS water map did not answer is PARKED while the queue goes on,
    # then tried ONCE more at the end from its own bundle (@worker: the saved water tiles + answers are reused, only the missing
    # tiles are asked). Round 1 never starts another round.
    needs: [plan, line]
    # Nov 12: !cancelled() (was always()): a cancelled run (by hand, or broke's stop after two breaks in a row) saves nothing here and
    # starts no retry round; a FAILED line still lets it run (a broken area is recorded, the queue moves on, the water retry is intended)
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.round == '0' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LINES: ${{ needs.plan.outputs.lines }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Far-spot hold + parcel check + layered-land list (chat 2, Oct 29; Brandon 8:07 AM + chat 8)
        # a live row 100+ km from a state-level park's pin is held, then the official map decides (the park's own record holds
        # the spot = released); every federal x state pair is appended to data/fers/layered.json with PAD-US owner at the patch
        id: kept_green_1
        continue-on-error: true
        run: |
          # Oct 29 8:30 PM (HQ release order, step 3): far-spot hold + parcel check RETIRED: the Rule G key (G-1 / R-G7 / R-G8)
          # now keeps far and wrong pieces out of the outlines themselves, so the 2-fer rows no longer need this second guard
          NET=1 MINUTES=20 python3 links/.github/scripts/kpc_fers_layered.py data/fers data/parkinfo || { kpc_rc=$?; echo "::error title=kpc_fers_layered.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers_layered.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          git config user.name kpc-bot; git config user.email bot@kpc.local
          LINKS=links python3 .github/scripts/kpc_waiting_room.py divert data/fers || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 29: a changed US/CA 2-fer file waits for chat 11 (the layered list stays live)
          git add data/fers data/waiting && git commit -qm "2-fer: far-spot check + layered-land list" || true   # ok: nothing to commit is fine
          git pull -q --rebase || { kpc_rc=$?; echo "::warning title=git fetch::git could not fetch or merge the newest main (exit $kpc_rc)"; echo "git fetch - git could not fetch or merge the newest main (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; git push -q || { kpc_rc=$?; echo "::error title=git push::a push failed (exit $kpc_rc); this run is NOT saved"; echo "git push - a push failed (exit $kpc_rc); this run is NOT saved" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: The one big 'needs a human look' list from every area's file
        id: kept_green_2
        continue-on-error: true
        run: |
          COMBINE_ONLY=1 OUT=data/fers python3 links/.github/scripts/kpc_fers_review.py || { kpc_rc=$?; echo "::error title=kpc_fers_review.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers_review.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          git config user.name kpc-bot; git config user.email bot@kpc.local
          # Nov 1 (chat 10 storage step 1): the combined list lives on branch tools-out (fers/review-all.*), not main
          ( git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git worktree add -q -B tools-out ../to origin/tools-out || exit 0
            mkdir -p ../to/fers && cp data/fers/review-all.json data/fers/review-all.md ../to/fers/ 2>/dev/null; cd ../to && git add fers && git commit -qm "2-fer review list: combined" && { saved=0; for i in 1 2 3 4 5; do git push -q origin HEAD:tools-out && { saved=1; break; }; git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git rebase -q origin/tools-out; sleep 7; done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; } ) || true   # ok: nothing new to commit; a lost save is reported by the loop itself
          git rm -q --cached --ignore-unmatch data/fers/review-all.json data/fers/review-all.md && git commit -qm "2-fer review list moved to tools-out" || true   # ok: nothing to commit is fine
          git pull -q --rebase || { kpc_rc=$?; echo "::warning title=git fetch::git could not fetch or merge the newest main (exit $kpc_rc)"; echo "git fetch - git could not fetch or merge the newest main (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; git push -q || { kpc_rc=$?; echo "::error title=git push::a push failed (exit $kpc_rc); this run is NOT saved"; echo "git push - a push failed (exit $kpc_rc); this run is NOT saved" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Areas parked on the water map -> one more round
        run: |
          python3 - <<'PY' > again.txt
          import json, os
          out = []
          # KPC owner, 2026-11-12: a line the memory guard stopped in THIS run is never retried on the same cut (it would die the same
          # way): it is listed as 'needs a smaller cut or more memory' (data/status/line-breaks.json, written by the line's 'broke' job)
          try: B = [x for x in json.load(open('data/status/line-breaks.json')) if isinstance(x, dict) and x.get('why') == 'memory' and str(x.get('run')) == os.environ.get('GITHUB_RUN_ID')]
          except Exception: B = []
          mem = sorted({x.get('tag') for x in B})
          if mem and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Stopped by the memory guard (needs a smaller cut or more memory; not retried):** ' + ', '.join(mem) + '\n')
          for l in json.loads(os.environ['LINES']):
              if l['tag'] in mem: continue
              try: v = json.load(open(f"data/fers/line-{l['tag']}.json"))
              except Exception: continue
              why = v.get('why') or []
              # Oct 28 10:31 PM: an area held (fully or in part) ONLY on water gets one retry round
              if v.get('verdict') in ('STOPPED', 'PART READY FOR CHAT 8') and why and all(str(w).startswith(('water service', 'water not checked')) for w in why):
                  out.append(f"{l['states']}|{l['tag']}@worker")
          print('; '.join(out))
          PY
          A=$(cat again.txt); echo "::notice title=2-fer lines::parked on the USGS water map: ${A:-none}"
          if [ -n "$A" ]; then gh workflow run kpc-fers-lines.yml -R "${{ github.repository }}" -f "areas=$A" -f round=1 -f minutes=${{ inputs.minutes }} && echo "::notice title=2-fer lines::retry round started for: $A"; fi
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
