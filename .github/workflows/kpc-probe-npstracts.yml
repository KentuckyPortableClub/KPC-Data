# TEMP PROBE (chat 2, Oct 28 2026; HQ 4:43 PM): the Park Service's OWN land tracts (Land Resources Division) at Mammoth Cave's
# Green River: which layer, which fields, does a tract cover the river channel? Never fails; deleted after reading.
name: Probe NPS tracts (temp)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          UA = {'User-Agent': 'KPC probe (kentuckyportableclub.github.io)'}
          def J(u, p=None):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u + ('?' + urllib.parse.urlencode(p) if p else ''), headers=UA), timeout=60) as r: return json.loads(r.read())
              except Exception as e: return {'error': str(e)[:150]}
          def N(m): print('::notice title=NPS tracts::' + str(m)[:3900], flush=True)
          s = J('https://www.arcgis.com/sharing/rest/search', {'q': 'NPS Land Resources Division tract', 'f': 'json', 'num': 20})
          cands = [(i.get('title'), i.get('url'), i.get('owner')) for i in s.get('results', []) if i.get('url')]
          N('search: ' + json.dumps(cands)[:3000])
          urls = [c[1] for c in cands] + ['https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/NPS_Land_Resources_Division_Boundary_and_Tract_Data_Service/FeatureServer']
          seen = set()
          for u in urls:
              if not u or u in seen or 'FeatureServer' not in u and 'MapServer' not in u: continue
              seen.add(u); m = J(u, {'f': 'json'})
              lays = m.get('layers') or []
              N(f"{u}: layers {[(l.get('id'), l.get('name')) for l in lays][:20]} {m.get('error', '')}")
              for l in lays:
                  if 'tract' not in (l.get('name') or '').lower(): continue
                  lu = f"{u}/{l['id']}"; lm = J(lu, {'f': 'json'})
                  N(f"{lu} fields: {[f['name'] for f in lm.get('fields') or []][:40]}")
                  for nm, pt in (('river channel', '-86.1505,37.1863'), ('river 2', '-86.2050,37.1985'), ('bank', '-86.1490,37.1900')):
                      q = J(lu + '/query', {'geometry': pt, 'geometryType': 'esriGeometryPoint', 'inSR': 4326, 'spatialRel': 'esriSpatialRelIntersects', 'outFields': '*', 'returnGeometry': 'false', 'f': 'json'})
                      N(f"{nm} {pt}: {json.dumps([f.get('attributes') for f in q.get('features') or []])[:1500]} {q.get('error', '')}")
                  q = J(lu + '/query', {'where': "UNIT_CODE = 'MACA'", 'returnCountOnly': 'true', 'f': 'json'})
                  N(f"MACA tracts: {q}")
          PY
