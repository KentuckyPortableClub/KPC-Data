name: KPC US access points
# Step B5 (chat 2, Oct 27): MOVED from KPC-Links. Checks out KPC-Links read-only (scripts + the data that stays there), lays
# KPC-Data's moved data over it (kpc_overlay.sh), runs, and saves data/access/ HERE (kpc_push_data.sh: only this job's files, no
# rebase). Never fails.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '41 8 6 * *'          # monthly, the 6th (after the US key on the 1st)
  workflow_dispatch:
    inputs:
      states:
        description: 'States, e.g. "MO PA" (blank = every state in data/access-layers.json)'
        default: ''
      full:
        description: 'Rebuild every state even when its layers are unchanged'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-us-access
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Get the scripts and park data (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data)
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay this repo's data over the checkout
        run: touch /tmp/kpc-start; bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Fetch the saved park outlines
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache/us cache/ca
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-*.json.gz' -D cache/us --clobber || echo "::warning title=download::a download failed (exit $?); results may use old or missing files"
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'CA-ALL.json.gz' -D cache/ca --clobber || echo "::warning title=download::a download failed (exit $?); results may use old or missing files"
      - name: Outside research parking files (branch intake-files; HQ Oct 31 7:55 PM, the bot pulls them itself)
        id: kept_green_2
        continue-on-error: true
        run: |
          (cd kpcdata && python3 .github/scripts/kpc_intake_reader.py parking && python3 .github/scripts/kpc_intake_reader.py parking-layers ../data/access-layers.json) || echo "::error title=kpc_intake_reader.py::stopped with an error (exit $?), see the log above"
      - name: Build the access points
        id: kept_green_3
        continue-on-error: true
        env:
          STATES: ${{ inputs.states }}
          FULL: ${{ inputs.full && '1' || '' }}
          MINUTES: '150'
        run: python3 .github/scripts/kpc_us_access.py || echo "::error title=kpc_us_access.py::stopped with an error (exit $?), see the log above"
      - name: Save (once)
        if: always()
        id: kept_green_4
        continue-on-error: true
        run: |
          # Oct 29 (Brandon's GO, the WAITING ROOM PILOT): changed access files no longer go live directly. They go to
          # data/waiting/in/, and the waiting room (kpc_waiting_room.py, Rule Sheet F) promotes each one that passes; a held file
          # stays waiting (the old one stays live) and a look line goes to chat 11 (data/status/inbox-checkers.md).
          mkdir -p kpcdata/data/waiting/in/data/access; n=0
          for f in data/access/*.json; do b=$(basename "$f"); if ! cmp -s "$f" "kpcdata/data/access/$b"; then cp "$f" "kpcdata/data/waiting/in/data/access/$b"; n=$((n+1)); fi; done
          echo "::notice title=Waiting room pilot::$n changed access files sent to the waiting room"
          (cd kpcdata && LINKS=.. NET=1 WAITING_ON=1 PROMOTE_KINDS=access,info python3 .github/scripts/kpc_waiting_room.py check --promote) || echo "::error title=kpc_waiting_room.py::stopped with an error (exit $?), see the log above"
          for f in data/status/*.json; do [ "$f" -nt /tmp/kpc-start ] && ! cmp -s "$f" "kpcdata/$f" && mkdir -p kpcdata/data/status && cp "$f" "kpcdata/$f"; done; true
          # Oct 28 self-grade: one 'grade me' (or 'FAILED its gate') line per batch for the checkers (data/status/inbox-checkers.md)
          if [ -s /tmp/kpc-gate.txt ]; then IFS=$'\t' read -r G A N < /tmp/kpc-gate.txt
            if [ "$G" = PASS ]; then STATUS_DIR=kpcdata/data/status python3 kpcdata/.github/scripts/kpc_status.py grade-me "kpc_us_access" "${A:-all}" "data/access/" "$N"
            else STATUS_DIR=kpcdata/data/status python3 kpcdata/.github/scripts/kpc_status.py gate "kpc_us_access" "${A:-all}" FAIL "$N"; fi; fi; true
          bash .github/scripts/kpc_push_data.sh kpcdata "US access points: parking, entrances, ramps" data
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
