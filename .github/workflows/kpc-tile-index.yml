name: KPC tile index (nightly)
# Nov 1 2026 (chat 3, Brandon: 'skip quietly' the map tiles for areas that have none): writes data/pota|sota|wwff/tiles.json =
# {updated, keys: ["37_-86", ...]} from the tiles that exist, so the site only asks for real tiles (no 404s). Never goes red.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '46 7 * * *'   # G9 Nov 2: was '47 7 * * *' (spread the start times; now 1 min earlier)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-tile-index
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        id: kept_green_1
        continue-on-error: true
        with:
          filter: blob:none
          sparse-checkout: |
            data/pota/tiles.json
            data/sota/tiles.json
            data/wwff/tiles.json
          sparse-checkout-cone-mode: false
      - name: Build the three indexes and save
        id: kept_green_2
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for p in pota sota wwff; do
            mkdir -p data/$p
            git ls-tree --name-only HEAD data/$p/t/ | sed -n 's#.*/\([-0-9]*_[-0-9]*\)\.json$#\1#p' | sort | python3 -c "import sys,json,datetime; k=[l.strip() for l in sys.stdin if l.strip()]; json.dump({'updated': datetime.date.today().isoformat(), 'keys': k}, open('data/$p/tiles.json','w'), separators=(',',':')); print('::notice title=tiles $p::%d tiles' % len(k))"
          done
          git add --sparse data/pota/tiles.json data/sota/tiles.json data/wwff/tiles.json 2>/dev/null || true   # ok: an optional path may not exist
          git diff --cached --quiet && exit 0
          git commit -qm 'Tile index (pota / sota / wwff)'
          { for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i*10)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          true
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
