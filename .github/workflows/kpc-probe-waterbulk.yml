# TEMP PROOF (chat 2, Oct 28 2026; HQ 4:05 PM): Kentucky's water from the USGS bulk files gives the SAME answers as the live
# reads saved last night. Never fails; deleted after reading.
name: Probe water bulk files (temp)
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    env: { GH_TOKEN: '${{ github.token }}' }
    steps:
      - uses: actions/checkout@v5
        with: { repository: KentuckyPortableClub/KPC-Links, persist-credentials: false }
      - uses: actions/checkout@v5
        with: { path: kpcdata }
      - run: bash .github/scripts/kpc_overlay.sh kpcdata || true
      - name: Kentucky bundle + both water stores
        run: |
          pip install -q numpy opencv-python-headless || true
          mkdir -p cache/us; gh release download fers-bundles -R KentuckyPortableClub/KPC-Data -p bundle-ky.tar.gz -D . --clobber && tar xzf bundle-ky.tar.gz || true
          gh release download fers-bundles -R KentuckyPortableClub/KPC-Data -p water-ky.tar.gz -D . --clobber && tar xzf water-ky.tar.gz || true
          ls bundle/water | wc -l; mkdir -p bulkwater
          STATES=US-KY WATER_STORE=bulkwater DATA=data/fers python3 .github/scripts/kpc_water_bulk.py || true
          ls bulkwater | wc -l
      - name: Pass 5 offline, live-saved water vs bulk-file water; compare the answers
        run: |
          set +e
          cp -r data/fers in5
          for W in live bulk; do
            rm -rf data/fers; cp -r in5 data/fers
            ST=bundle/water; [ $W = bulk ] && ST=bulkwater
            HTTP_CACHE=bundle/http HTTP_OFFLINE=1 WATER_STORE=$ST REGION=ky STATES=US-KY RUN_TAG=ky PASS=5 MINUTES=60 python3 .github/scripts/kpc_fers.py > p5-$W.log 2>&1
            cp data/fers/US-KY.json ky-$W.json
          done
          python3 - <<'PY'
          import json
          a = {s['id']: s for s in json.load(open('ky-live.json'))['spots']}; b = {s['id']: s for s in json.load(open('ky-bulk.json'))['spots']}
          d = [k for k in a if str(a[k].get('status')) != str(b.get(k, {}).get('status'))]
          print(f"::notice title=water bulk proof::Kentucky pass 5: {len(a)} rows; status differs on {len(d)} (live-saved water vs USGS bulk files)")
          for k in d[:8]: print(f"::notice title=water bulk proof::{k}: live '{str(a[k].get('status'))[:60]}' vs bulk '{str(b.get(k, {}).get('status'))[:60]}'")
          PY
