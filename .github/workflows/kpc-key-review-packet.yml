name: KPC key review packet (by hand only)
# Two uses, both started by hand. No timer. It starts nothing else, posts nothing, and writes no other branch.
# pr: compare a KPC-Links pull request's key build with the shared starting point. Folder
#     key-quality/review-packets/pr-<number>-<first 7 of the new commit>/.
# run: after a full US key run, compare that run with the published key. No builds. The new side is
#     data/us-key at the published commit, with the key-held release file laid over the states the run held back.
#     Folder key-quality/review-packets/run-<date>/.
# A failed step is caught and the run stays green. The last step of every job reports those catches.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'pr compares one pull request and builds its states; run compares a full key run with the published key and does not build'
        required: false
        default: pr
        type: choice
        options:
          - pr
          - run
      pr:
        description: 'KPC-Links pull request number; leave blank for a key run'
        required: false
        default: ''
        type: string
      head:
        description: 'new commit (40 characters). For a pull request this overrides the head. For a key run this overrides the published key; leave blank to use the default branch'
        required: false
        default: ''
        type: string
      base:
        description: 'old commit (40 characters). For a pull request this overrides the shared starting point. For a key run this is the published key the run is compared with, and it is required'
        required: false
        default: ''
        type: string
      states:
        description: 'states, for example AK ID; leave blank to use the new scope entries, or every state on a key run'
        required: false
        default: ''
        type: string
      folder:
        description: 'key run only: the tools-out folder under key-quality/ (for example 2026-11-19/public-vs-working); blank = review-packets/run-<date>'
        required: false
        default: ''
        type: string
# Read only, except the save job, which is the only one that can write the repo.
permissions:
  contents: read
concurrency:
  group: kpc-key-review-packet
  cancel-in-progress: false
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      go: ${{ steps.out.outputs.go }}
      mode: ${{ steps.out.outputs.mode }}
      states: ${{ steps.out.outputs.states }}
      entries: ${{ steps.out.outputs.entries }}
      states_from: ${{ steps.out.outputs.states_from }}
      new_sha: ${{ steps.out.outputs.new_sha }}
      old_sha: ${{ steps.out.outputs.old_sha }}
      pr: ${{ steps.out.outputs.pr }}
      build_date: ${{ steps.out.outputs.build_date }}
    steps:
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          path: kpcdata
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: The script checks itself
        id: selftest
        continue-on-error: true
        run: |
          python3 kpcdata/.github/scripts/kpc_key_review_packet.py --selftest || { echo "::warning title=Self test::the script's own checks failed"; echo "Self test - the script's own checks failed" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit 1; }
      - name: The two commits
        id: ids
        if: steps.selftest.outcome == 'success'
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
          PR_IN: ${{ inputs.pr }}
          HEAD_IN: ${{ inputs.head }}
          BASE_IN: ${{ inputs.base }}
          GH_TOKEN: ${{ github.token }}
        run: |
          warn() { echo "::warning title=${1}::${2}"; echo "$1 - $2" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          is_sha() { printf '%s' "$1" | grep -Eq '^[0-9a-fA-F]{40}$'; }
          if [ "${MODE:-pr}" = run ]; then
            is_sha "$BASE_IN" || { warn "Commit" "a key run needs the published key commit, 40 characters, in the old commit box"; exit 1; }
            new="$HEAD_IN"
            if [ -z "$new" ]; then
              branch=$(gh api repos/KentuckyPortableClub/KPC-Links --jq .default_branch) || { warn "Commit" "the published key branch could not be read"; exit 1; }
              case "$branch" in
                *[!A-Za-z0-9._/-]*) warn "Commit" "the published key branch name is not a plain name"; exit 1;;
              esac
              enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")
              new=$(gh api "repos/KentuckyPortableClub/KPC-Links/commits/${enc}" --jq .sha) || { warn "Commit" "the published key commit could not be read"; exit 1; }
            fi
            is_sha "$new" || { warn "Commit" "the new commit is not a 40-character id"; exit 1; }
            echo "new_sha=$new" >> "$GITHUB_OUTPUT"
            echo "old_sha=$BASE_IN" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "New commit $new"
            echo "Old commit $BASE_IN"
            exit 0
          fi
          case "$PR_IN" in
            ''|*[!0-9]*) warn "Pull request" "the pull request number is not a number"; exit 1;;
          esac
          pr_json=$(gh api "repos/KentuckyPortableClub/KPC-Links/pulls/${PR_IN}") || { warn "Pull request" "that pull request could not be read"; exit 1; }
          repo=$(printf '%s' "$pr_json" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=(d.get("head") or {}).get("repo") or {}; print(r.get("full_name") or "")')
          if [ "$repo" != "KentuckyPortableClub/KPC-Links" ]; then warn "Pull request" "that pull request is not from KentuckyPortableClub/KPC-Links"; exit 1; fi
          head="$HEAD_IN"
          base="$BASE_IN"
          if [ -z "$head" ]; then
            head=$(printf '%s' "$pr_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head"]["sha"])') || { warn "Pull request" "the new commit could not be read"; exit 1; }
          fi
          is_sha "$head" || { warn "Commit" "the new commit is not a 40-character id"; exit 1; }
          if [ -z "$base" ]; then
            bref=$(gh api "repos/KentuckyPortableClub/KPC-Links/pulls/${PR_IN}" --jq .base.ref) || { warn "Pull request" "the base branch could not be read"; exit 1; }
            case "$bref" in
              *[!A-Za-z0-9._/-]*) warn "Base branch" "the base branch name is not a plain name"; exit 1;;
            esac
            bref_enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=""))' "$bref")
            base=$(gh api "repos/KentuckyPortableClub/KPC-Links/compare/${bref_enc}...${head}" --jq .merge_base_commit.sha) || { warn "Commits" "the shared starting commit could not be read"; exit 1; }
          fi
          is_sha "$base" || { warn "Commit" "the old commit is not a 40-character id"; exit 1; }
          echo "new_sha=$head" >> "$GITHUB_OUTPUT"
          echo "old_sha=$base" >> "$GITHUB_OUTPUT"
          echo "pr=$PR_IN" >> "$GITHUB_OUTPUT"
          echo "New commit $head"
          echo "Old commit $base"
      - uses: actions/checkout@v5
        continue-on-error: true
        id: oldtree
        if: steps.ids.outcome == 'success'
        with:
          repository: KentuckyPortableClub/KPC-Links
          ref: ${{ steps.ids.outputs.old_sha }}
          path: old
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/us-key-rule-scope.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v5
        continue-on-error: true
        id: newtree
        if: steps.ids.outcome == 'success'
        with:
          repository: KentuckyPortableClub/KPC-Links
          ref: ${{ steps.ids.outputs.new_sha }}
          path: new
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/us-key-rule-scope.json
          sparse-checkout-cone-mode: false
      - name: Which states this pull request builds
        id: scope
        if: steps.ids.outcome == 'success'
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
          STATES_IN: ${{ inputs.states }}
          OLD_SHA: ${{ steps.ids.outputs.old_sha }}
          NEW_SHA: ${{ steps.ids.outputs.new_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          warn() { echo "::warning title=${1}::${2}"; echo "$1 - $2" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          if [ "${MODE:-pr}" = run ]; then
            gh api "repos/KentuckyPortableClub/KPC-Links/contents/data/us-key?ref=${NEW_SHA}" --jq '.[].name' > "$RUNNER_TEMP/key-names.txt" || { warn "States" "the key folder could not be listed"; exit 1; }
            python3 kpcdata/.github/scripts/kpc_key_review_packet.py states --names "$RUNNER_TEMP/key-names.txt" --states "$STATES_IN" --json-out "$RUNNER_TEMP/scope.json"
            rc=$?
            if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then warn "States" "the state list could not be read"; exit 1; fi
            exit 0
          fi
          grab() {
            dest="$1"; tree="$2"; sha="$3"
            if [ -s "$tree/.github/us-key-rule-scope.json" ]; then cp "$tree/.github/us-key-rule-scope.json" "$dest"; return 0; fi
            gh api -H "Accept: application/vnd.github.raw" "repos/KentuckyPortableClub/KPC-Links/contents/.github/us-key-rule-scope.json?ref=${sha}" > "$dest"
          }
          grab "$RUNNER_TEMP/scope-old.json" old "$OLD_SHA" || { warn "Scope" "the old scope file could not be read"; exit 1; }
          grab "$RUNNER_TEMP/scope-new.json" new "$NEW_SHA" || { warn "Scope" "the new scope file could not be read"; exit 1; }
          python3 kpcdata/.github/scripts/kpc_key_review_packet.py scope --old "$RUNNER_TEMP/scope-old.json" --new "$RUNNER_TEMP/scope-new.json" --states "$STATES_IN" --json-out "$RUNNER_TEMP/scope.json"
          rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 2 ]; then warn "Scope" "the scope file could not be compared"; exit 1; fi
          exit 0
      - name: Hand the states to the build
        id: out
        if: always()
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode }}
          NEW_SHA: ${{ steps.ids.outputs.new_sha }}
          OLD_SHA: ${{ steps.ids.outputs.old_sha }}
          PRN: ${{ steps.ids.outputs.pr }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, pathlib
          rt = pathlib.Path(os.environ.get('RUNNER_TEMP') or '/tmp')
          mode = os.environ.get('MODE') or 'pr'
          if mode not in ('pr', 'run'): mode = 'pr'
          go, states, entries, states_from, message, notes = 'no', '[]', '[]', '', '', []
          scope = rt / 'scope.json'
          if scope.is_file():
              d = json.loads(scope.read_text(encoding='utf-8'))
              st = d.get('states') or []
              if st:
                  go, states = 'yes', json.dumps(st)
              entries = json.dumps(d.get('entries') or [])
              states_from = d.get('states_from') or ''
              message = d.get('message') or ''
              notes = d.get('notes') or []
          new, old, pr = (os.environ.get(k) or '' for k in ('NEW_SHA', 'OLD_SHA', 'PRN'))
          if go == 'yes' and (len(new) != 40 or len(old) != 40):
              go = 'no'
              message = message or 'the two commits were not both read'
          if go == 'yes' and mode != 'run' and not str(pr).isdigit():
              go = 'no'
              message = message or 'the pull request number was not read'
          build_date = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          lines = [f'go={go}', f'mode={mode}', f'new_sha={new}', f'old_sha={old}', f'pr={pr}', f'states_from={states_from}', f'build_date={build_date}']
          for name, value in (('states', states), ('entries', entries)):
              lines += [f'{name}<<EOF', value, 'EOF']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write('\n'.join(lines) + '\n')
          text = message
          if notes: text = (text + '\n' if text else '') + '\n'.join(notes)
          if go == 'yes':
              label = 'States to compare: ' if mode == 'run' else 'States to build: '
              text = (text + '\n' if text else '') + label + ' '.join(json.loads(states))
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary and text: open(summary, 'a', encoding='utf-8').write(text + '\n')
          if message: print(message)
          print('go=' + go)
          PY
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # The errors a step caught itself are listed too, and one Hidden failures line is left for the check-up.
          # A job marked safe to fail (KPC_FAIL_SAFE=1, it starts nothing after it) goes red on a caught error.
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY

  build:
    needs: scope
    if: needs.scope.outputs.go == 'yes' && needs.scope.outputs.mode != 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 140
    strategy:
      fail-fast: false
      matrix:
        state: ${{ fromJSON(needs.scope.outputs.states) }}
    steps:
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          path: kpcdata
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: KentuckyPortableClub/KPC-Links
          ref: ${{ needs.scope.outputs.old_sha }}
          path: old
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: KentuckyPortableClub/KPC-Links
          ref: ${{ needs.scope.outputs.new_sha }}
          path: new
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Saved shapes for this state
        id: shapes
        continue-on-error: true
        env:
          STATE: ${{ matrix.state }}
          GH_TOKEN: ${{ github.token }}
        run: |
          warn() { echo "::warning title=${1}::${2}"; echo "$1 - $2" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          case "$STATE" in
            [A-Z][A-Z]) ;;
            *) warn "Shapes" "the state is not a two-letter code"; exit 1;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/shapes"
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p "US-${STATE}.json.gz" -p "hand-US-${STATE}.*" -D "$GITHUB_WORKSPACE/shapes" || { warn "Shapes" "saved shapes for ${STATE} could not be downloaded"; exit 1; }
          if [ ! -s "$GITHUB_WORKSPACE/shapes/US-${STATE}.json.gz" ]; then warn "Shapes" "US-${STATE}.json.gz is missing"; exit 1; fi
      - name: Build this state, old and new side by side
        id: build
        continue-on-error: true
        timeout-minutes: 120
        env:
          STATE: ${{ matrix.state }}
          BUILD_DATE: ${{ needs.scope.outputs.build_date }}
        run: |
          warn() { echo "::warning title=${1}::${2}"; echo "$1 - $2" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          case "$STATE" in
            [A-Z][A-Z]) ;;
            *) warn "Build" "the state is not a two-letter code"; exit 1;;
          esac
          case "$BUILD_DATE" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) warn "Build" "the build date is missing, so this state was not built"; exit 1;;
          esac
          SHAPE="$GITHUB_WORKSPACE/shapes"
          WORK="$GITHUB_WORKSPACE/work"
          mkdir -p "$WORK/pack"
          printf '%s\n' "{\"state\":\"${STATE}\",\"result\":\"running\"}" > "$WORK/pack/status.json"
          if [ ! -s "$SHAPE/US-${STATE}.json.gz" ]; then warn "Shapes" "US-${STATE}.json.gz is missing"; exit 1; fi
          ( cd "$GITHUB_WORKSPACE/old" && bash .github/scripts/kpc_overlay.sh "$GITHUB_WORKSPACE/kpcdata" ) || { warn "Park data" "the old tree could not take the park data"; exit 1; }
          ( cd "$GITHUB_WORKSPACE/new" && bash .github/scripts/kpc_overlay.sh "$GITHUB_WORKSPACE/kpcdata" ) || { warn "Park data" "the new tree could not take the park data"; exit 1; }
          run_side() {
            tree="$1"; log="$2"; codefile="$3"; offlog="$4"
            (
              cd "$tree" || { echo 97 > "$codefile"; exit 0; }
              unset KPC_NO_ALL_PATHS KPC_NO_BY_NAME KPC_ID_JOIN_NAME KPC_REFOUND_NEAR KPC_SELF_CHECKS KPC_CONF_SORT KPC_PADUS_DEDUPE KPC_PIECE_NAME KPC_NO_OFFICE_JOIN KPC_SAVED_ID_LAND KPC_ONE_RECORD_ONE_PARK KPC_NO_LEASE_BY_NAME KPC_LAKE_ONLY_IF_LAKE KPC_DESIGNATION_SPLIT KPC_NPS_UNIT_CODE KPC_FS_RIVER_NAMES KPC_G8_OTHER_PLACE KPC_MEASURED_ACRES KPC_CA_NONE_KEPT KPC_CA_SAVED_ID_LAND KPC_JP_A10_NAMES KPC_MK_LAYER_93 KPC_AGENCY_TIE KPC_STATE_COPY KPC_WORLD_NEAR_NAME KPC_APPROX_PIN KPC_PRESERVE_APART FINISH_ONLY SHADOW NAME_JOIN KPC_KEY_ONLY_PARKS KPC_KEY_ONLY_STATES KPC_REFILL_ONLY KPC_LAYER_IN KPC_LAYER_OUT KPC_REFILL_FORCE ANSWER_SHEET_FILE ANSWER_SHEET_CHECK
              timeout 100m env -u GH_TOKEN -u GITHUB_TOKEN \
                KPC_KEY_REMATCH_IDS=1 \
                KPC_KEY_OFFLINE=1 \
                KPC_MASTER_OWNS=1 \
                GEO_CACHE_MODE=only \
                GEO_CACHE="$SHAPE" \
                GEO_DETAIL=0.001 \
                GEO_PAGE=200 \
                KPC_ANSWER_SHEET=off \
                PYTHONHASHSEED=0 \
                PYTHONDONTWRITEBYTECODE=1 \
                MINUTES=600 \
                KPC_BUILD_DATE="$BUILD_DATE" \
                KPC_OFFLINE_LOG="$offlog" \
                STATES="$STATE" \
                python3 .github/scripts/kpc_us_key.py > "$log" 2>&1
              echo $? > "$codefile"
            )
          }
          echo "Building ${STATE}, old and new, side by side."
          run_side "$GITHUB_WORKSPACE/old" "$WORK/old.log" "$WORK/old.exit" "$WORK/old-offline.txt" &
          run_side "$GITHUB_WORKSPACE/new" "$WORK/new.log" "$WORK/new.exit" "$WORK/new-offline.txt" &
          wait
          old_exit=$(cat "$WORK/old.exit" 2>/dev/null || echo 1)
          new_exit=$(cat "$WORK/new.exit" 2>/dev/null || echo 1)
          python3 "$GITHUB_WORKSPACE/kpcdata/.github/scripts/kpc_key_review_packet.py" judge \
            --state "$STATE" --old-exit "$old_exit" --new-exit "$new_exit" \
            --old-log "$WORK/old.log" --new-log "$WORK/new.log" \
            --old-key "$GITHUB_WORKSPACE/old/data/us-key/US-${STATE}.json" \
            --new-key "$GITHUB_WORKSPACE/new/data/us-key/US-${STATE}.json" \
            --out "$WORK/status.json" || true
          result=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("result","failed"))' "$WORK/status.json" 2>/dev/null || echo failed)
          cp "$WORK/status.json" "$WORK/old.log" "$WORK/new.log" "$WORK/pack/" 2>/dev/null || true
          if [ "$result" = ok ]; then
            cp "$GITHUB_WORKSPACE/old/data/us-key/US-${STATE}.json" "$WORK/pack/US-${STATE}-old.json" || result=failed
            cp "$GITHUB_WORKSPACE/new/data/us-key/US-${STATE}.json" "$WORK/pack/US-${STATE}-new.json" || result=failed
          fi
          echo "last lines of the old build:"
          tail -15 "$WORK/old.log" 2>/dev/null || true
          echo "last lines of the new build:"
          tail -15 "$WORK/new.log" 2>/dev/null || true
          if [ "$result" != ok ]; then warn "Build ${STATE}" "the ${STATE} build did not finish (${result})"; exit 1; fi
      - name: Keep this state's files for the packet
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: key-${{ matrix.state }}
          path: work/pack
          if-no-files-found: warn
          retention-days: 7
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # The errors a step caught itself are listed too, and one Hidden failures line is left for the check-up.
          # A job marked safe to fail (KPC_FAIL_SAFE=1, it starts nothing after it) goes red on a caught error.
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY

  packet:
    needs: [scope, build]
    if: ${{ !cancelled() && needs.scope.outputs.go == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          path: kpcdata
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: KentuckyPortableClub/KPC-Links
          ref: ${{ needs.scope.outputs.old_sha }}
          path: old
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github
            data/us-key
          sparse-checkout-cone-mode: true
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          repository: KentuckyPortableClub/KPC-Links
          ref: ${{ needs.scope.outputs.new_sha }}
          path: new
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            .github
            data/us-key
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      - name: Gather the state builds
        id: gather
        if: needs.scope.outputs.mode != 'run'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: builds
          pattern: key-*
          merge-multiple: false
      - name: Saved shapes, the gold file, and the fact check library
        id: inputs
        continue-on-error: true
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: |
          warn() { echo "::warning title=${1}::${2}"; echo "$1 - $2" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          mkdir -p "$GITHUB_WORKSPACE/work/shapes"
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-*.json.gz' -p 'hand-US-*' -D "$GITHUB_WORKSPACE/work/shapes" || warn "Shapes" "the saved shapes could not be downloaded"
          gh api repos/KentuckyPortableClub/KPC-Links/releases/tags/boundary-cache --jq '[.assets[] | {name,created_at,size}]' > "$GITHUB_WORKSPACE/work/assets.json" || warn "Shapes" "the shape dates could not be read"
          if [ "${MODE:-pr}" = run ]; then
            mkdir -p "$GITHUB_WORKSPACE/work/held"
            gh release download key-held -R KentuckyPortableClub/KPC-Links -p 'key-held.tar.gz' -D "$GITHUB_WORKSPACE/work/held" || warn "Held key" "the held key could not be downloaded"
            gh api repos/KentuckyPortableClub/KPC-Links/releases/tags/key-held --jq '{tag:.tag_name, assets:[.assets[] | {name,created_at,size}]}' > "$GITHUB_WORKSPACE/work/held-release.json" || warn "Held key" "the held key date could not be read"
          fi
          git -C "$GITHUB_WORKSPACE/kpcdata" fetch -q --depth 1 origin "+refs/heads/tools-out:refs/remotes/origin/tools-out" || warn "Gold file" "the tools-out branch could not be read"
          git -C "$GITHUB_WORKSPACE/kpcdata" show "origin/tools-out:key-quality/gold-us.json" > "$GITHUB_WORKSPACE/work/gold-us.json" || warn "Gold file" "the gold file could not be read"
          python3 -m pip install -q shapely || warn "Shapely" "shapely did not install; the fact check still runs"
      - name: Fact check, gold score, and the packet
        id: packet
        if: needs.scope.outputs.mode != 'run'
        continue-on-error: true
        env:
          STATES_JSON: ${{ needs.scope.outputs.states }}
          ENTRIES_JSON: ${{ needs.scope.outputs.entries }}
          STATES_FROM: ${{ needs.scope.outputs.states_from }}
          HEAD: ${{ needs.scope.outputs.new_sha }}
          OLD: ${{ needs.scope.outputs.old_sha }}
          PRN: ${{ needs.scope.outputs.pr }}
          BUILD_DATE: ${{ needs.scope.outputs.build_date }}
        run: |
          warn() { echo "::warning title=${1}::${2}"; echo "$1 - $2" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          WORK="$GITHUB_WORKSPACE/work"
          mkdir -p "$WORK/old-keys" "$WORK/new-keys" "$WORK/fc-old" "$WORK/fc-new" "$WORK/gold-old" "$WORK/gold-new" "$WORK/packet"
          if [ -d "$GITHUB_WORKSPACE/old/data/us-key" ]; then cp -a "$GITHUB_WORKSPACE/old/data/us-key/." "$WORK/old-keys/"; else warn "Keys" "the old key folder was not checked out"; fi
          if [ -d "$GITHUB_WORKSPACE/new/data/us-key" ]; then cp -a "$GITHUB_WORKSPACE/new/data/us-key/." "$WORK/new-keys/"; else warn "Keys" "the new key folder was not checked out"; fi
          areas=""
          states_text=$(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["STATES_JSON"])))')
          for st in $states_text; do
            d="$GITHUB_WORKSPACE/builds/key-${st}"
            result=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("result",""))' "$d/status.json" 2>/dev/null || echo missing)
            if [ "$result" = ok ] && [ -s "$d/US-${st}-old.json" ] && [ -s "$d/US-${st}-new.json" ]; then
              cp "$d/US-${st}-old.json" "$WORK/old-keys/US-${st}.json"
              cp "$d/US-${st}-new.json" "$WORK/new-keys/US-${st}.json"
              areas="$areas US-${st}"
            else
              # a state that did not finish must not be scored from the published file
              rm -f "$WORK/old-keys/US-${st}.json" "$WORK/new-keys/US-${st}.json"
            fi
          done
          if [ -n "$areas" ] && ls "$WORK/shapes"/US-*.json.gz >/dev/null 2>&1; then
            python3 "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_factcheck.py" run --keys "$WORK/old-keys" --cache "$WORK/shapes" --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" --truth "$GITHUB_WORKSPACE/kpcdata/data/truth" --areas "$areas" --out "$WORK/fc-old" || warn "Fact check" "the old fact check did not finish"
            python3 "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_factcheck.py" run --keys "$WORK/new-keys" --cache "$WORK/shapes" --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" --truth "$GITHUB_WORKSPACE/kpcdata/data/truth" --areas "$areas" --out "$WORK/fc-new" || warn "Fact check" "the new fact check did not finish"
            if [ -s "$WORK/gold-us.json" ]; then
              python3 "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_grade.py" gold --gold "$WORK/gold-us.json" --keys "$WORK/old-keys" --cache "$WORK/shapes" --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" --out "$WORK/gold-old" || warn "Gold score" "the old gold score did not finish"
              python3 "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_grade.py" gold --gold "$WORK/gold-us.json" --keys "$WORK/new-keys" --cache "$WORK/shapes" --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" --out "$WORK/gold-new" || warn "Gold score" "the new gold score did not finish"
            fi
          fi
          python3 - <<'PY'
          import json, os, pathlib
          work = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'work'
          meta = {
              'pr': os.environ.get('PRN') or '',
              'head': os.environ.get('HEAD') or '',
              'old': os.environ.get('OLD') or '',
              'build_date': os.environ.get('BUILD_DATE') or '',
              'entries': json.loads(os.environ.get('ENTRIES_JSON') or '[]'),
              'states_from': os.environ.get('STATES_FROM') or '',
              'gold_file': 'key-quality/gold-us.json',
              'gold_commit': '',
          }
          import subprocess
          def git(*args):
              r = subprocess.run(['git', '-C', os.environ['GITHUB_WORKSPACE'] + '/kpcdata', *args], capture_output=True, text=True)
              return r.stdout.strip() if r.returncode == 0 else ''
          meta['data_commit'] = git('rev-parse', 'HEAD')
          meta['gold_commit'] = git('rev-parse', 'origin/tools-out')
          (work / 'meta.json').write_text(json.dumps(meta, indent=1) + '\n', encoding='utf-8')
          PY
          python3 "$GITHUB_WORKSPACE/kpcdata/.github/scripts/kpc_key_review_packet.py" packet \
            --out "$WORK/packet" --states "$states_text" --builds "$GITHUB_WORKSPACE/builds" \
            --fact-old "$WORK/fc-old" --fact-new "$WORK/fc-new" \
            --gold-old "$WORK/gold-old/gold-score.txt" --gold-new "$WORK/gold-new/gold-score.txt" \
            --meta "$WORK/meta.json" --assets "$WORK/assets.json" \
            || { warn "Packet" "the packet was not written"; exit 1; }
          if [ -s "$WORK/packet/summary.md" ]; then cat "$WORK/packet/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Compare the key run, no build
        id: runmode
        if: needs.scope.outputs.mode == 'run'
        continue-on-error: true
        env:
          STATES_JSON: ${{ needs.scope.outputs.states }}
          STATES_FROM: ${{ needs.scope.outputs.states_from }}
          HEAD: ${{ needs.scope.outputs.new_sha }}
          OLD: ${{ needs.scope.outputs.old_sha }}
          BUILD_DATE: ${{ needs.scope.outputs.build_date }}
        run: |
          warn() { echo "::warning title=${1}::${2}"; echo "$1 - $2" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          WORK="$GITHUB_WORKSPACE/work"
          mkdir -p "$WORK/old-keys" "$WORK/new-keys" "$WORK/fc-old" "$WORK/fc-new" "$WORK/gold-old" "$WORK/gold-new" "$WORK/packet"
          if [ -d "$GITHUB_WORKSPACE/old/data/us-key" ]; then cp -a "$GITHUB_WORKSPACE/old/data/us-key/." "$WORK/old-keys/"; else warn "Keys" "the old key folder was not checked out"; fi
          if [ -d "$GITHUB_WORKSPACE/new/data/us-key" ]; then cp -a "$GITHUB_WORKSPACE/new/data/us-key/." "$WORK/new-keys/"; else warn "Keys" "the new key folder was not checked out"; fi
          # 19 Nov (Opus, key-quality.md 19 item 41): the key-held file is replaced only by a run that holds a state, so after a run
          # that held none it is an OLDER run's would-be files (run-2026-11-19 laid the 20:25 UTC files over the 21:52 key). It is laid
          # over only when it was written in the run that made the new side's key: at most 20 minutes before the index 'built' stamp.
          python3 - "$WORK/held-release.json" "$WORK/new-keys/index.json" "$WORK/held/decision.json" <<'PY'
          import datetime, json, pathlib, sys
          def load(p):
              try: return json.loads(pathlib.Path(p).read_text(encoding='utf-8'))
              except (OSError, ValueError): return {}
          rel, idx = load(sys.argv[1]), load(sys.argv[2])
          made = next((a.get('created_at') or '' for a in rel.get('assets') or [] if a.get('name') == 'key-held.tar.gz'), '')
          built = str(idx.get('built') or '')
          out = {'laid': False, 'held_created_at': made, 'key_built': built, 'key_build': idx.get('build') or ''}
          try:
              t_held = datetime.datetime.strptime(made[:19], '%Y-%m-%dT%H:%M:%S')
              t_key = datetime.datetime.strptime(built[:16], '%Y-%m-%d %H:%M')
              gap = (t_key - t_held).total_seconds() / 60
              out['minutes_before_key'] = round(gap, 1)
              out['laid'] = -2 <= gap <= 20
              out['why'] = ('written in the run that made this key' if out['laid'] else
                            f'written {round(gap)} minutes before this key was built: another run\'s held files, not laid over')
          except ValueError:
              out['why'] = 'the held file date or the key build time could not be read: not laid over'
          pathlib.Path(sys.argv[3]).write_text(json.dumps(out, indent=1) + '\n', encoding='utf-8')
          print(out['why'])
          PY
          laid=$(python3 -c 'import json,sys; print("1" if json.load(open(sys.argv[1])).get("laid") else "0")' "$WORK/held/decision.json" 2>/dev/null || echo 0)
          if [ -s "$WORK/held/key-held.tar.gz" ] && [ "$laid" = 1 ]; then
            tar -xzf "$WORK/held/key-held.tar.gz" -C "$WORK/new-keys" || warn "Held key" "the held key could not be laid over the published key"
          elif [ -s "$WORK/held/key-held.tar.gz" ]; then
            echo "::notice title=Held key::$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("why"))' "$WORK/held/decision.json" 2>/dev/null): the new side is the published key only"
          else
            warn "Held key" "the key-held file was not downloaded, so the new side is the published key only"
          fi
          states_text=$(python3 -c 'import json,os; print(" ".join(json.loads(os.environ.get("STATES_JSON") or "[]")))')
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          work = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'work'
          held = {}
          rel = work / 'held-release.json'
          if rel.is_file():
              try: doc = json.loads(rel.read_text(encoding='utf-8'))
              except ValueError: doc = {}
              for item in doc.get('assets') or []:
                  if item.get('name') == 'key-held.tar.gz':
                      held = {'tag': doc.get('tag') or 'key-held', 'name': 'key-held.tar.gz', 'created_at': item.get('created_at') or '', 'size': item.get('size')}
          dec = work / 'held' / 'decision.json'
          if held and dec.is_file():
              try: d = json.loads(dec.read_text(encoding='utf-8'))
              except ValueError: d = {}
              held['laid'] = bool(d.get('laid')); held['why'] = d.get('why') or ''
          meta = {'mode': 'run', 'head': os.environ.get('HEAD') or '', 'old': os.environ.get('OLD') or '',
                  'build_date': os.environ.get('BUILD_DATE') or '', 'states_from': os.environ.get('STATES_FROM') or '', 'key_held': held}
          def git(*args):
              r = subprocess.run(['git', '-C', os.environ['GITHUB_WORKSPACE'] + '/kpcdata', *args], capture_output=True, text=True)
              return r.stdout.strip() if r.returncode == 0 else ''
          meta['data_commit'] = git('rev-parse', 'HEAD')
          (work / 'meta.json').write_text(json.dumps(meta, indent=1) + '\n', encoding='utf-8')
          PY
          # The comparison is written before the fact check, so a slow fact check cannot drop it.
          python3 "$GITHUB_WORKSPACE/kpcdata/.github/scripts/kpc_key_review_packet.py" run \
            --old "$WORK/old-keys" --new "$WORK/new-keys" --cache "$WORK/shapes" \
            --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" \
            --out "$WORK/packet" --states "$states_text" \
            --meta "$WORK/meta.json" --assets "$WORK/assets.json" \
            || { warn "Packet" "the packet was not written"; exit 1; }
          areas=""
          for st in $states_text; do areas="$areas US-${st}"; done
          fact_ok=no
          if [ -n "$areas" ] && ls "$WORK/shapes"/US-*.json.gz >/dev/null 2>&1 && [ -f "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_factcheck.py" ]; then
            timeout 45m env -u GH_TOKEN -u GITHUB_TOKEN python3 "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_factcheck.py" run --keys "$WORK/old-keys" --cache "$WORK/shapes" --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" --truth "$GITHUB_WORKSPACE/kpcdata/data/truth" --areas "$areas" --out "$WORK/fc-old" || warn "Fact check" "the old fact check did not finish"
            timeout 45m env -u GH_TOKEN -u GITHUB_TOKEN python3 "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_factcheck.py" run --keys "$WORK/new-keys" --cache "$WORK/shapes" --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" --truth "$GITHUB_WORKSPACE/kpcdata/data/truth" --areas "$areas" --out "$WORK/fc-new" || warn "Fact check" "the new fact check did not finish"
            if [ -s "$WORK/gold-us.json" ] && [ -f "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_grade.py" ]; then
              timeout 20m env -u GH_TOKEN -u GITHUB_TOKEN python3 "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_grade.py" gold --gold "$WORK/gold-us.json" --keys "$WORK/old-keys" --cache "$WORK/shapes" --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" --out "$WORK/gold-old" || warn "Gold score" "the old gold score did not finish"
              timeout 20m env -u GH_TOKEN -u GITHUB_TOKEN python3 "$GITHUB_WORKSPACE/new/.github/scripts/kpc_key_grade.py" gold --gold "$WORK/gold-us.json" --keys "$WORK/new-keys" --cache "$WORK/shapes" --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" --out "$WORK/gold-new" || warn "Gold score" "the new gold score did not finish"
            fi
            if [ -s "$WORK/fc-old/factcheck-summary.txt" ] || [ -s "$WORK/gold-old/gold-score.txt" ]; then fact_ok=yes; fi
          fi
          if [ "$fact_ok" = yes ]; then
            python3 "$GITHUB_WORKSPACE/kpcdata/.github/scripts/kpc_key_review_packet.py" run \
              --old "$WORK/old-keys" --new "$WORK/new-keys" --cache "$WORK/shapes" \
              --parkinfo "$GITHUB_WORKSPACE/kpcdata/data/parkinfo" \
              --out "$WORK/packet" --states "$states_text" \
              --fact-old "$WORK/fc-old" --fact-new "$WORK/fc-new" \
              --gold-old "$WORK/gold-old/gold-score.txt" --gold-new "$WORK/gold-new/gold-score.txt" \
              --meta "$WORK/meta.json" --assets "$WORK/assets.json" \
              || warn "Packet" "the packet could not be written again after the fact check"
          fi
          if [ -s "$WORK/packet/summary.md" ]; then cat "$WORK/packet/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the packet for the save
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: review-packet
          path: work/packet
          if-no-files-found: warn
          retention-days: 7
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # The errors a step caught itself are listed too, and one Hidden failures line is left for the check-up.
          # A job marked safe to fail (KPC_FAIL_SAFE=1, it starts nothing after it) goes red on a caught error.
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY

  save:
    needs: [scope, packet]
    if: ${{ !cancelled() && needs.scope.outputs.go == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        continue-on-error: true
        with:
          path: kpcdata
          fetch-depth: 1
      - name: The packet from the scoring job
        id: get
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: review-packet
          path: packet
      - name: Save the packet on tools-out
        id: save
        continue-on-error: true
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          HEAD: ${{ needs.scope.outputs.new_sha }}
          PRN: ${{ needs.scope.outputs.pr }}
          FOLDER: ${{ inputs.folder }}
        run: |
          warn() { echo "::warning title=${1}::${2}"; echo "$1 - $2" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          if [ ! -s "$GITHUB_WORKSPACE/packet/summary.md" ]; then warn "Save" "there is no packet to save"; exit 1; fi
          cd "$GITHUB_WORKSPACE/kpcdata"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KPC_PUSH_RETRY="$PWD/.github/scripts/kpc_push_retry.sh"
          git fetch -q --depth 1 origin "+refs/heads/tools-out:refs/remotes/origin/tools-out" || { warn "Save" "the tools-out branch could not be read"; exit 1; }
          if [ "${MODE:-pr}" = run ]; then
            day=$(python3 -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text(encoding="utf-8")) if p.is_file() else {}; print(d.get("run_date") or "")' "$GITHUB_WORKSPACE/packet/inputs.json")
            case "$day" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) day=$(date -u +%Y-%m-%d);;
            esac
            dest="key-quality/review-packets/run-${day}"
            msg="key review packet for the US key run ${day}"
            # 19 Nov (item 41 d): a named folder, letters / digits / - / _, at most three parts joined by /, never '..'
            if [ -n "$FOLDER" ]; then
              if printf '%s' "$FOLDER" | grep -Eq '^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+){0,2}$'; then dest="key-quality/${FOLDER}"; msg="key review packet ${FOLDER}"
              else warn "Save" "the folder name '${FOLDER}' is not allowed: saved under ${dest}"; fi
            fi
          else
            short=$(printf '%s' "$HEAD" | cut -c1-7)
            dest="key-quality/review-packets/pr-${PRN}-${short}"
            msg="key review packet for KPC-Links pull request ${PRN}"
          fi
          git worktree add -q -B tools-out "$GITHUB_WORKSPACE/out" origin/tools-out || { warn "Save" "could not open the tools-out work tree"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out/${dest}"
          cp -a "$GITHUB_WORKSPACE/packet/." "$GITHUB_WORKSPACE/out/${dest}/"
          cd "$GITHUB_WORKSPACE/out"
          git add -A -- key-quality/review-packets
          if git diff --cached --quiet; then
            echo "nothing new to save"
          else
            git commit -qm "$msg"
            bash "$KPC_PUSH_RETRY" tools-out 4 "key-quality/review-packets" || { warn "Save" "the packet was not saved to tools-out"; exit 1; }
          fi
          echo "packet folder: ${dest}"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # The errors a step caught itself are listed too, and one Hidden failures line is left for the check-up.
          # A job marked safe to fail (KPC_FAIL_SAFE=1, it starts nothing after it) goes red on a caught error.
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
