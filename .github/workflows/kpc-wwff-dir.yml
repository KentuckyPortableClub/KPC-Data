name: KPC WWFF + SOTA directory copy
# Step B5 (chat 2, Oct 27): MOVED from KPC-Links. Checks out KPC-Links read-only (scripts + the data that stays there), lays
# KPC-Data's moved data over it (kpc_overlay.sh), runs, and saves data/wwff/, data/sota/, data/names/ HERE (kpc_push_data.sh: only this job's files, no
# rebase). Never fails.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '24 9 * * 0'   # G9 Nov 2: was '23 9 * * 0' (spread the start times; now 1 min later)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-wwff-dir
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get the scripts and park data (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data)
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay this repo's data over the checkout
        run: touch /tmp/kpc-start; (cd kpcdata && LINKS=.. python3 .github/scripts/kpc_waiting_room.py resume data/wwff) || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; bash .github/scripts/kpc_overlay.sh kpcdata   # Oct 29 (chat 2 8:20 PM): start from the HELD files
      - name: Directories
        id: kept_green_1
        continue-on-error: true
        run: |
          python3 .github/scripts/kpc_wwff_dir.py || { kpc_rc=$?; echo "::error title=kpc_wwff_dir.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_wwff_dir.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_sota_dir.py || { kpc_rc=$?; echo "::error title=kpc_sota_dir.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_sota_dir.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_name_index.py || { kpc_rc=$?; echo "::error title=kpc_name_index.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_name_index.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 24: world WWFF + SOTA name search (data/names)
      - name: Save (once)
        if: always()
        id: kept_green_2
        continue-on-error: true
        run: |
          mkdir -p kpcdata/data/wwff/ && rm -rf kpcdata/data/wwff/ && cp -a data/wwff kpcdata/data/wwff 2>/dev/null || true   # ok: nothing to do is fine
          mkdir -p kpcdata/data/sota/ && rm -rf kpcdata/data/sota/ && cp -a data/sota kpcdata/data/sota 2>/dev/null || true   # ok: nothing to do is fine
          mkdir -p kpcdata/data/names/ && rm -rf kpcdata/data/names/ && cp -a data/names kpcdata/data/names 2>/dev/null || true   # ok: nothing to do is fine
          for f in data/status/*.json; do [ "$f" -nt /tmp/kpc-start ] && ! cmp -s "$f" "kpcdata/$f" && mkdir -p kpcdata/data/status && cp "$f" "kpcdata/$f"; done; true
          (cd kpcdata && LINKS=.. python3 .github/scripts/kpc_waiting_room.py divert data/wwff) || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 29 (chat 2 8:20 PM): changed files wait in data/waiting/in/ for chat 11, the live ones stay
          bash .github/scripts/kpc_push_data.sh kpcdata "Update WWFF directory copy" data
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
