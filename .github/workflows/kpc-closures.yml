name: KPC closures super-bot
# Oct 28 2026 (Fable, chat 10 'bot workshop'): RULE SHEET D, ruled by Brandon (CL-1..CL-8). ONE bot reads every official closures
# source we know (state feeds + pages, NPS alerts API, Forest Service and FWS pages, Parks Canada bulletins, Kentucky's own feeds)
# and writes data/closures/<area>.json + review.md + state.json. NOTHING here reaches a card: chat 2's merge into kpc-conditions.json
# waits for Brandon's GO (CL-5: Kentucky's own reader wins while both run; this bot is compared quietly until proven).
# One job = up to 5 chunks of MINUTES each, one save per chunk; when areas remain and 'chain' allows, the job starts the next one.
# Never fails except a failed save. Manners: kpc_manners.py (robots obeyed, 1 request / 2 s per host, three strikes = a day's rest).
# EVERY 6 HOURS: only once data/closures/state.json says 'proven' (set by a person after the Kentucky side-by-side is graded).
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      areas:
        description: 'Areas (e.g. "US-KY US-GA"); blank = every area not read in the last 5 hours, Kentucky first'
        default: 'US-KY'
      chunks:
        description: 'How many chunks this job runs (max 5), one save each'
        default: '2'
      minutes:
        description: 'Minutes per chunk'
        default: '55'
      chain:
        description: 'How many MORE jobs may follow this one by themselves when areas remain (0 = none)'
        default: '6'
      test:
        description: 'yes = the Kentucky gate (80 percent of Kentucky own reader items found here on the same park)'
        default: 'yes'
      browser:
        description: 'yes = read script-built pages (under 400 characters of text) in headless Chromium'
        default: 'yes'
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '38 13,1 * * *'   # Nov 3 (Brandon YES 5:29 PM): twice a day, 7:38 AM + 7:38 PM CST (was every 6 h '38 */6 * * *')   # G9 Nov 2: was '37 */6 * * *' (spread the start times; now 1 min later)
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-closures
  cancel-in-progress: false
jobs:
  closures:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Answer keys, park lists and Kentucky files from KPC-Links (read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Scheduled runs only once proven
        id: gate
        continue-on-error: true
        run: |
          cd kpcdata
          if [ "${{ (inputs.as_schedule && 'schedule') || github.event_name }}" = schedule ]; then
            P=$(python3 -c "import json;print((json.load(open('data/closures/state.json')).get('proven') or ''))" 2>/dev/null || echo '')
            if [ -z "$P" ]; then echo "closures super-bot not proven yet: nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "AREAS=" >> "$GITHUB_ENV"; echo "CHUNKS=5" >> "$GITHUB_ENV"; echo "TEST=0" >> "$GITHUB_ENV"
          else
            echo "AREAS=${{ inputs.areas }}" >> "$GITHUB_ENV"
            C="${{ inputs.chunks }}"; [ -z "$C" ] && C=2; [ "$C" -gt 5 ] && C=5; echo "CHUNKS=$C" >> "$GITHUB_ENV"
            echo "TEST=${{ inputs.test == 'yes' && '1' || '0' }}" >> "$GITHUB_ENV"
          fi
      - name: Tools
        if: steps.gate.outputs.skip != '1'
        id: kept_green_1
        continue-on-error: true
        run: |
          pip install -q --break-system-packages pypdf || pip install -q pypdf || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"
          if [ "${{ inputs.browser || 'yes' }}" = yes ]; then pip install -q --break-system-packages playwright || pip install -q playwright || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"; python3 -m playwright install --with-deps chromium >/dev/null 2>&1 || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"; fi
      - name: Read the sources chunk by chunk, ONE save at the end (Nov 3)
        timeout-minutes: 318   # Nov 3: the step stops before the job's limit, so the one save below always runs
        if: steps.gate.outputs.skip != '1'
        id: kept_green_2
        continue-on-error: true
        env:
          KPC_SAVE_EACH_CHUNK: ${{ vars.KPC_SAVE_EACH_CHUNK || 'no' }}   # Nov 3 (Brandon YES 5:29 PM): yes = the old way, a save after every chunk
          MINUTES: ${{ inputs.minutes || 55 }}
          LINKS: ../links
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          # RIDB key removed Oct 29 (Brandon 9:34 AM): Recreation.gov has no closure notices; the only recurring keyed call is NPS alerts for Kentucky
          BROWSER: ${{ (inputs.browser || 'yes') == 'yes' && '1' || '0' }}
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_closures_bot.py --selftest | tail -1; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || echo "::error title=kpc_closures_bot.py::stopped with an error (exit $rc), see the log above"
          LEFT=1
          for i in $(seq 1 "$CHUNKS"); do
            echo "::group::chunk $i of $CHUNKS"
            python3 .github/scripts/kpc_closures_bot.py | tee /tmp/closures.log; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || echo "::error title=kpc_closures_bot.py::stopped with an error (exit $rc), see the log above"
            echo "::endgroup::"
            L=$(grep -o '^LEFT=[0-9]*' /tmp/closures.log | tail -1 | cut -d= -f2); [ -n "$L" ] && LEFT=$L
            T=$(grep -o '^TEST=[A-Z]*' /tmp/closures.log | tail -1); [ -n "$T" ] && echo "$T" >> "$GITHUB_ENV"
            [ "${KPC_SAVE_EACH_CHUNK:-no}" != yes ] || bash ../links/.github/scripts/kpc_push_data.sh . "closures super-bot: chunk $i" data/closures data/status || echo "::error title=kpc_push_data.sh::stopped with an error (exit $?), see the log above"
            [ "$LEFT" = 0 ] && break
          done
          echo "LEFT=$LEFT" >> "$GITHUB_ENV"
      - name: ONE save for the whole run (Nov 3, Brandon YES 5:29 PM; was one save per chunk = up to 5 commits a run)
        if: always() && steps.gate.outputs.skip != '1'
        id: save_once
        continue-on-error: true
        run: |
          cd kpcdata
          [ "${{ vars.KPC_SAVE_EACH_CHUNK || 'no' }}" = yes ] && { echo 'saved after every chunk (KPC_SAVE_EACH_CHUNK=yes)'; exit 0; }
          bash ../links/.github/scripts/kpc_push_data.sh . "closures super-bot: one save for the run" data/closures data/status || echo "::error title=kpc_push_data.sh::stopped with an error (exit $?), see the log above"
      - name: Areas remain, so the next job starts itself
        if: ${{ (github.event_name != 'schedule' && !inputs.as_schedule) && env.LEFT != '0' && env.LEFT != '' && inputs.chain != '0' && inputs.chain != '' }}
        id: kept_green_3
        continue-on-error: true
        run: |
          C=$(( ${{ inputs.chain }} - 1 ))
          echo "::notice title=Closures super-bot::$LEFT areas left: the next job starts itself (then $C more may follow)"
          gh workflow run kpc-closures.yml -R ${{ github.repository }} -f areas="${{ inputs.areas }}" -f chunks=5 -f minutes="${{ inputs.minutes || 55 }}" -f chain=$C -f test=no -f browser="${{ inputs.browser || 'yes' }}" || echo "::error title=Next run::could not start the next run; the chain stops here (exit $?)"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
