name: TEMP water backup probe (delete after)
# Oct 28 (HQ): retest chat 8's river backups from the runner: round 2 = the Corps IENC area classes. Never fails.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: IENC area classes
        continue-on-error: true
        shell: python3 {0}
        run: |
          import json, re, time, urllib.request, urllib.parse
          UA = {'User-Agent': 'KPC park-map bot (https://kentuckyportableclub.github.io/KPC-Links/)'}
          def get(u):
              t = time.time()
              try: r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60); return r.status, r.read(300000), round(time.time() - t, 1)
              except Exception as e: return 'ERR ' + str(e)[:80], b'', round(time.time() - t, 1)
          def note(t, m): print(f'::notice title={t}::{m}'[:1000], flush=True)
          box = '-88.70,37.03,-88.55,37.12'
          s, b, t = get('https://ienccloud.us/arcgis/rest/services/IENC_Feature_Classes?f=json')
          try: svcs = [x['name'] for x in json.loads(b).get('services', [])]
          except Exception: svcs = []
          pick = [x for x in svcs if re.search(r'LAKE|RIVER|LAND_AREA|LAND_REGION|DEPTH_AREA|COAST|SHORE|DOCK|DAM', x)]
          note('IENC names', f'{s} {len(svcs)} services; water/land ones: ' + ', '.join(x.split('/')[-1] for x in pick))
          for nm in pick[:8]:
              try:
                  base = f'https://ienccloud.us/arcgis/rest/services/{nm}/MapServer'
                  s, b, t = get(base + '?f=json')
                  j = json.loads(b) if b else {}
                  lays = [(L['id'], L['name']) for L in j.get('layers', [])][:3]
                  c = []
                  for i, _ in lays[:2]:
                      s2, b2, t2 = get(base + f'/{i}/query?' + urllib.parse.urlencode({'geometry': box, 'geometryType': 'esriGeometryEnvelope', 'inSR': 4326, 'spatialRel': 'esriSpatialRelIntersects', 'returnCountOnly': 'true', 'f': 'json'}))
                      c.append(f'{s2} {t2}s {b2[:50].decode("utf8", "ignore")}')
                  note('IENC ' + nm.split('/')[-1], f'{s} layers {lays} | Paducah: {c} | date {str(j.get("serviceDescription") or j.get("description") or "")[:120]}')
              except Exception as e: note('IENC ' + nm.split('/')[-1], 'error ' + str(e)[:100])
