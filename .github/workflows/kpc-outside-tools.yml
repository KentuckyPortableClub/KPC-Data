name: KPC outside tools (2-fer checker, map-format converter, map-page links) - REVIEW ONLY
# Oct 31 2026 (HQ, Brandon 4:44 PM 'yes'): the outside coder's three tools, used NOW as review tools until Fable reviews,
# fixes and wires them properly (scheduled Nov 6). They run from .github/scripts/tools/ unchanged; glue =
# .github/scripts/kpc_outside_tools.py. NOTHING here edits data/fers, data/docs, a key or a card:
#   fers     -> data/fers-check/<area>.json + .summary.md (KY first, then every US + Canada area)  -> chat 2 rechecks, chat 11 grades
#   convert  -> branch tools-out convert/ (GeoJSON near each pin + report.csv)                     -> chat 11 grades, chat 9 LAYER lines
#   links    -> data/intake/docs-found-maplinks(.json|-possible.json), same shape as the F file     -> chat 10 merges via the waiting room
# By hand only, never on a schedule; every step continue-on-error, so it never goes red (no emails). Jobs <= 55 min.
# 'chain' = how many more runs may follow by themselves while a tool has work left (resume picks up).
on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'Which tools, any of: fers convert links'
        default: 'fers convert links'
      test:
        description: 'yes = small test (fers: Kentucky only; convert: 10 leads, one per host; links: Tennessee pages)'
        default: 'yes'
      chain:
        description: 'More runs that may follow by themselves while work is left (0 = none)'
        default: '0'
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-outside-tools
  cancel-in-progress: false
# PR2 (Nov 2): a push to tools-out that loses a race with another bot pulls --rebase and tries again (5 tries; no force).
jobs:
  run:
    runs-on: ubuntu-24.04   # Nov 9: Playwright has no build for ubuntu 26.04 (Guide PDFs run 42637107981)
    timeout-minutes: 175
    env:
      T: ${{ github.event.inputs.tools }}
      TEST: ${{ github.event.inputs.test }}
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
      DR: .github/scripts/tools
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: kpcdata/.kpc_cache
          key: kpc-outside-tools-${{ github.run_id }}
          restore-keys: kpc-outside-tools-
      - name: Install the tools' packages
        id: kept_green_1
        continue-on-error: true
        run: |
          cd kpcdata
          pip install -q -r $DR/kpc_fers_check/requirements.txt -r $DR/kpc_convert_layers/requirements.txt -r $DR/kpc_map_links/requirements.txt || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          case "$T" in *links*) python -m playwright install --with-deps chromium >/dev/null 2>&1 || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; };; esac
      - name: The side branch for big outputs (tools-out, never main)
        id: kept_green_2
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "kpc-bot"; git config user.email "kpc-bot@users.noreply.github.com"
          if git fetch -q origin tools-out:tools-out 2>/dev/null; then git worktree add -q ../out tools-out
          else git worktree add -q --detach ../out && cd ../out && git checkout -q --orphan tools-out && git rm -rfq . 2>/dev/null; echo "Outside tools' big outputs (Oct 31). Squash or delete freely." > README.md; fi
      - name: 2-fer checker (KY first, then US + Canada)
        id: fers
        if: contains(env.T, 'fers')
        continue-on-error: true
        timeout-minutes: 55
        run: |
          cd kpcdata
          if [ "$TEST" = yes ]; then A="US-KY"; else
            A="US-KY $(ls data/fers | grep -E '^(US|CA)-[A-Z]{2}\.json(\.gz)?$' | sed 's/\.json.*//' | grep -v '^US-KY$' | tr '\n' ' ')"; fi
          python3 $DR/kpc_fers_check/kpc_fers_check.py --areas $A --resume --fers-dir data/fers --key-dir data --out data/fers-check --max-minutes 50 2>&1 | tee /tmp/fers.log | tail -40 || true   # ok: a pipeline (its exit status is the last command; follow-up: pipefail)
          grep -q 'rerun with --resume' /tmp/fers.log && echo "more=yes" >> $GITHUB_OUTPUT || true   # ok: nothing to do is fine
          rm -rf data/fers-check/.cache || true   # ok: nothing to do is fine
      - name: Map-format converter (US + Canada leads first)
        id: conv
        if: contains(env.T, 'convert')
        continue-on-error: true
        timeout-minutes: 55
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_outside_tools.py prep-convert "$TEST" /tmp/leads.json || { kpc_rc=$?; echo "::error title=kpc_outside_tools.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_outside_tools.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 $DR/kpc_convert_layers/kpc_convert_layers.py --leads /tmp/leads.json --out ../out/convert --cache .kpc_cache --max-minutes 50 --resume 2>&1 | tail -30; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { kpc_rc=$?; echo "::warning title=kpc_convert_layers.py::stopped with an error (exit $rc), see the log above"; echo "kpc_convert_layers.py - stopped with an error (exit $rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/leads.json'))))" 2>/dev/null || echo 0)
          R=$(( $(wc -l < ../out/convert/report.csv 2>/dev/null || echo 1) - 1 ))
          echo "converter: $R of $N leads read"
          [ "$R" -lt "$N" ] && echo "more=yes" >> $GITHUB_OUTPUT || true   # ok: nothing to do is fine
      - name: Map-page link extractor (US agency index pages)
        id: links
        if: contains(env.T, 'links')
        continue-on-error: true
        timeout-minutes: 55
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_outside_tools.py prep-links "$TEST" ../out/links-in || { kpc_rc=$?; echo "::error title=kpc_outside_tools.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_outside_tools.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          set +e
          python3 $DR/kpc_map_links/kpc_map_links.py --agencies ../out/links-in/agency_pages.json --out ../out/links --resume --max-minutes 50 2>&1 | tail -30
          [ "${PIPESTATUS[0]}" = 3 ] && echo "more=yes" >> $GITHUB_OUTPUT
          python3 .github/scripts/kpc_outside_tools.py post-links ../out/links || { kpc_rc=$?; echo "::error title=kpc_outside_tools.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_outside_tools.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save (review files on main, big outputs on tools-out)
        id: kept_green_3
        continue-on-error: true
        run: |
          cd kpcdata
          ln -sfn ../out out 2>/dev/null; python3 .github/scripts/kpc_outside_tools.py summary || { kpc_rc=$?; echo "::error title=kpc_outside_tools.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_outside_tools.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; rm -f out
          cd ../out && git add -A && git commit -qm "outside tools: outputs (run ${{ github.run_id }})" && (for i in 1 2 3 4 5; do git push -q origin tools-out && exit 0; git pull -q --rebase origin tools-out || git rebase --abort 2>/dev/null || true; sleep $((i*7)); done; exit 1) || { kpc_rc=$?; echo "::error title=git push::a push failed (exit $kpc_rc); this run is NOT saved"; echo "git push - a push failed (exit $kpc_rc); this run is NOT saved" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          cd ../kpcdata && bash ../links/.github/scripts/kpc_push_data.sh . "outside tools (review only): 2-fer check / converter / map links" data/fers-check data/intake/tools data/intake/docs-found-maplinks.json data/intake/docs-found-maplinks-possible.json || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Next run while work is left
        id: kept_green_4
        continue-on-error: true
        if: github.event.inputs.chain != '0' && (steps.fers.outputs.more == 'yes' || steps.conv.outputs.more == 'yes' || steps.links.outputs.more == 'yes')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd kpcdata
          gh workflow run kpc-outside-tools.yml -f tools="$T" -f test="$TEST" -f chain=$(( ${{ github.event.inputs.chain }} - 1 )) || { kpc_rc=$?; echo "::error title=start the next run::could not start the next run (exit $kpc_rc); the chain stops here"; echo "start the next run - could not start the next run (exit $kpc_rc); the chain stops here" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
