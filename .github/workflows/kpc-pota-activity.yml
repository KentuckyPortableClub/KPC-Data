name: KPC POTA activity - activations per park, whole world (weekly, branch tools-out)
# Nov 1 2026 (chat 10; Brandon 7:59 PM 'in rank of activity in pota'). kpc_pota_activity.py reads POTA's public location lists
# (the same calls the park-list bots make) -> tools-out pota/activity.json; the nightly missing lists rank by it. Never red.
on:
  workflow_dispatch:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '11 5 * * 0'
permissions:
  contents: write
concurrency:
  group: kpc-pota-activity
  cancel-in-progress: false
jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Activations per park
        id: kept_green_1
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git worktree add -q -B tools-out ../out origin/tools-out
          mkdir -p ../out/pota && cp ../out/pota/activity.json data/pota/activity.json 2>/dev/null || true   # ok: nothing to do is fine
          python3 .github/scripts/kpc_pota_activity.py || echo "::error title=kpc_pota_activity.py::stopped with an error (exit $?), see the log above"
          cp data/pota/activity.json ../out/pota/activity.json 2>/dev/null || exit 0
          cd ../out && git add pota/activity.json && git commit -qm "POTA activity $(date -u +%F)" && { { saved=0; for i in 1 2 3 4 5; do git push -q origin HEAD:tools-out && { saved=1; break; }; git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git rebase -q origin/tools-out; sleep 9; done; [ "$saved" = 1 ] || echo "::error title=Save::not saved after every try; the next run tries again"; }; } || true   # ok: nothing new to commit; a lost save is reported by the loop itself
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
