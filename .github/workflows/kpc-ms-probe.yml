name: TEMP Mississippi zip probe (delete after)
# Oct 28 (HQ, chat 9 hand-off): MARIS 2026 WMA + state park zips (fields, TYPE values, projection) + 16th Section layer fields. Never fails.
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: zips
        continue-on-error: true
        shell: python3 {0}
        run: |
          import subprocess, sys; subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', '--break-system-packages', 'pyshp', 'pyproj'])
          import io, json, zipfile, urllib.request, collections, shapefile
          UA = {'User-Agent': 'KPC park-map bot (https://kentuckyportableclub.github.io/KPC-Links/)'}
          def note(t, m): print(f'::notice title={t}::{m}'[:1000], flush=True)
          for u in ('https://maris.mississippi.edu/MARISdata/Boundaries/MS_WildlifeManagementAreas_2026.zip', 'https://maris.mississippi.edu/MARISdata/Cultural/MS_StateParks_2026.zip'):
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=120).read()
                  z = zipfile.ZipFile(io.BytesIO(b))
                  for sp in [q for q in z.namelist() if q.lower().endswith('.shp')]:
                      base = sp[:-4]; rd = shapefile.Reader(shp=io.BytesIO(z.read(sp)), dbf=io.BytesIO(z.read(base + '.dbf')), shx=io.BytesIO(z.read(base + '.shx')))
                      fn = [f[0] for f in rd.fields[1:]]; recs = [dict(zip(fn, list(r))) for r in rd.records()]
                      prj = z.read(base + '.prj').decode('utf8', 'ignore')[:90] if base + '.prj' in z.namelist() else 'no .prj'
                      tf = next((f for f in fn if f.upper() == 'TYPE'), None)
                      note('MS ' + u.split('/')[-1], f'{len(b)//1024} KB, {len(recs)} shapes {rd.shapeTypeName}; fields {fn}; prj {prj}; TYPE {dict(collections.Counter(r[tf] for r in recs)) if tf else "-"}; sample {[{k: v for k, v in r.items()} for r in recs[:2]]}')
              except Exception as e: note('MS ' + u.split('/')[-1], 'ERR ' + str(e)[:200])
          base = 'https://gis.mississippi.edu/server/rest/services/Cadastral/MS_16thSectLands_2021/MapServer'
          for q in ('?f=json', '/0?f=json', '/0/query?where=1%3D1&returnCountOnly=true&f=json', '/0/query?where=1%3D1&outFields=*&resultRecordCount=3&returnGeometry=false&f=json'):
              try: b = urllib.request.urlopen(urllib.request.Request(base + q, headers=UA), timeout=60).read()[:700].decode('utf8', 'ignore')
              except Exception as e: b = 'ERR ' + str(e)[:100]
              note('MS 16th ' + q[:25], b)
