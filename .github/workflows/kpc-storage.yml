name: KPC storage keeper (Sundays; measures all, cleans this repo)
# Oct 30 2026 (chat 10; HQ 8:50 AM, Brandon 8:45 AM 'a bot to keep storage size down?'). Script: kpc_storage_keeper.py.
# Measures KPC-Links / KPC-Data / kpc-app + the lookup and picture-maps branches; cleans KPC-Data's old artifacts, caches and stale
# bot branches; squashes lookup past 150 MB and picture-maps past 300 MB (one fresh commit, same files). Never touches main's history.
# Ends red ONLY when a repo is over its line (KPC-Links 650 MB, KPC-Data 400 MB) = the one email that matters.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '6 9 * * 0'   # G9 Nov 2: was '7 9 * * 0' (spread the start times; now 1 min earlier)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pull-requests: read
concurrency:
  group: kpc-storage
  cancel-in-progress: false
jobs:
  keep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The orphan branches (measure, squash when over)
        id: kept_green_1
        continue-on-error: true
        run: |
          git config --global user.name 'github-actions[bot]'; git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for b in lookup picture-maps; do
            LIM=150; [ $b = picture-maps ] && LIM=300
            rm -rf /tmp/$b && git clone -q --single-branch -b $b "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/$b || continue
            (cd /tmp/$b && git gc -q --prune=now 2>/dev/null; KB=$(git count-objects -v | awk '/size-pack|^size:/{s+=$2} END{print s}'); MB=$((KB/1024))
             V=$(echo $b | tr 'a-z-' 'A-Z_'); echo "BRANCH_MB_$V=$MB" >> "$GITHUB_ENV"
             if [ "$MB" -gt "$LIM" ]; then git checkout -q --orphan fresh && git add -A && git commit -qm "$b squashed $(date -u +%F) (was $MB MB with history)" && git push -q -f origin fresh:$b && echo "::notice title=Storage keeper::$b squashed ($MB MB > $LIM MB)"; fi) || { kpc_rc=$?; echo "::warning title=Save::nothing new to save, or the push failed: if this run had new files they are NOT saved (exit $kpc_rc)"; echo "Save - nothing new to save, or the push failed: if this run had new files they are NOT saved (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          done
      - name: Measure + board line + history
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/kpc_storage_keeper.py measure | tee /tmp/m.txt; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { kpc_rc=$?; echo "::warning title=kpc_storage_keeper.py::stopped with an error (exit $rc), see the log above"; echo "kpc_storage_keeper.py - stopped with an error (exit $rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          L=$(grep '^LINE=' /tmp/m.txt | cut -d= -f2-); O=$(grep '^OVER=' /tmp/m.txt | cut -d= -f2); echo "OVER=$O" >> "$GITHUB_ENV"
          C=green; [ "$O" = 1 ] && C=amber   # over the line = HQ decides (amber); red is only for a broken bot
          python3 .github/scripts/kpc_status.py board "Storage keeper (weekly)" "$C" "$L" "HQ: over the line = decide (squash / move files); the keeper never rewrites main" || true   # ok: a status-board line (reporting only)
      - name: Clean this repo (old artifacts, caches, stale bot branches)
        id: kept_green_3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/kpc_storage_keeper.py clean || { kpc_rc=$?; echo "::error title=kpc_storage_keeper.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_storage_keeper.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save (status only)
        id: kept_green_4
        continue-on-error: true
        run: |
          git add data/status 2>/dev/null; git diff --cached --quiet && exit 0
          git commit -qm 'storage keeper: weekly sizes'; { saved=0; for i in 1 2 3; do git pull -q --rebase && git push -q && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; }; true
      - name: "Over the line? (the only red end = one email)"
        if: ${{ env.OVER == '1' }}
        run: |
          echo "::error title=STORAGE WARNING::a repo is over its storage line, see the status board"
          exit 1
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
