name: KPC flow board - every pile of work, who it waits on, when it last moved (every 3 h)
# Nov 1 2026 (chat 10; Brandon 2:01 PM 'stuff seems to get dropped a lot ... see 900 layers in x bot and a date ... a list of
# waiting on approvals ... it all gets done at some point'). kpc_flow.py reads the bots' files (main + branches tools-out,
# intake-files, engine-registry), writes data/status/flow.json + flow.md (small). STUCK = work in a pile and no move for 2 days.
# Every chat sees its lines at the start (KPC-Links .claude/build/inbox_now.py). Reads only, decides nothing, never red.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '46 1,13 * * *'   # PR2 (Nov 2): twice a day (was every 3 h, '46 */3 * * *'); a pile is STUCK after 2 days, so 12 h is plenty   # G9 Nov 2: was '47 */3 * * *' (spread the start times; now 1 min earlier)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-flow
  cancel-in-progress: false
jobs:
  flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 200
      - name: Build the flow board
        id: kept_green_1
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/kpc_flow.py || echo "::error title=kpc_flow.py::stopped with an error (exit $?), see the log above"
          (git add data/status/flow.json data/status/flow.md && python3 .github/scripts/kpc_stamp_only.py && { git diff --cached --quiet && echo "nothing new to save"; } || { git commit -qm "flow board" && saved=0 && for i in 1 2 3 4; do git pull -q --rebase --autostash origin main && git push -q origin HEAD:main && { saved=1; break; }; git rebase --abort 2>/dev/null; sleep $((i*7)); done; [ "$saved" = 1 ] || echo "::error title=Save::not saved after every try; the next run tries again"; }) || true   # PR2: one commit, skipped when only time stamps changed; pull --rebase retries (was: a retry re-ran 'git commit' and never pushed)
          true
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
