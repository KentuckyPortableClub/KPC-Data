name: KPC camp and activate bot (which campground is in which park)
# Oct 28 2026 (Fable, chat 10 'bot workshop'; RULE SHEET E + Brandon's rulings CA-1..CA-6, rules first DONE). Review lists only
# (data/campsites/<area>.json + review.md): campgrounds INSIDE each POTA park, inside a RULED 2-fer patch ('camp here, activate
# both'), within 100 ft of a line park on public land, and NEARBY (5 miles) kept apart. Nothing links to it; nothing posts;
# it never touches a key, an outline, a card or a 2-fer row. Kentucky reads the KPC-Links layers; other states need the
# boundary-cache copies (downloaded below; an area without them is written as a stub, never an error).
# TEST=yes = the Kentucky gate: chat 8's desk answers (99/79/50/35/2/0/4, Twin Knobs + Great Meadows, Zilpo = check first,
# the per-park lists) must ALL match -> GATE=PASS; every difference is printed in the run's notices and in review.md.
# No cron yet: weekly once proven (data/campsites/state.json 'proven') AND Brandon's GO. Never fails except a failed save.
on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'Areas (e.g. "US-KY US-TN"); blank = the next unfinished areas in the workshop queue (Kentucky first, southeast next)'
        default: 'US-KY'
      chunks:
        description: 'Areas per job when areas is blank'
        default: '6'
      chain:
        description: 'How many MORE jobs may follow this one by themselves when areas remain (0 = none)'
        default: '0'
      test:
        description: 'yes = the Kentucky gate against chat 8 known answers (KPC_CampActivate_KY_desk.md)'
        default: 'yes'
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-campsites
  cancel-in-progress: false
jobs:
  campsites:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Kentucky answer key, outlines, trail lines and the desk answers (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Saved official outlines for the other states (boundary cache release)
        id: kept_green_1
        continue-on-error: true
        run: |
          mkdir -p kpcdata/cache/us
          if [ "${{ inputs.areas }}" != "US-KY" ]; then
            gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-*.json.gz' -D kpcdata/cache/us --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          fi
          ls kpcdata/cache/us | wc -l
      - name: Official campground layers (kpc_camp_layers output, branch tools-out)
        id: kept_green_2
        continue-on-error: true
        run: |
          cd kpcdata && git fetch -q origin tools-out && mkdir -p ../camplayers && git archive FETCH_HEAD camp_layers | tar -x -C ../camplayers --strip-components=1 || true   # ok: a pipeline (its exit status is the last command; follow-up: pipefail)
          ls ../camplayers/campgrounds 2>/dev/null | wc -l
      - name: Run the bot area by area and save once per chunk
        id: kept_green_3
        continue-on-error: true
        env:
          AREAS: ${{ inputs.areas }}
          CHUNKS: ${{ inputs.chunks || 6 }}
          TEST: ${{ inputs.test == 'yes' && '1' || '0' }}
          LINKS: ../links
          GEO_CACHE: cache/us
          STATUS: '1'
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_campsites_bot.py | tee /tmp/campsites.log; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { kpc_rc=$?; echo "::warning title=kpc_campsites_bot.py::stopped with an error (exit $rc), see the log above"; echo "kpc_campsites_bot.py - stopped with an error (exit $rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          grep -o '^LEFT=[0-9]*' /tmp/campsites.log | tail -1 >> "$GITHUB_ENV"
          grep -o '^GATE=[A-Z]*' /tmp/campsites.log | tail -1 >> "$GITHUB_ENV"
          bash ../links/.github/scripts/kpc_push_data.sh . "camp and activate bot: ${{ inputs.areas || 'queue' }} (gate ${GATE:-none})" data/campsites data/status || { kpc_rc=$?; echo "::error title=Save::a save or push failed; this run is NOT saved, the next run tries again (exit $kpc_rc)"; echo "Save - a save or push failed; this run is NOT saved, the next run tries again (exit $kpc_rc)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Areas remain, so the next job starts itself
        if: ${{ inputs.areas == '' && env.LEFT != '0' && env.LEFT != '' && inputs.chain != '0' && inputs.chain != '' }}
        id: kept_green_4
        continue-on-error: true
        run: |
          C=$(( ${{ inputs.chain }} - 1 ))
          echo "::notice title=Camp and activate::$LEFT areas left: the next job starts itself (then $C more may follow)"
          gh workflow run kpc-campsites.yml -R ${{ github.repository }} -f areas= -f chunks=${{ inputs.chunks }} -f chain=$C -f test=no || { kpc_rc=$?; echo "::error title=start the next run::could not start the next run (exit $kpc_rc); the chain stops here"; echo "start the next run - could not start the next run (exit $kpc_rc); the chain stops here" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
