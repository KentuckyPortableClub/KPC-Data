name: KPC scoreboard (nightly counts, facts only)
# Oct 28 2026 (chat 2): counts what the other bots have on file per state / province / park (outline, size check, official map,
# rules, hours, fees, permits, access points, campgrounds, closure sources, who runs it, 2-fer passes) into data/review/scoreboard.json
# (chat 1's kpc-map-coverage.html reads it) + scoreboard-parks.json + scoreboard-check.md (our counts next to chat 8's hand counts).
# Local files only, no web, decides nothing. Never fails except a failed save.
on:
  workflow_dispatch:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '21 7 * * *'   # G9 Nov 2: was '23 7 * * *' (spread the start times; now 2 min earlier)
permissions:
  contents: write
concurrency:
  group: kpc-scoreboard
  cancel-in-progress: false
jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Kentucky answer key, retired list and chat 8 hand counts (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Count what is on file
        id: kept_green_1
        continue-on-error: true
        env:
          LINKS: ../links
          OUT: data/review
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_scoreboard_bot.py || { kpc_rc=$?; echo "::error title=kpc_scoreboard_bot.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_scoreboard_bot.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save the scoreboard and tell the status board
        id: kept_green_2
        continue-on-error: true
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_status.py board scoreboard green "scoreboard.json + scoreboard-parks.json + scoreboard-check.md" "nothing (facts only)" || true   # ok: a status-board line (reporting only)
          bash ../links/.github/scripts/kpc_push_data.sh . "scoreboard: nightly counts" data/review data/status || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Join by record number (chat 11 YES answers -> the world keys; held for chat 11's file YES)
        # Nov 2 (chat 10; Brandon 4:58 AM GO 'Chat 10 builds it now'): a YES on a layer the world key builder does not read never
        # reached a key. kpc_key_approved.py adds each approved record by its number to the newest copy of its country key; the
        # waiting room holds the changed files (checked; released only with chat 11's file YES).
        id: kept_green_3
        continue-on-error: true
        env:
          LINKS: ../links
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          F=$(python3 .github/scripts/kpc_key_approved.py | tee /tmp/ka.txt | grep '^FILES=' | cut -d= -f2-)
          grep -v '^FILES=' /tmp/ka.txt || true   # ok: nothing to do is fine
          [ -n "$F" ] && python3 .github/scripts/kpc_waiting_room.py divert $F || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          bash ../links/.github/scripts/kpc_push_data.sh . "key join by record number: approved world parks (held for chat 11)" data/waiting data/world-key data/status || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Parks still missing a boundary, one list per country, most activated first (branch missing-lists, replaced each night)
        # Nov 1 (chat 10; Brandon 7:59 PM 'download csv for the parks needed ... by country in rank of activity in pota'). The members-only
        # Map Coverage page reads raw.githubusercontent.com/.../missing-lists/<CC>.json and turns it into a CSV. The branch is ONE orphan
        # commit, replaced every night, so the lists never add to the repo's history.
        id: kept_green_4
        continue-on-error: true
        env:
          LINKS: ../links
          MISSING_OUT: ../ml
        run: |
          cd kpcdata
          git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git show origin/tools-out:pota/activity.json > data/pota/activity.json 2>/dev/null || true   # ok: optional git step; the next step reports
          python3 .github/scripts/kpc_missing_lists.py || { kpc_rc=$?; echo "::error title=kpc_missing_lists.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_missing_lists.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          APPROVED_OUT=../ml/approved python3 .github/scripts/kpc_approved_list.py || { kpc_rc=$?; echo "::error title=kpc_approved_list.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_approved_list.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Nov 2: chat 11 YES answers whose key does not show them yet
          [ -f ../ml/index.json ] || exit 0
          cd ../ml && git init -q && git checkout -q -b missing-lists && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com" \
            && git add -A && git commit -qm "missing lists $(date -u +%F) (one commit, replaced nightly)" \
            && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:missing-lists && echo "::notice title=Missing lists::branch missing-lists replaced" || true   # ok: nothing to do is fine
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
