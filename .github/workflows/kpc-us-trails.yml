name: KPC national trail lines
# Step B5 (chat 2, Oct 27): MOVED from KPC-Links. Checks out KPC-Links read-only (scripts + the data that stays there), lays
# KPC-Data's moved data over it (kpc_overlay.sh), runs, and saves data/trails/ HERE (kpc_push_data.sh: only this job's files, no
# rebase). Never fails.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '12 7 * * 1'   # Nov 1: weekly (Mondays), so new finds reach the key within a week (was monthly)   # G9 Nov 2: was '13 7 * * 1' (spread the start times; now 1 min earlier)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-trails
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get the scripts and park data (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data)
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay this repo's data over the checkout
        run: touch /tmp/kpc-start; (cd kpcdata && LINKS=.. python3 .github/scripts/kpc_waiting_room.py resume data/trails) || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; bash .github/scripts/kpc_overlay.sh kpcdata   # Oct 29 (chat 2 8:20 PM): start from the HELD files
      - name: Download and simplify the trail lines
        id: kept_green_1
        continue-on-error: true
        env:
          OUT: /tmp/trails-log.txt
          EXTRA_TRAILS: /tmp/finds-lines.json
        run: |
          # Nov 1 (chat 2, Brandon: 'we are finding stuff but it never makes it in'): SURE line finds from the outside research
          # for trail parks still a pin go to the trail bot too (then the waiting room, chat 11, the key)
          DATA=kpcdata python3 .github/scripts/kpc_finds_lines.py /tmp/finds-lines.json || { kpc_rc=$?; echo "::error title=kpc_finds_lines.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_finds_lines.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_us_trails.py || { kpc_rc=$?; echo "::error title=kpc_us_trails.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_us_trails.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Show the results
        if: always()
        run: if [ -e /tmp/trails-log.txt ]; then while read -r l; do echo "::notice title=trails::$l"; done < <(tail -n 9 /tmp/trails-log.txt); fi
      - name: Save (once)
        if: always()
        id: kept_green_2
        continue-on-error: true
        run: |
          mkdir -p kpcdata/data/trails/ && rm -rf kpcdata/data/trails/ && cp -a data/trails kpcdata/data/trails 2>/dev/null || true   # ok: nothing to do is fine
          for f in data/status/*.json; do [ "$f" -nt /tmp/kpc-start ] && ! cmp -s "$f" "kpcdata/$f" && mkdir -p kpcdata/data/status && cp "$f" "kpcdata/$f"; done; true
          # Oct 28 self-grade: one 'grade me' (or 'FAILED its gate') line per batch for the checkers (data/status/inbox-checkers.md)
          if [ -s /tmp/kpc-gate.txt ]; then IFS=$'\t' read -r G A N < /tmp/kpc-gate.txt
            if [ "$G" = PASS ]; then STATUS_DIR=kpcdata/data/status python3 kpcdata/.github/scripts/kpc_status.py grade-me "kpc_us_trails" "${A:-all}" "data/trails/" "$N"
            else STATUS_DIR=kpcdata/data/status python3 kpcdata/.github/scripts/kpc_status.py gate "kpc_us_trails" "${A:-all}" FAIL "$N"; fi; fi; true
          (cd kpcdata && LINKS=.. python3 .github/scripts/kpc_waiting_room.py divert data/trails) || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 29 (chat 2 8:20 PM): changed files wait in data/waiting/in/ for chat 11, the live ones stay
          bash .github/scripts/kpc_push_data.sh kpcdata "National trails: monthly refresh" data
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
