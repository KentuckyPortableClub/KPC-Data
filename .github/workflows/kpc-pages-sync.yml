name: KPC site copy for GitHub Pages (main -> site, at most every 20 min)
# Nov 2 5:00 PM (HQ; Brandon asked if GitHub shut us down): KPC-Data made ~645 'pages build and deployment' runs a day, one per bot
# push, most cancelled (GitHub's Pages soft limit is ~10 builds an hour), which may also be why GitHub starved this repo's timers.
# Now Pages publishes the branch 'site', and this bot moves 'site' to main's newest commit when it has changed (no new files: the
# same commit, so no extra storage). Started by its own timer, the watchdog and the two self-chained bots (engine, map audit).
# Nov 10 (quiet runs): GitHub's own 'pages build and deployment' runs for the branch 'site' failed 9x in 2 days after ~11 minutes: each
# move of 'site' starts a Pages build and new moves landed on top of a build that was still running. So now: the timer is hourly (was
# 3 a time an hour; the name above is kept because other files refer to it), 'site' moves only when a file the SITE reads changed
# (not .github/, .claude/, tests/, data/status/, data/waiting/ - bookkeeping; a bookkeeping-only difference still moves it once it is
# 6 h old, because the site's status page reads data/status), and never while a Pages build is still running. A skipped move is a green
# run with a summary line. Red only if the site would stay stale (could not move 'site' AND it is behind a site change).
# Never red otherwise. 'switch=yes' (one time, by hand) points Pages at the 'site' branch; 'switch=main' puts it back.
on:
  schedule:
    - cron: '9 * * * *'   # Nov 10 (quiet runs): hourly (was '9,29,49 * * * *')
  workflow_dispatch:
    inputs:
      switch:
        description: "one time: 'yes' = Pages publishes the branch site; 'main' = back to main; empty = just copy"
        required: false
        default: ''
permissions:
  contents: write
  pages: write
  actions: read
concurrency:
  group: kpc-pages-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Nov 11 (KPC owner, storage round 2): 'site' carries only the paths the pages read (.github/site-allow-list.txt), built by
      # .github/scripts/kpc_site_filter.py as ONE commit on top of main's commit (same files, no new content), force-pushed to 'site'.
      # A GITHUB_TOKEN push does not start a legacy Pages build, so kpc_site_publish.sh requests one after a successful filtered
      # push (POST repos/$GITHUB_REPOSITORY/pages/builds; this job has pages: write and GH_TOKEN). A failed request makes the run red.
      # The repo variable KPC_SITE_FILTER=off goes back to the old way (site = main's commit, everything, moved through the API as today).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none            # names and ids only: the filter never needs file contents
          sparse-checkout: .github
      - name: Move 'site' to main (only when a file the site reads changed)
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          SWITCH: ${{ inputs.switch }}
          FILTER: ${{ vars.KPC_SITE_FILTER != 'off' && 'on' || 'off' }}
        run: |
          say() { echo "$1"; [ -z "${GITHUB_STEP_SUMMARY:-}" ] || echo "- $1" >> "$GITHUB_STEP_SUMMARY"; }
          stale() { echo "::error title=Pages copy::$1 (the site would stay stale)"; echo "Pages copy - $1 (the site would stay stale)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          M=$(gh api repos/$R/git/ref/heads/main --jq .object.sha)
          S=$(gh api repos/$R/git/ref/heads/site --jq .object.sha 2>/dev/null) || S=none; case "$S" in [0-9a-f]*) ;; *) S=none ;; esac
          # the main commit the live site was made from: 'site' itself (the old way) or the parent of a filtered site commit
          SRC=$S
          if [ "$S" != none ]; then
            case "$(gh api repos/$R/git/commits/$S --jq .message 2>/dev/null)" in
              "site: published copy of main "*) SRC=$(gh api repos/$R/git/commits/$S --jq '.parents[0].sha' 2>/dev/null) || SRC=$S ;;
            esac
          fi
          # what 'site' becomes: one shared script (also the watchdog's repair path), so the two cannot drift
          publish() { bash .github/scripts/kpc_site_publish.sh "$1" || true; }   # ok: it reports its own error (stale = red)
          if [ "$S" = none ]; then publish "branch site made"; exit 0; fi
          FILTERED_LIVE=no; [ "$SRC" != "$S" ] && FILTERED_LIVE=yes
          UP=no
          if [ "$M" = "$SRC" ]; then
            if [ "$FILTER" = on ] && [ "$FILTERED_LIVE" = yes ]; then UP=yes; fi
            if [ "$FILTER" = off ] && [ "$FILTERED_LIVE" = no ]; then UP=yes; fi
          fi
          if [ "$UP" = yes ]; then say "Pages copy: site is already main (${M:0:8}): nothing to publish"; exit 0; fi
          GO=no; WHY=""
          if [ -n "$SWITCH" ]; then GO=yes; WHY="by-hand switch run"
          elif [ "$FILTER" = on ] && [ "$FILTERED_LIVE" = no ]; then GO=yes; WHY="first filtered publish"
          elif [ "$FILTER" = off ] && [ "$FILTERED_LIVE" = yes ]; then GO=yes; WHY="filter switched off: everything published again"
          else
            # which files differ between the live site's main commit and main; bookkeeping does not count (same idea as KPC-Links' Pages filter)
            if gh api "repos/$R/compare/$SRC...$M?per_page=300" --jq '.files[].filename' > /tmp/files.txt 2>/dev/null && [ -s /tmp/files.txt ]; then
              N=$(wc -l < /tmp/files.txt)
              SITE=$(grep -v -E '^(\.claude/|\.github/|tests/|data/status/|data/waiting/)' /tmp/files.txt | wc -l)
              grep -q -x '.github/site-allow-list.txt' /tmp/files.txt && SITE=$((SITE + 1))   # a changed allow-list changes the site
              if [ "$N" -ge 300 ] || [ "$SITE" -gt 0 ]; then GO=yes; WHY="$SITE site file(s) changed"
              else
                # bookkeeping only: the status page reads data/status, so a site that is 6 h or more behind still moves
                SD=$(gh api repos/$R/commits/$SRC --jq .commit.committer.date 2>/dev/null || true)
                AGE=999999; [ -n "$SD" ] && AGE=$(( $(date -u +%s) - $(date -u -d "$SD" +%s 2>/dev/null || echo 0) ))
                if [ "$AGE" -ge 21600 ]; then GO=yes; WHY="only bookkeeping changed but the site copy is $((AGE/3600)) h old"; fi
              fi
            else GO=yes; WHY="could not compare ${SRC:0:8}...${M:0:8}"; fi
          fi
          if [ "$GO" = no ]; then say "Pages copy: only bookkeeping changed since the live copy (${SRC:0:8}): site left as it is"; exit 0; fi
          # never stack a move on a Pages build that is still running
          ST=$(gh api repos/$R/pages/builds/latest --jq .status 2>/dev/null || echo unknown)
          if [ "$ST" = building ] || [ "$ST" = queued ]; then say "Pages copy: a Pages build is still running ($ST): the next hourly run moves site ($WHY)"; exit 0; fi
          publish "$WHY"
          true   # ok: the next run tries again
      - name: Point Pages at the branch (one time, by hand)
        if: ${{ inputs.switch == 'yes' || inputs.switch == 'main' }}
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          B=${{ inputs.switch == 'yes' && 'site' || 'main' }}
          P=$(gh api repos/$R/pages --jq '.source.path // "/"' 2>/dev/null || echo /)
          echo "::notice title=Pages now::$(gh api repos/$R/pages --jq '"\(.build_type) from \(.source.branch) \(.source.path)"' 2>&1 | head -1)"
          echo "{\"build_type\":\"legacy\",\"source\":{\"branch\":\"$B\",\"path\":\"$P\"}}" > /tmp/p.json
          o=$(gh api -X PUT repos/$R/pages --input /tmp/p.json 2>&1) && echo "::notice title=Pages switched::Pages now publishes branch $B ($P)" || { kpc_rc=$?; echo "::warning title=Pages switch::could not point Pages at $B: $(echo $o | head -c 300)"; echo "Pages switch - could not point Pages at $B: $(echo $o | head -c 300)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          true   # ok: reported above
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
