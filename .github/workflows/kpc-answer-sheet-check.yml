# Nightly answer-sheet check (Mapping, Nov 3 2026, remade after Quality's grade K1-K5). Brandon approved the nightly run
# (cron 08:41 UTC) in his answer to Quality's Q3, relayed by Super at 6:52 PM CST Nov 3; this is its own patch so it can be
# reviewed and merged alone. It reads only; KPC_ANSWERS_TO stays 'overrides' (Brandon Q7) until the sheet is filled in.
name: KPC answer sheet check (nightly, read only, official layers only)
# Reads data/answer-sheet/{US,CA,world}.csv and asks each row's official layer whether the record is still there and still the
# same place (name + acres fingerprint, agency unit id). Writes ONLY data/answer-sheet/check/<XX>.json + <XX>-proposals.csv.
# It never edits a sheet. Changes from the first draft:
#  K1  no manners cache at all (the checker also forces it off in code): a vanished record can never read OK from a saved answer.
#  K4  <XX>-proposals.csv keeps a person's 'answer' / 'answered_by' from night to night (the checker carries them over), and this
#      workflow refuses to save if an answered proposal would be lost. Decisions still go in an inbox batch; Quality applies them.
#  K5  the status-board line is the REAL result: green only when every checker run exited 0 AND every check/<XX>.json says
#      green; amber when it ran but some YES rows were UNREAD; red when a checker run failed or nothing was written.
# Needs step-2 patch 01 (kpc_manners A1-A13) and step-2 patch 03 (checker + kpc_answer_words.py) on KPC-Data first.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 8 * * *'   # after the scoreboard (07:21 UTC) and before the US key build reads check/US.json (Super's schedule PR may move this)
permissions:
  contents: write
concurrency:
  group: kpc-answer-sheet-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Push helper (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Check every YES / NOT SURE / PIN / FIXED row
        id: check
        continue-on-error: true
        env:
          KPC_SLOW_HOST_BUDGET: '10'
        run: |
          cd kpcdata
          unset KPC_MANNERS_CACHE KPC_MANNERS_CACHE_ALL   # K1
          mkdir -p data/answer-sheet/check
          : > "$RUNNER_TEMP/answers_before.txt"
          for f in data/answer-sheet/check/*-proposals.csv; do [ -f "$f" ] && python3 -c "import csv,sys; [print(r['ref'],r['key_id'],r['column'],r['proposed'],sep='|') for r in csv.DictReader(open(sys.argv[1])) if (r.get('answer') or '').strip()]" "$f" >> "$RUNNER_TEMP/answers_before.txt"; done
          fail=0; ran=0
          for CC in US CA world; do
            [ -f data/answer-sheet/$CC.csv ] || continue
            ran=$((ran+1))
            if ! python3 .github/scripts/kpc_answer_sheet_check.py --sheet data/answer-sheet/$CC.csv --out data/answer-sheet/check/$CC.json; then
              echo "::error title=kpc_answer_sheet_check.py::$CC stopped with an error, see the log above"; fail=1
            fi
          done
          echo "fail=$fail" >> "$GITHUB_OUTPUT"; echo "ran=$ran" >> "$GITHUB_OUTPUT"
      - name: Work out the honest board line (K5)
        id: board
        if: always()
        run: |
          cd kpcdata
          python3 - "${{ steps.check.outputs.fail }}" "${{ steps.check.outputs.ran }}" "${{ steps.check.outcome }}" <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, sys
          fail, ran, outcome = sys.argv[1] == '1', int(sys.argv[2] or 0), sys.argv[3]
          J = []
          for f in sorted(glob.glob('data/answer-sheet/check/*.json')):
              try: J.append((f, json.load(open(f))))
              except Exception: fail = True
          if fail or outcome != 'success' or (ran and not J): res = 'red'
          elif J and all(j.get('green') is True for _, j in J): res = 'green'
          else: res = 'amber'
          made = '; '.join(f"{f.rsplit('/', 1)[-1]}: {j.get('counts')} unread YES {j.get('approved_unread')}" for f, j in J)[:280] or 'no sheet yet'
          print(f'result={res}'); print(f'made={made}')
          PY
      - name: Never lose a person's answer in the proposals (K4)
        id: keep_answers
        run: |
          cd kpcdata
          : > "$RUNNER_TEMP/answers_after.txt"
          for f in data/answer-sheet/check/*-proposals.csv; do [ -f "$f" ] && python3 -c "import csv,sys; [print(r['ref'],r['key_id'],r['column'],r['proposed'],sep='|') for r in csv.DictReader(open(sys.argv[1])) if (r.get('answer') or '').strip()]" "$f" >> "$RUNNER_TEMP/answers_after.txt"; done
          lost=$(sort -u "$RUNNER_TEMP/answers_before.txt" | comm -23 - <(sort -u "$RUNNER_TEMP/answers_after.txt") | wc -l)
          if [ "$lost" != "0" ]; then echo "::error title=answer sheet::$lost answered proposals would be lost; nothing saved"; exit 1; fi
      - name: Save the check (data/answer-sheet/check only; the sheets themselves are never written here)
        if: always() && steps.keep_answers.outcome == 'success'
        run: |
          cd kpcdata
          git diff --quiet -- data/answer-sheet/*.csv || { echo "::error title=answer sheet::a sheet changed during the check; nothing saved"; exit 1; }
          python3 .github/scripts/kpc_status.py board answer-sheet-check "${{ steps.board.outputs.result || 'red' }}" "${{ steps.board.outputs.made || 'checker did not report' }}" "proposals: answer YES / NO / NOT SURE in an inbox batch" || true
          bash ../links/.github/scripts/kpc_push_data.sh . "answer sheet: nightly check (read only)" data/answer-sheet/check data/status || { echo "::error title=kpc_push_data.sh::stopped with an error, see the log above"; exit 1; }
      - name: Red board line when the save step was skipped
        if: always() && steps.keep_answers.outcome != 'success'
        run: |
          cd kpcdata
          git checkout -- data/answer-sheet/check 2>/dev/null || true
          python3 .github/scripts/kpc_status.py board answer-sheet-check red "not saved: an answered proposal would have been lost" "Mapping / Quality" || true
          bash ../links/.github/scripts/kpc_push_data.sh . "answer sheet: board line (check not saved)" data/status || true
