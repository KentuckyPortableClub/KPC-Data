name: KPC 2-fer assembly line (hidden)
# Oct 27 5:23 PM (HQ): FETCHER -> WORKER -> CHECKER for one area (a state, or a few).
#  1 FETCHER (network, polite): POTA same-day history + passes 1-2 (saved + fresh outlines). Every map-server answer is kept in a
#    BUNDLE (kpc_http_cache.py) = a KPC-Data release asset 'bundle-<tag>.tar.gz' (release 'fers-bundles'), never in git.
#  2 WORKER: unpacks the bundle, passes 3 + 5 (finest shapes, ownership, water, pins, rule 15); the bundle goes back up.
#    A worker out of time can be run again alone (stage = worker) from the bundle.
#  3 CHECKER: known-answers test + missing check + 'every pass finished in this run, nothing cut short' -> data/fers/line-<tag>.json
#    READY FOR CHAT 8 / STOPPED; the results go into git ONCE, here (fetcher + worker never commit).
# Fable's review Oct 27 7:30 PM (A1-A6): every gh release call names THIS repo; a lost bundle (upload, download, wrong stage/tag)
# = a RED run (Brandon's email), never a green run with nothing in it; the worker reads KPC-Data's moved data from a real checkout;
# the bundle + the save carry ONLY this area's files (own states + tag files); two areas may run side by side (group per tag) because
# each writes only its own files and its own observations file.
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'Area (e.g. "US-MI")'
        default: 'US-MI'
      tag:
        description: 'Short name for its files (e.g. "mi")'
        default: 'mi'
      stage:
        description: 'all (fetcher + worker + checker), worker (+ checker, from the saved bundle), or checker'
        default: 'all'
      minutes:
        description: 'Minutes for each of fetcher and worker (default 280)'
        default: '280'
      parks:
        description: 'Optional small batch: park numbers (e.g. "US-1234 US-5678"): only the pairs touching them are looked at again'
        default: ''
      next:
        description: 'Optional: "<states> <tag>" (e.g. "US-OH oh") = start that area by itself once this fetcher''s bundle is safely up (two at once, no more)'
        default: ''
      key:
        description: 'Key to measure on: live (KPC-Data, default) or build (the new KPC-Links build, still held; the chain uses this)'
        default: 'live'
      force:
        description: 'yes = build even when the pre-line check says HOLD (by hand only; the report says FORCED)'
        default: 'no'
  workflow_call:
    inputs:
      states:
        type: string
        default: 'US-MI'
      tag:
        type: string
        default: 'mi'
      stage:
        type: string
        default: 'all'
      minutes:
        type: string
        default: '280'
      parks:
        type: string
        default: ''
      next:
        type: string
        default: ''
      key:
        type: string
        default: 'live'
      force:
        type: string
        default: 'no'
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-fers-line-${{ inputs.tag }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  BUNDLE: bundle-${{ inputs.tag }}.tar.gz
  STATES: ${{ inputs.states }}
  RUN_TAG: ${{ inputs.tag }}
  REGION: ${{ inputs.tag == 'ky' && 'ky' || startsWith(inputs.states, 'W-') && 'world' || 'na' }}   # Nov 8: W-* = the world key's countries   # tag ky = Kentucky from its official files (the hand-checked test state)
  HTTP_CACHE: bundle/http
  WATER_STORE: bundle/water   # Oct 28 (HQ): the saved USGS water copy (kept between nights as release asset water-<tag>.tar.gz)
  WATER_ASSET: water-${{ inputs.tag }}.tar.gz
  PARKS: ${{ inputs.parks }}   # Oct 28: a small batch (kpc_fers.py PARKS); empty = the whole area
  KEY_SOURCE: ${{ inputs.key == 'build' && 'build' || 'live' }}   # Nov 4: live (default) or build (the chain)
  BUILD_KIND: ${{ startsWith(inputs.states, 'CA-') && 'ca-key' || startsWith(inputs.states, 'W-') && 'world-key' || 'us-key' }}   # Nov 11: W-* = world-key (same rule as kind_of() in kpc_fers_chain_plan.py; a test checks both)
jobs:
  preline:
    # Nov 4 (Brandon, directly (Mapping chat), 4:52 AM CST Nov 4: "2fer line review? Plan and install any pre and post line bots for
    # the 2fer system."; the chain: per Brandon via Super Head Bot (relayed), 4:55 AM CST Nov 4): THE 2-FER PRE-LINE CHECK. It runs first, on every start (by hand, small batches, the chain, 'next').
    # GO = the line builds. HOLD (or the check failing / missing) = fetcher, worker and checker do not run. Read-only on the data;
    # it saves only its report (data/status/fers-preline/<tag>.json + .md). force=yes by hand builds anyway (the report says FORCED).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      wait: ${{ steps.wait.outputs.wait }}
      go: ${{ steps.check.outputs.go }}
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
          fetch-depth: 0        # the 'inputs newer than the key' test reads overrides.json's commit time
          filter: blob:none
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Wait for the saved-copy reader (the 2-fer run waits for it)
        id: wait
        run: |
          # owner decision, 2026-11-10: the finder reads the saved-copy-only map layers only after its saved-copy reader is in
          # KPC-Links (the literal text held_saved_missing in kpc_fers.py). Until then no pairs are tested and nothing is saved.
          if grep -qF held_saved_missing .github/scripts/kpc_fers.py 2>/dev/null; then
            echo "wait=0" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=2-fers waiting::the 2-fer run waits for the saved-copy reader in KPC-Links (held_saved_missing is not in kpc_fers.py yet): no pairs are tested this run, nothing is saved"
            echo "wait=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 2-fer pre-line check (GO / HOLD)
        if: ${{ steps.wait.outputs.wait != '1' }}
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ ! -f .github/scripts/kpc_fers_preline.py ]; then
            echo "::error title=2-fer pre-line check::KPC-Links has no kpc_fers_preline.py (links-05 not merged): HOLD, the line does not build"
            echo "go=no" >> "$GITHUB_OUTPUT"; echo "verdict=HOLD" >> "$GITHUB_OUTPUT"; exit 0
          fi
          STATES="$STATES" TAG="$RUN_TAG" KEY_SOURCE="$KEY_SOURCE" DATA=kpcdata FORCE="$FORCE" python3 .github/scripts/kpc_fers_preline.py
          grep -q '^go=yes' "$GITHUB_OUTPUT" || { kpc_rc=$?; echo "::warning title=2-fer pre-line check::HOLD: the 2-fer line for $STATES ($RUN_TAG) does not build; see kpcdata/data/status/fers-preline/$RUN_TAG.md"; echo "2-fer pre-line check - HOLD: the 2-fer line for $STATES ($RUN_TAG) does not build; see kpcdata/data/status/fers-preline/$RUN_TAG.md" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          [ -f "kpcdata/data/status/fers-preline/$RUN_TAG.md" ] && cat "kpcdata/data/status/fers-preline/$RUN_TAG.md" >> "$GITHUB_STEP_SUMMARY"; true
      - name: Save the pre-line report (only data/status/fers-preline)
        if: ${{ always() && steps.wait.outputs.wait != '1' }}
        run: bash .github/scripts/kpc_push_data.sh kpcdata "2-fer pre-line check ${{ inputs.tag }}" data/status/fers-preline || { kpc_rc=$?; echo "::warning title=2-fer pre-line check::report not saved (the verdict above still holds)"; echo "2-fer pre-line check - report not saved (the verdict above still holds)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8; Nov 4 PM fix bundle item 7)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
  fetcher:
    needs: preline
    if: ${{ needs.preline.outputs.wait != '1' && (needs.preline.outputs.go == 'yes' && inputs.stage == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B)
        run: |
          bash .github/scripts/kpc_overlay.sh kpcdata
          # Oct 29 11:35 PM (automation plan): every stage measures against the LIVE key (KPC-Data data/us-key + ca-key); KPC-Links
          # data/us-key may be a build still HELD in the waiting room. After a release, BOT E reruns the states that changed.
          # Nov 4 (the chain: per Brandon via Super Head Bot (relayed), 4:55 AM CST Nov 4): KEY_SOURCE=build = the chain measures on the NEW key build of
          # BUILD_KIND (still held; its 2-fers are held with it); the other keys stay the live (last good) ones.
          for k in us-key ca-key world-key; do [ "$KEY_SOURCE" = build ] && [ "$k" = "$BUILD_KIND" ] && continue; [ -d kpcdata/data/$k ] && mkdir -p data/$k && cp -f kpcdata/data/$k/*.json data/$k/ 2>/dev/null; done; true
      - name: Tools + saved outlines + this area's last 2-fer files
        id: kept_green_1
        continue-on-error: true
        run: |
          pip install -q numpy opencv-python-headless || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          mkdir -p cache/us cache/ca cache/world bundle/http data/fers
          if [ "$REGION" = world ]; then gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'W-*.json.gz' -D cache/world --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi   # Nov 8: world areas
          # A6: only this area's files travel (own states, the tag's files, known answers, POTA pairs): never the world files
          (cd kpcdata && LINKS=.. python3 .github/scripts/kpc_waiting_room.py resume data/fers) || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 29 (chat 2 + Brandon 10:22 PM): work on from the HELD 2-fer files
          for st in $STATES; do for f in kpcdata/data/fers/$st.json kpcdata/data/fers/$st.json.gz kpcdata/data/fers/pota-pairs-$st.json; do [ -f "$f" ] && cp "$f" data/fers/; done; done
          for f in kpcdata/data/fers/known-answers.json kpcdata/data/fers/*-$RUN_TAG.json; do [ -f "$f" ] && cp "$f" data/fers/; done
          for f in data/fers/*.json.gz; do [ -f "$f" ] && gunzip -f "$f"; done
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-*.json.gz' -D cache/us --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'CA-ALL.json.gz' -D cache/ca --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # the last bundle of this tag: its map-server answers (<= 21 days) are reused, its data files are not
          if gh release download fers-bundles -R "$REPO" -p "$BUNDLE" -D . --clobber 2>/dev/null; then tar xzf "$BUNDLE" bundle/http 2>/dev/null || true   # ok: nothing to do is fine
            # Oct 28 (HQ storage): the pair-reuse caches travel in the bundle, not the repo (saved answers, not data people see)
            tar xzf "$BUNDLE" --wildcards 'data/fers/reuse-p*' 2>/dev/null || true   # ok: nothing to do is fine
          fi
          find bundle/http -type f -mtime +60 -delete 2>/dev/null || true   # ok: an optional file or tidy step (B1 (Oct 30): 60 days (an older answer is re-read; the layer-edit check keeps unchanged ones cheap))
          # B1: and at most ~300 MB of saved answers: the oldest go first (a 1 GB bundle made tar + upload push jobs past their time limit)
          find bundle/http -type f -printf '%T@ %s %p\n' 2>/dev/null | sort -n | awk -v cap=$((300*1024*1024)) '{t+=$2; a[NR]=$3; s[NR]=$2} END{for(i=1;i<=NR&&t>cap;i++){print a[i]; t-=s[i]}}' | xargs -r rm -f || true   # ok: a pipeline (its exit status is the last command; follow-up: pipefail)
          # the last good USGS water copy of this area (never aged out: each tile carries its own date, rule 13)
          mkdir -p bundle/water
          if gh release download fers-bundles -R "$REPO" -p "$WATER_ASSET" -D . --clobber 2>/dev/null; then tar xzf "$WATER_ASSET" bundle/water 2>/dev/null || { kpc_rc=$?; echo "::warning title=Release::a release step failed (exit $kpc_rc)"; echo "Release - a release step failed (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
          echo "saved water tiles: $(ls bundle/water | wc -l)"
          echo "$(date -u +%F)" > data/fers/.since-$RUN_TAG
      - name: POTA same-day history
        id: kept_green_2
        continue-on-error: true
        timeout-minutes: 65
        env:
          PAIR_MINUTES: '60'
        run: python3 .github/scripts/kpc_pota_pairs.py || { kpc_rc=$?; echo "::error title=kpc_pota_pairs.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_pota_pairs.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: USGS water from the bulk files BEFORE the line (tiles under last run's rows; Fable Oct 28 10:34 PM)
        id: kept_green_3
        continue-on-error: true
        timeout-minutes: 120
        run: |
          STATES="$STATES" WATER_STORE=bundle/water DATA=data/fers python3 .github/scripts/kpc_water_bulk.py || { kpc_rc=$?; echo "::error title=kpc_water_bulk.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_water_bulk.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          pip install -q pyshp 2>/dev/null || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; STATES="$STATES" WATER_STORE=bundle/water DATA=data/fers python3 .github/scripts/kpc_water_ca.py || { kpc_rc=$?; echo "::error title=kpc_water_ca.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_water_ca.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Passes 1 + 2
        id: kept_green_4
        continue-on-error: true
        timeout-minutes: 275
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          M=${MINUTES:-280}; [ $M -gt 225 ] && M=225
          PASS=1 MINUTES=$(( M / 3 )) python3 .github/scripts/kpc_fers.py || { kpc_rc=$?; echo "::error title=kpc_fers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          PASS=2 MINUTES=$(( M * 2 / 3 )) python3 .github/scripts/kpc_fers.py || { kpc_rc=$?; echo "::error title=kpc_fers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: USGS water from the BULK FILES up front (HU4 files on USGS's Amazon storage, never the live map; HQ Oct 28 6:57 PM)
        id: kept_green_5
        continue-on-error: true
        timeout-minutes: 120
        run: |
          STATES="$STATES" WATER_STORE=bundle/water DATA=data/fers python3 .github/scripts/kpc_water_bulk.py || { kpc_rc=$?; echo "::error title=kpc_water_bulk.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_water_bulk.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          pip install -q pyshp 2>/dev/null || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; STATES="$STATES" WATER_STORE=bundle/water DATA=data/fers python3 .github/scripts/kpc_water_ca.py || { kpc_rc=$?; echo "::error title=kpc_water_ca.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_water_ca.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Bundle up (a lost bundle = a red run)
        if: always()
        run: |
          for st in $STATES; do [ -f "data/fers/$st.json" ] || { echo "::error title=2-fer line::fetcher made no data/fers/$st.json"; exit 1; }; done
          echo "{\"stage\":\"fetcher\",\"tag\":\"$RUN_TAG\",\"states\":\"$STATES\",\"date\":\"$(date -u +%FT%TZ)\",\"run\":\"$GITHUB_RUN_ID\"}" > bundle/stamp.json
          tar czf "$BUNDLE" bundle data/fers
          gh release view fers-bundles -R "$REPO" >/dev/null 2>&1 || gh release create fers-bundles -R "$REPO" --title 'Hidden 2-fer bundles' --notes 'Assembly-line bundles (bot use only).'
          bash kpcdata/.github/scripts/kpc_keep2.sh "$REPO" fers-bundles "$BUNDLE"   # the copy already up becomes .prev (last 2 kept per area)
          gh release upload fers-bundles "$BUNDLE" --clobber -R "$REPO" || { echo "::error title=2-fer line::bundle upload failed"; exit 1; }
          # the water copy is kept between nights; an empty one never replaces a good one
          if [ "$(ls bundle/water 2>/dev/null | wc -l)" -gt 0 ]; then tar czf "$WATER_ASSET" bundle/water && bash kpcdata/.github/scripts/kpc_keep2.sh "$REPO" fers-bundles "$WATER_ASSET" && gh release upload fers-bundles "$WATER_ASSET" --clobber -R "$REPO" && echo "::notice title=2-fer line::water copy $(ls bundle/water | wc -l) tiles ($(du -h "$WATER_ASSET" | cut -f1)) kept as $WATER_ASSET" || { kpc_rc=$?; echo "::warning title=2-fer line::water copy not uploaded (the bundle still has it)"; echo "2-fer line - water copy not uploaded (the bundle still has it)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; fi
          gh release view fers-bundles -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$BUNDLE" || { echo "::error title=2-fer line::bundle not on the release after upload"; exit 1; }
          echo "::notice title=2-fer line::fetcher bundle $(du -h "$BUNDLE" | cut -f1) uploaded to $REPO release fers-bundles"
      - name: Start the next area (chained)
        if: ${{ inputs.next != '' }}
        id: kept_green_6
        continue-on-error: true
        run: |
          set -- ${{ inputs.next }}
          [ -n "$2" ] && gh workflow run kpc-fers-line.yml -R "$REPO" -f "states=$1" -f "tag=$2" -f stage=all -f minutes=${{ inputs.minutes }} && echo "::notice title=2-fer line::next area started: $1 ($2)"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
