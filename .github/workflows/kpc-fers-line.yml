  broke:
    # Oct 28 (HQ queue rule 3): a line whose fetcher / worker broke is recorded; the queue goes on to the next area, but TWO
    # breaks in a row (different areas, within 6 h) = something that would repeat (bad bundle, a server down for everyone):
    # the whole run is cancelled and Brandon gets the one red mail.
    needs: [fetcher, worker]
    if: ${{ always() && (needs.fetcher.result == 'failure' || needs.worker.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
