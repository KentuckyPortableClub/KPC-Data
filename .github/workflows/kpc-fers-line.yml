name: KPC 2-fer assembly line (hidden)
# Oct 27 5:23 PM (HQ): FETCHER -> WORKER -> CHECKER for one area (a state, or a few).
#  1 FETCHER (network, polite): POTA same-day history + passes 1-2 (saved + fresh outlines). Every map-server answer is kept in a
#    BUNDLE (kpc_http_cache.py) = a KPC-Data release asset 'bundle-<tag>.tar.gz' (release 'fers-bundles'), never in git.
#  2 WORKER: unpacks the bundle, passes 3 + 5 (finest shapes, ownership, water, pins, rule 15); the bundle goes back up.
#    A worker out of time can be run again alone (stage = worker) from the bundle.
#  3 CHECKER: known-answers test + missing check + 'every pass finished in this run, nothing cut short' -> data/fers/line-<tag>.json
#    READY FOR CHAT 8 / STOPPED; the results go into git ONCE, here (fetcher + worker never commit).
# Fable's review Oct 27 7:30 PM (A1-A6): every gh release call names THIS repo; a lost bundle (upload, download, wrong stage/tag)
# = a RED run (Brandon's email), never a green run with nothing in it; the worker reads KPC-Data's moved data from a real checkout;
# the bundle + the save carry ONLY this area's files (own states + tag files); two areas may run side by side (group per tag) because
# each writes only its own files and its own observations file.
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'Area (e.g. "US-MI")'
        default: 'US-MI'
      tag:
        description: 'Short name for its files (e.g. "mi")'
        default: 'mi'
      stage:
        description: 'all (fetcher + worker + checker), worker (+ checker, from the saved bundle), or checker'
        default: 'all'
      minutes:
        description: 'Minutes for each of fetcher and worker (default 280)'
        default: '280'
      next:
        description: 'Optional: "<states> <tag>" (e.g. "US-OH oh") = start that area by itself once this fetcher''s bundle is safely up (two at once, no more)'
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-fers-line-${{ inputs.tag }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  BUNDLE: bundle-${{ inputs.tag }}.tar.gz
  STATES: ${{ inputs.states }}
  RUN_TAG: ${{ inputs.tag }}
  REGION: ${{ inputs.tag == 'ky' && 'ky' || 'na' }}   # tag ky = Kentucky from its official files (the hand-checked test state)
  HTTP_CACHE: bundle/http
  WATER_STORE: bundle/water   # Oct 28 (HQ): the saved USGS water copy (kept between nights as release asset water-<tag>.tar.gz)
  WATER_ASSET: water-${{ inputs.tag }}.tar.gz
jobs:
  fetcher:
    if: ${{ inputs.stage == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Tools + saved outlines + this area's last 2-fer files
        continue-on-error: true
        run: |
          pip install -q numpy opencv-python-headless || true
          mkdir -p cache/us cache/ca bundle/http data/fers
          # A6: only this area's files travel (own states, the tag's files, known answers, POTA pairs): never the world files
          for st in $STATES; do for f in kpcdata/data/fers/$st.json kpcdata/data/fers/$st.json.gz kpcdata/data/fers/pota-pairs-$st.json; do [ -f "$f" ] && cp "$f" data/fers/; done; done
          for f in kpcdata/data/fers/known-answers.json kpcdata/data/fers/*-$RUN_TAG.json; do [ -f "$f" ] && cp "$f" data/fers/; done
          for f in data/fers/*.json.gz; do [ -f "$f" ] && gunzip -f "$f"; done
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-*.json.gz' -D cache/us --clobber || true
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'CA-ALL.json.gz' -D cache/ca --clobber || true
          # the last bundle of this tag: its map-server answers (<= 21 days) are reused, its data files are not
          if gh release download fers-bundles -R "$REPO" -p "$BUNDLE" -D . --clobber 2>/dev/null; then tar xzf "$BUNDLE" bundle/http 2>/dev/null || true; fi
          find bundle/http -type f -mtime +21 -delete 2>/dev/null || true
          # the last good USGS water copy of this area (never aged out: each tile carries its own date, rule 13)
          mkdir -p bundle/water
          if gh release download fers-bundles -R "$REPO" -p "$WATER_ASSET" -D . --clobber 2>/dev/null; then tar xzf "$WATER_ASSET" bundle/water 2>/dev/null || true; fi
          echo "saved water tiles: $(ls bundle/water | wc -l)"
          echo "$(date -u +%F)" > data/fers/.since-$RUN_TAG
      - name: POTA same-day history
        continue-on-error: true
        timeout-minutes: 65
        env:
          PAIR_MINUTES: '60'
        run: python3 .github/scripts/kpc_pota_pairs.py || true
      - name: Passes 1 + 2
        continue-on-error: true
        timeout-minutes: 275
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          M=${MINUTES:-280}; [ $M -gt 225 ] && M=225
          PASS=1 MINUTES=$(( M / 3 )) python3 .github/scripts/kpc_fers.py || true
          PASS=2 MINUTES=$(( M * 2 / 3 )) python3 .github/scripts/kpc_fers.py || true
      - name: Save the USGS water near every spot (so the worker does not need USGS up later)
        continue-on-error: true
        timeout-minutes: 45
        run: WATER_PREFETCH=1 MINUTES=40 python3 .github/scripts/kpc_fers.py || true
      - name: Bundle up (a lost bundle = a red run)
        if: always()
        run: |
          for st in $STATES; do [ -f "data/fers/$st.json" ] || { echo "::error title=2-fer line::fetcher made no data/fers/$st.json"; exit 1; }; done
          echo "{\"stage\":\"fetcher\",\"tag\":\"$RUN_TAG\",\"states\":\"$STATES\",\"date\":\"$(date -u +%FT%TZ)\",\"run\":\"$GITHUB_RUN_ID\"}" > bundle/stamp.json
          tar czf "$BUNDLE" bundle data/fers
          gh release view fers-bundles -R "$REPO" >/dev/null 2>&1 || gh release create fers-bundles -R "$REPO" --title 'Hidden 2-fer bundles' --notes 'Assembly-line bundles (bot use only).'
          gh release upload fers-bundles "$BUNDLE" --clobber -R "$REPO" || { echo "::error title=2-fer line::bundle upload failed"; exit 1; }
          # the water copy is kept between nights; an empty one never replaces a good one
          if [ "$(ls bundle/water 2>/dev/null | wc -l)" -gt 0 ]; then tar czf "$WATER_ASSET" bundle/water && gh release upload fers-bundles "$WATER_ASSET" --clobber -R "$REPO" && echo "::notice title=2-fer line::water copy $(ls bundle/water | wc -l) tiles ($(du -h "$WATER_ASSET" | cut -f1)) kept as $WATER_ASSET" || echo "::warning title=2-fer line::water copy not uploaded (the bundle still has it)"; fi
          gh release view fers-bundles -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$BUNDLE" || { echo "::error title=2-fer line::bundle not on the release after upload"; exit 1; }
          echo "::notice title=2-fer line::fetcher bundle $(du -h "$BUNDLE" | cut -f1) uploaded to $REPO release fers-bundles"
      - name: Start the next area (chained)
        if: ${{ inputs.next != '' }}
        continue-on-error: true
        run: |
          set -- ${{ inputs.next }}
          [ -n "$2" ] && gh workflow run kpc-fers-line.yml -R "$REPO" -f "states=$1" -f "tag=$2" -f stage=all -f minutes=${{ inputs.minutes }} && echo "::notice title=2-fer line::next area started: $1 ($2)"
  worker:
    needs: fetcher
    if: ${{ always() && inputs.stage != 'checker' && (inputs.stage == 'worker' || needs.fetcher.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B, A5)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Tools + the bundle (no bundle = a red run)
        run: |
          pip install -q numpy opencv-python-headless || true
          mkdir -p cache/us cache/ca bundle/http data/fers
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-*.json.gz' -D cache/us --clobber || true
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'CA-ALL.json.gz' -D cache/ca --clobber || true
          gh release download fers-bundles -R "$REPO" -p "$BUNDLE" -D . --clobber || { echo "::error title=2-fer line::no bundle $BUNDLE on $REPO: run stage all"; exit 1; }
          tar xzf "$BUNDLE" || { echo "::error title=2-fer line::bundle would not unpack"; exit 1; }
          python3 - <<'PY' || exit 1
          import json, os, sys
          s = json.load(open('bundle/stamp.json')); print('bundle stamp:', s)
          if s.get('tag') != os.environ['RUN_TAG'] or s.get('stage') not in ('fetcher', 'worker'): print('::error title=2-fer line::bundle is for another tag or stage'); sys.exit(1)
          for st in os.environ['STATES'].split():
              if not os.path.exists(f'data/fers/{st}.json'): print(f'::error title=2-fer line::bundle has no data/fers/{st}.json'); sys.exit(1)
          PY
      - name: Passes 3 + 5
        continue-on-error: true
        timeout-minutes: 320
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          M=${MINUTES:-280}; [ $M -gt 300 ] && M=300
          PASS=3 MINUTES=$(( M * 4 / 5 )) python3 .github/scripts/kpc_fers.py || true
          PASS=5 MINUTES=$(( M / 5 )) python3 .github/scripts/kpc_fers.py || true
      - name: Bundle up (a lost bundle = a red run)
        if: always()
        run: |
          echo "{\"stage\":\"worker\",\"tag\":\"$RUN_TAG\",\"states\":\"$STATES\",\"date\":\"$(date -u +%FT%TZ)\",\"run\":\"$GITHUB_RUN_ID\"}" > bundle/stamp.json
          find bundle/http -type f -mtime +21 -delete 2>/dev/null || true
          tar czf "$BUNDLE" bundle data/fers
          gh release upload fers-bundles "$BUNDLE" --clobber -R "$REPO" || { echo "::error title=2-fer line::bundle upload failed"; exit 1; }
          # the water copy is kept between nights; an empty one never replaces a good one
          if [ "$(ls bundle/water 2>/dev/null | wc -l)" -gt 0 ]; then tar czf "$WATER_ASSET" bundle/water && gh release upload fers-bundles "$WATER_ASSET" --clobber -R "$REPO" && echo "::notice title=2-fer line::water copy $(ls bundle/water | wc -l) tiles ($(du -h "$WATER_ASSET" | cut -f1)) kept as $WATER_ASSET" || echo "::warning title=2-fer line::water copy not uploaded (the bundle still has it)"; fi
          echo "::notice title=2-fer line::worker bundle $(du -h "$BUNDLE" | cut -f1) uploaded"
  checker:
    needs: [fetcher, worker]
    if: ${{ always() && (inputs.stage == 'checker' || needs.worker.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: The worker's bundle (no bundle = a red run)
        run: |
          mkdir -p data/fers
          gh release download fers-bundles -R "$REPO" -p "$BUNDLE" -D . --clobber || { echo "::error title=2-fer line::no bundle $BUNDLE on $REPO"; exit 1; }
          tar xzf "$BUNDLE" bundle/stamp.json data/fers || { echo "::error title=2-fer line::bundle would not unpack"; exit 1; }
          python3 -c "import json,os,sys; s=json.load(open('bundle/stamp.json')); print('bundle stamp:', s); sys.exit(0 if s.get('stage')=='worker' and s.get('tag')==os.environ['RUN_TAG'] else 1)" || { echo "::error title=2-fer line::the bundle is not this tag's worker bundle"; exit 1; }
          # Oct 28: Kentucky's known answers are read FRESH from KPC-Data for every other area (the bundle's copy is as old as its fetcher:
          # Ohio's checker read last night's 2/18 and then wrote it back over Kentucky's 15/18)
          if [ "$RUN_TAG" = ky ]; then [ -f data/fers/known-answers.json ] || cp kpcdata/data/fers/known-answers.json data/fers/ 2>/dev/null || true
          else cp -f kpcdata/data/fers/known-answers.json data/fers/ 2>/dev/null || true; fi
          # the missing check measures outline to outline (HQ Oct 27): the saved outlines of this run's states
          mkdir -p cache/us data/us-key
          for st in $STATES; do
            cp kpcdata/data/us-key/$st.json data/us-key/ 2>/dev/null || true
            gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p "$st.json.gz" -D cache/us --clobber || true
          done
      - name: Check
        continue-on-error: true
        run: |
          SINCE=$(cat data/fers/.since-$RUN_TAG 2>/dev/null || date -u -d '-36 hours' +%F)
          if [ "$REGION" = ky ]; then python3 .github/scripts/kpc_fers_known.py || true; AREA=ky python3 .github/scripts/kpc_fers_expected.py || true
          else python3 .github/scripts/kpc_fers_expected.py || true; fi
          TAG=$RUN_TAG SINCE=$SINCE python3 .github/scripts/kpc_fers_line_check.py || true
          mkdir -p kpcdata/data/observations
          OBS_RUN="2-fer line $RUN_TAG" OBS_FILE=kpcdata/data/observations/fers-line-$RUN_TAG.json OBS_DATA_DIR=kpcdata python3 .github/scripts/kpc_map_observations.py || true
      - name: Save (once; a failed save = a red run)
        if: always()
        run: |
          set +e
          rm -f data/fers/.since-*
          for f in data/fers/*.json; do [ -f "$f" ] && [ $(stat -c %s "$f") -gt 20000000 ] && gzip -9nf "$f"; done
          mkdir -p kpcdata/data/fers
          # A6: only this area's files go back: own states, the tag's files, POTA pairs, known answers (ky)
          for st in $STATES; do for f in data/fers/$st.json data/fers/$st.json.gz data/fers/pota-pairs-$st.json; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/fers/; done; done
          for f in data/fers/*-$RUN_TAG.json; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/fers/; done
          # only Kentucky's own run may write the known-answers file (Oct 28)
          if [ "$RUN_TAG" = ky ] && [ -f data/fers/known-answers.json ] && ! cmp -s data/fers/known-answers.json kpcdata/data/fers/known-answers.json; then cp data/fers/known-answers.json kpcdata/data/fers/; fi
          cd kpcdata
          for f in data/fers/*.json.gz; do [ -f "$f" ] && rm -f "${f%.gz}"; done
          cd ..
          STRICT=1 bash .github/scripts/kpc_push_data.sh kpcdata "2-fer line ${{ inputs.tag }} (hidden data)" data || exit 1
