name: KPC skipped-run watchdog
# Nov 2 2026 (chat 10; chat 2 + Brandon 7:18 AM: GitHub skipped most of last night's scheduled runs and things stalled).
# Every 2 hours: every scheduled workflow of this repo whose newest cron time (25 min to 26 h ago) has no run is started once by
# hand (kpc_watchdog.py). Remembered in data/status/watchdog.json; one board line. Never red.
# PR3 (Nov 2): it also (a) checks that the website copy (branch 'site', which Pages publishes) is within ~1 h of main and restarts
# kpc-pages-sync if not, and (b) sweeps both repos' KEY bots for failed runs, ::error notes and silence -> ONE board line
# 'Key bots: errors and silence' (red = look). KPC-Links' relay heartbeat starts this watchdog when GitHub's timer skips it.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '6 */2 * * *'   # G9 Nov 2: was '7 */2 * * *' (spread the start times; now 1 min earlier)
    - cron: '36 */2 * * *'   # a second chance: GitHub skips the watchdog too   # G9 Nov 2: was '37 */2 * * *' (spread the start times; now 1 min earlier)
  workflow_dispatch:
    inputs:
      size:
        description: 'yes = also weigh the repo now (the daily size check runs by itself at 08 UTC)'
        default: 'no'
permissions:
  contents: write
  actions: write
  checks: read   # PR3: read the key bots' error notes (annotations)
  pages: read    # PR3: the site check reads whether Pages has a custom domain (CNAME)
concurrency:
  group: kpc-watchdog
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Start what GitHub skipped
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_watchdog.py   # PR3: also checks the website copy (branch 'site' vs main) and restarts it
      - name: Key bots - errors and silence, both repos (PR3; read-only, one board line)
        id: kept_green_4
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_key_errors.py
      - name: TRUE SIZE, once a day (Nov 2, Brandon 'we gain size so quick'; GitHub's own number lags a day or more)
        id: kept_green_3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "${{ inputs.size }}" = yes ] || { [ "$(date -u +%H)" = 08 ] && [ "$(date -u +%M | sed 's/^0//')" -lt 30 ]; } || exit 0   # once a day (the 08:07 slot) or by hand
          git clone -q --mirror "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" /tmp/m.git && MB=$(du -sm /tmp/m.git | cut -f1) || exit 0
          python3 - "$MB" <<'PY'
          import json, sys, datetime as dt, pathlib, subprocess
          mb = int(sys.argv[1]); p = pathlib.Path('data/status/size.json')
          d = json.load(open(p)) if p.exists() else {}
          h = d.setdefault('days', {}); today = dt.date.today().isoformat(); h[today] = mb
          days = sorted(h); wk = h[days[-8]] if len(days) >= 8 else h[days[0]]
          per_day = round((mb - wk) / max(1, min(7, len(days) - 1)), 1) if len(days) > 1 else 0
          d.update(updated=today, mb=mb, per_day=per_day, line=400, about='KPC-Data size from a fresh full copy (what GitHub stores), daily; kpc-watchdog.yml')
          json.dump(d, open(p, 'w'), indent=1)
          alarm = mb > 600 or per_day > 25
          msg = f'KPC-Data is {mb} MB (fresh copy), {per_day:+} MB a day over the last week' + (' -> TOO FAST / TOO BIG: find the bot that rewrites a big file (git log --stat on main)' if alarm else '')
          print(f"::{'warning' if alarm else 'notice'} title=Repo size::{msg}")
          subprocess.run([sys.executable, '.github/scripts/kpc_status.py', 'board', 'Repo size (daily)', 'amber' if alarm else 'green', msg[:300], 'HQ (alarm: >600 MB or >25 MB a day)'], check=False)
          PY
      - name: 2-FER GATE (Nov 2, RULINGS 10:57 AM) - an area's 2-fers start when its key is out and its map audit rows are answered
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/kpc_fers_gate.py gate
      - name: Save
        id: save
        # Nov 2 bot fixes (run 41558037825, exit 128): the gate leaves map-audit.json changed but not staged, so 'git pull --rebase'
        # refused ('You have unstaged changes'), then the bare 'git rebase --abort' (no rebase in progress) exited 128 and ended the
        # step, hidden by continue-on-error. Now: --autostash, the abort may fail quietly, and a save that never lands turns the job RED.
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/status 2>/dev/null || true; python3 .github/scripts/kpc_stamp_only.py   # PR2: a look that only moved a time stamp saves nothing
          git diff --cached --quiet && exit 0
          git commit -qm 'watchdog: skipped runs started again'
          saved=0
          for i in 1 2 3 4; do
            if git pull -q --rebase --autostash origin main && git push -q origin HEAD:main; then saved=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i*6))
          done
          if [ "$saved" != 1 ]; then echo "::error title=Save::the watchdog's save did not land after 4 tries (see the git lines above); the next run tries again"; exit 1; fi
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
