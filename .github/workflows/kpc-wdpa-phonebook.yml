name: KPC WDPA phone book - who runs the parks we still miss (by hand, saved copy only)
# Nov 1 2026 (chat 10; Brandon 7:30 PM 'use them as a phone book ... yes use it like that'). Managing authority, local name,
# designation and data provider of the protected area at each pin of a park with no official outline. No shapes kept (W-10 terms).
# Nov 11 2026 (host rules, review package A): SAVED COPY ONLY. WDPA sits on a services*.arcgis.com host, which no bot contacts (no
# request of any kind, robots.txt included). kpc_wdpa_phonebook.py makes no request: it reads a saved WDPA copy a person put OUTSIDE
# the repo (KPC_WDPA_SAVED) and writes the phone book outside the repo (KPC_WDPA_OUT): KPC-Data main is published whole to Pages, so
# nothing WDPA is committed here. On a runner there is no saved copy: the run ends green with a visible 'needs the saved WDPA copy'
# warning and status board line. ONE job with a time budget; it never starts another run (the old self-start chain is gone).
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
  # PAUSED Nov 4 (fix bundle; Brandon's yes relayed via Super Head Bot 4:53 PM CST; revert this one commit to resume): the schedule is off, by hand (workflow_dispatch) only
  # schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    # - cron: '53 9 * * *'   # PR2 (Nov 2): daily (was every 6 h, '53 */6 * * *'); WDPA's agency names change rarely. Chain brake: 6 runs a day
permissions:
  contents: write
concurrency:
  group: kpc-wdpa-phonebook
  cancel-in-progress: false
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LINKS: ../links
      MINUTES: '45'
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/kpc_push_data.sh
            /data/us-key/
            /data/ca-key/
            /data/world-key/
          sparse-checkout-cone-mode: false
      - name: Look up the parks we still miss (saved WDPA copy only; no request of any kind)
        id: b
        continue-on-error: true
        run: |
          cd kpcdata
          python3 .github/scripts/kpc_wdpa_phonebook.py | tee /tmp/pb.txt; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { kpc_rc=$?; echo "::warning title=kpc_wdpa_phonebook.py::stopped with an error (exit $rc), see the log above"; echo "kpc_wdpa_phonebook.py - stopped with an error (exit $rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # only the status board line is saved here: the phone book itself is private (outside the repo), never committed
          bash ../links/.github/scripts/kpc_push_data.sh . "WDPA phone book: status line" data/status || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
