name: KPC NO rechecker (KPC_8) - re-tests every NO answer; flags go to chat 11
# Oct 31 2026 (chat 10; HQ 8:40 PM, Brandon 5:14 PM plan): the outside coder's NO rechecker re-tests every NO in gis-hunter,
# layers, key-pieces and world-finder (pin, all record fields, POTA's current name, neighbouring records) and flags LOOK AGAIN /
# BETTER RECORD. It never changes an answer. Flags -> data/waiting/questions/no-recheck.json for chat 11; everything else on
# branch tools-out (no-recheck/). By hand now (ONE run on all piles = the real-world test, chains while rows are left); weekly
# after the collector once chat 11 says it is good. Never red.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-no-recheck
  cancel-in-progress: false
# PR2 (Nov 2): a push to tools-out that loses a race with another bot pulls --rebase and tries again (5 tries; no force).
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck (resumes)
        id: r
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin tools-out:tools-out && git worktree add -q ../out tools-out || true   # ok: optional git step; the next step reports
          D=.github/scripts/draft/tools/kpc_no_recheck
          pip install -q -r $D/requirements.txt
          set +e
          python $D/kpc_no_recheck.py --files gis-hunter.json layers.json key-pieces.json world-finder.json --in-dir data/waiting/questions --out ../out/no-recheck --resume --max-minutes 45 --min-interval 2 2>&1 | tail -12
          E=${PIPESTATUS[0]}; [ "$E" = 3 ] && echo "more=yes" >> $GITHUB_OUTPUT
          set -e
          rm -rf ../out/no-recheck/cache
          if [ -f ../out/no-recheck/questions.json ]; then
            python3 -c "
          import json; q=json.load(open('../out/no-recheck/questions.json')); rows=q.get('questions') if isinstance(q,dict) else q
          json.dump({'about':'NO rechecker (KPC_8): NO answers it thinks deserve another look (LOOK AGAIN / BETTER RECORD). It never changes an answer; chat 11 decides.','questions':rows or []},open('data/waiting/questions/no-recheck.json','w'),indent=1,ensure_ascii=False)
          print('flags for chat 11:',len(rows or []))" || echo "::warning title=inline python::a small python step failed (exit $?)"
          fi
          N=$(python3 -c "import json;print(len(json.load(open('data/waiting/questions/no-recheck.json'))['questions']))" 2>/dev/null || echo 0)
          python3 .github/scripts/kpc_status.py board "NO rechecker" green "NO answers re-tested (tools-out no-recheck/summary.md)" "chat 11 looks at $N flagged rows (data/waiting/questions/no-recheck.json)" || true   # ok: a status-board line (reporting only)
          bash ../links/.github/scripts/kpc_push_data.sh . "NO rechecker: flags for chat 11" data/waiting/questions/no-recheck.json data/status || echo "::error title=kpc_push_data.sh::stopped with an error (exit $?), see the log above"
          (cd ../out && git add -A no-recheck && git commit -qm "NO rechecker (run ${{ github.run_id }})" && (for i in 1 2 3 4 5; do git push -q origin tools-out && exit 0; git pull -q --rebase origin tools-out || git rebase --abort 2>/dev/null; sleep $((i*7)); done; exit 1)) || echo "::error title=git push::a push failed (exit $?); this run is NOT saved"
          true
      - name: Next run while rows are left
        if: steps.r.outputs.more == 'yes'
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR2 (fewer runs, Nov 2): CHAIN BRAKE. A self-starting chain stops for the day after 12 runs in 24 h (Nov 2: the hard look
          # reader chained 187 times and the WDPA phone book 178 times in one day, each one a commit and a site rebuild). The next
          # scheduled run picks the work up again. Raise the number here if a backlog really needs more.
          kpc_brake() { n=$(gh api "repos/${{ github.repository }}/actions/workflows/kpc-no-recheck.yml/runs?created=>=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=1" --jq .total_count 2>/dev/null || echo 0); if [ "${n:-0}" -ge 12 ]; then echo "::notice title=Chain brake::kpc-no-recheck.yml ran $n times in 24 h (limit 12): no next run now; the next scheduled run goes on"; return 1; fi; return 0; }
          kpc_brake || exit 0
          gh workflow run kpc-no-recheck.yml -R ${{ github.repository }} --ref main || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
