name: KPC review pile solver (proposals to the waiting room)
# Nov 4 2026 (handoff REVIEW_PILE_SOLVER_HANDOFF.md; Brandon 7:16 AM CST: 'have the whole review list be run one time then anything new
# gets ran automatically and eventually I take over the list and check what it can not fix'). Reads KPC-Links' pre-check review pile
# (regenerated every run, ~10 s, no network) and gives each park ONE verdict: SOLVED-JOIN / SOLVED-PIN / NEEDS-PERSON (what is missing).
# PROPOSALS ONLY: data/waiting/in/data/pile-solver/ (the waiting room grades it), data/pile-solver/state.json, new 'tract' rows in
# data/detective/questions.json. Never a key, overrides.json or the answer sheet; never deletes a file. One save per run.
# NO NEW CRON: it follows the hourly Step B3 copy (workflow_run; ends in seconds when automatic mode is off or the pile did not change).
# Automatic mode stays OFF until Brandon's GO after the backfill grades: data/pile-solver/state.json "auto": true.
# Pull requests that change the solver: the selftest + a REPORT-ONLY milestone run of US-TN + US-CO (nothing saved; the outputs, the
# run log and the frozen web answers come back as a downloadable artifact for grading).
on:
  workflow_run:
    workflows: ['KPC copy site data to KPC-Data (Step B3)']
    types: [completed]
  workflow_dispatch:
    inputs:
      areas:
        description: 'Areas to backfill (e.g. "US-TN US-CO"); blank = every area with rows to do'
        default: ''
      chunks:
        description: 'How many 50-minute chunks this job may work (max 5); one save at the end'
        default: '1'
      max_parks:
        description: 'Cap on parks per chunk (0 = no cap)'
        default: '0'
  pull_request:
    paths:
      - '.github/scripts/kpc_pile_solver.py'
      - '.github/workflows/kpc-pile-solver.yml'
      - 'tests/fixtures/pile_solver/**'
  # schedule:   # NEEDS BRANDON'S OK. Not needed today: the B3 copy above already brings each new key build within the hour.
  #   - cron: '23 */6 * * *'
permissions:   # review (Nov 4): read-only by default; only the solve job (one save per run) may write
  contents: read
defaults:
  run:
    shell: bash   # bash -eo pipefail: a solver crash under '| tee' fails the step (and nothing is saved)
concurrency:
  group: kpc-pile-solver
  cancel-in-progress: false
jobs:
  solve:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 290
    permissions:
      contents: write
    env:
      LINKS: ../links
      MODE: ${{ github.event_name == 'workflow_run' && 'auto' || 'backfill' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Automatic mode is off until Brandon's GO (ends in seconds)
        id: gate
        run: |
          cd kpcdata
          if [ "$MODE" = auto ]; then
            A=$(python3 -c "import json;print(1 if json.load(open('data/pile-solver/state.json')).get('auto') is True else 0)" 2>/dev/null || echo 0)
            if [ "$A" != 1 ]; then echo "::notice title=Pile solver::automatic mode is off (data/pile-solver/state.json auto != true): nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
          fi
      - name: Keys, overrides and the pre-check (KPC-Links, read-only)
        if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Selftest (offline)
        if: steps.gate.outputs.skip != '1'
        run: cd kpcdata && python3 .github/scripts/kpc_pile_solver.py --selftest
      - name: Regenerate the review pile (no network)
        if: steps.gate.outputs.skip != '1'
        run: |
          cd links
          OUT="$RUNNER_TEMP/precheck" DATA=../kpcdata python3 .github/scripts/kpc_precheck.py
          echo "PILE=$RUNNER_TEMP/precheck/review-pile.csv" >> "$GITHUB_ENV"
          echo "KEY_BUILD=links-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - name: Solve in chunks, then one save
        if: steps.gate.outputs.skip != '1'
        env:
          AREAS: ${{ inputs.areas }}
          MAX_PARKS: ${{ inputs.max_parks || '0' }}
          CHUNKS: ${{ inputs.chunks || '1' }}
          MINUTES: '50'
        run: |
          cd kpcdata
          N="$CHUNKS"; case "$N" in ''|*[!0-9]*) N=1 ;; esac; [ "$N" -gt 5 ] && N=5; [ "$N" -lt 1 ] && N=1
          for i in $(seq 1 "$N"); do
            echo "::group::chunk $i of $N"
            python3 .github/scripts/kpc_pile_solver.py | tee "$RUNNER_TEMP/solver.log"
            echo "::endgroup::"
            grep -q 'left_for_next_run' "$RUNNER_TEMP/solver.log" || break
          done
          bash ../links/.github/scripts/kpc_push_data.sh . "pile solver: proposals (${AREAS:-$MODE})" data/waiting/in/data/pile-solver data/pile-solver data/detective/questions.json
      - name: Run log for grading
        if: always() && steps.gate.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: pile-solver-run-log
          path: kpcdata/data/waiting/in/data/pile-solver/
          if-no-files-found: ignore

  pr-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LINKS: ../links
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Selftest (offline)
        run: cd kpcdata && python3 .github/scripts/kpc_pile_solver.py --selftest
      - name: Milestone 1, report only (US-TN + US-CO; nothing is saved)
        env:
          AREAS: 'US-TN US-CO'
          REPORT_ONLY: '1'
          MINUTES: '45'
        run: |
          mkdir -p "$RUNNER_TEMP/m1"
          cd links && OUT="$RUNNER_TEMP/precheck" DATA=../kpcdata python3 .github/scripts/kpc_precheck.py && cd ../kpcdata
          OUT_DIR="$RUNNER_TEMP/m1" FREEZE="$RUNNER_TEMP/m1/fixtures" PILE="$RUNNER_TEMP/precheck/review-pile.csv" \
            python3 .github/scripts/kpc_pile_solver.py | tee "$RUNNER_TEMP/m1/run.log"
      - name: Outputs, run log and frozen web answers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pile-solver-milestone-1
          path: ${{ runner.temp }}/m1/
          if-no-files-found: warn
