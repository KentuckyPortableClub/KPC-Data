name: KPC copy site data to KPC-Data (Step B3)
# Oct 27 (storage plan Stage 2, step B3; HQ 5:39 PM): copies the bot-rewritten data folders the pages fetch from KPC-Links to the
# SAME paths here (KPC.dataUrl tries /KPC-Data/<path> first). Runs once by hand, then daily, so these copies never go stale while
# the bots still write in KPC-Links. Step B5 (a bot moves here): take its folder OUT of the list below the same day.
# B5 (chat 5, Oct 27): data/leaders came off this list (its bot now writes here). LEFT OUT (HQ 5:41 PM: written more than once a day, so pages must keep reading the site's fresh copy): data/alerts (US closures 4x a day,
# EU alerts every 6 h). They come here the day their bot moves (B5). Only folders changed daily or less are copied.
# KPC-Links is read only. One commit per run, only when something changed. Never fails.
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '40 10 * * *'   # G9 Nov 2: was '41 10 * * *' (spread the start times; now 1 min earlier)
    # Oct 29 (BOT C): a second look in the evening so a key rebuilt in the day reaches chat 11's sample the same night
    - cron: '40 1 * * *'   # G9 Nov 2: was '41 1 * * *' (spread the start times; now 1 min earlier)
    # Oct 30 (Brandon 11:01 AM, 'All 3'): every hour a quick look: only when a map key changed in KPC-Links does the copy run
    # (so chat 11's sample shows a new build within the hour); else the run ends in seconds
    - cron: '11 * * * *'   # PR3 (Nov 2): back to hourly, as Brandon asked Oct 30 (PR2 had made it every 3 h); a run with no new map key ends in seconds
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-copy-from-links
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.g.outputs.work }}
      fp: ${{ steps.g.outputs.fp }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            data/us-key
            data/ca-key
            data/world-key
      - uses: actions/checkout@v5
        with:
          path: kpcdata
          sparse-checkout: |
            data/waiting/key-seen.txt
            .github/scripts/kpc_key_id.py
      - id: g
        run: |
          # Nov 2 review: a fingerprint that leaves out time stamps (kpc_key_id.py), so a rebuild that changed nothing is not new work
          F=$(python3 kpcdata/.github/scripts/kpc_key_id.py all links 2>/dev/null) || F=""
          [ -n "$F" ] || F=$(cat links/data/us-key/*.json links/data/ca-key/*.json links/data/world-key/*.json 2>/dev/null | sha1sum | cut -c1-16)
          O=$(cat kpcdata/data/waiting/key-seen.txt 2>/dev/null || echo none)
          echo "fp=$F" >> "$GITHUB_OUTPUT"
          H=$(date -u +%H:%M)
          if [ "${{ (inputs.as_schedule && 'schedule') || github.event_name }}" = schedule ] && [ "${{ (github.event.schedule || inputs.as_schedule) }}" = '11 * * * *' ] && [ "$F" = "$O" ]; then echo "work=0" >> "$GITHUB_OUTPUT"; echo "::notice title=Copy::no new key build: nothing to do"; else echo "work=1" >> "$GITHUB_OUTPUT"; fi
  copy:
    needs: gate
    if: ${{ needs.gate.outputs.work == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Copy (folders mirrored, single files copied)
        id: kept_green_1
        continue-on-error: true
        run: |
          # Oct 29 8:25 PM (Brandon 7:48 PM release GO, chat 11 RELEASE YES): the Rule G keys data/us-key + data/ca-key are back in
          # Oct 29 10:15 PM (chat 2): data/us-key HELD again until chat 11 passes the next rebuild's sample (the waiting-room hold for
          # the key bot is not wired yet); chat 2 puts it back after chat 11's YES
          DIRS="data/pota data/canada-bounds data/campfed data/campstate-manual data/nwr"   # Oct 30: data/campstate goes through the waiting room (below)
          FILES="data/northam.json data/canada.json data/parkinfo-web.json data/boundary-score.json data/boundary-report.json data/state-gis-found.json data/access-layers.json data/state-gis.json"
          for d in $DIRS; do [ -d "links/$d" ] && mkdir -p "kpcdata/$d" && rsync -a --delete "links/$d/" "kpcdata/$d/"; done
          for f in $FILES; do [ -f "links/$f" ] && mkdir -p "kpcdata/$(dirname $f)" && cp "links/$f" "kpcdata/$f"; done
          # Oct 29 10:25 PM (chat 2 request, Brandon 10:21 PM 'map key bot isn't hooked into the waiting room yet'): the keys come over into
          # a working copy, then every CHANGED key file goes to data/waiting/in/ (checked: outlines lost, names vs POTA, retired parks,
          # PAD-US shape test) and the live key stays as it was; chat 11 approves (+ chat 2 rechecks) in data/waiting/approved.json, and
          # the waiting-room workflow mode release-approved puts it live. A Rule G change on purpose = a G5 stamp (big-change alarm only).
          # Oct 30 5:55 AM (Brandon: 'World boundaries ... a go', release after chat 11's check): the world key is held the same way
          for d in data/us-key data/ca-key data/world-key; do [ -d "links/$d" ] && mkdir -p "kpcdata/$d" && rsync -a "links/$d/" "kpcdata/$d/"; done
          # Oct 30 11:12 AM (HQ, Brandon 11:10 AM 'turn bot on'): US camping is shown again and refreshed weekly: the state camping bot's
          # files (KPC-Links data/campstate, every state but KY, Wednesdays) come over and every CHANGED file waits for chat 11 (Rule F checks)
          [ -d links/data/campstate ] && mkdir -p kpcdata/data/campstate && rsync -a links/data/campstate/ kpcdata/data/campstate/
          # Nov 2 (Brandon 7:11 AM, BUILD STAMP + FREEZE): a held key build chat 11 is grading (or has passed, not yet released) is never
          # replaced: that key's copy is put back and not diverted. A KEY NO frees the Canada / world copy (the next build fixes it);
          # a US KEY NO goes out per park first (kpc_release_approved.py), which empties the held folder.
          KD=$(cd kpcdata && python3 - <<'PY'
          import json, os
          ap = json.load(open('data/waiting/approved.json')) if os.path.exists('data/waiting/approved.json') else {}
          out = []
          # Nov 2 12:40 PM (HQ ruling on chat 2's stale Quebec copy): KEYS FLOW ONE WAY, KPC-Data -> website. The key bots BUILD in
          # KPC-Links, so only key FILES a build has CHANGED since the last copy come over (data/waiting/key-files-seen.json = the
          # hash of every KPC-Links key file at its last copy); an unchanged KPC-Links copy is an old mirror and never replaces
          # KPC-Data's file (it is put back here). First run: everything recorded, nothing copied.
          import hashlib, subprocess
          SP = 'data/waiting/key-files-seen.json'
          first = not os.path.exists(SP)
          seen = {} if first else json.load(open(SP))
          def back(rel):   # put KPC-Data's own file back (or remove a file KPC-Data does not have)
              if subprocess.run(['git', 'checkout', '-q', 'HEAD', '--', rel], capture_output=True).returncode:
                  try: os.remove(rel)
                  except OSError: pass
          newk, hashes = {}, {}
          for k in ('us-key', 'ca-key', 'world-key'):
              d = f'../links/data/{k}'
              for f in sorted(os.listdir(d)) if os.path.isdir(d) else []:
                  rel = f'data/{k}/{f}'
                  if not os.path.isfile('../links/' + rel): continue
                  h = hashes[rel] = hashlib.sha1(open('../links/' + rel, 'rb').read()).hexdigest()
                  if not first and f != 'index.json' and seen.get(rel) != h: newk.setdefault(k, []).append(f)
              if first: seen.update({r: h for r, h in hashes.items() if r.startswith(f'data/{k}/')})
          for k in ('us-key', 'ca-key', 'world-key'):
              n = newk.get(k, [])
              print(f'::notice title=Copy::{k}: {len(n)} key file(s) changed by a build since the last copy' + (f' ({" ".join(n[:12])})' if n else ': nothing comes over (keys flow KPC-Data -> website)'), flush=True)
              if not n: continue
              try: hb = json.load(open(f'data/waiting/in/data/{k}/index.json')).get('build')
              except Exception: hb = None
              v = [str(it.get('chat11') or '').upper() for it in (ap.get('items') or []) if isinstance(it, dict) and it.get('what') == k and str(it.get('build') or '') == str(hb)]
              if hb and not (v and k != 'us-key' and v[-1].lstrip('KEY ').startswith('NO')):
                  print(f'::notice title=Copy::{k} build {hb} is held for chat 11 / its release: not replaced (comes over once it is graded)', flush=True); continue
              d = f'../links/data/{k}'
              for f in os.listdir(d):
                  rel = f'data/{k}/{f}'
                  if f in n: seen[rel] = hashes[rel]
                  elif f != 'index.json': back(rel)   # unchanged = an old mirror: KPC-Data's own file stays
              out.append(f'data/{k}')
          json.dump(seen, open(SP, 'w'), indent=0, sort_keys=True)
          print('DIRS=' + ' '.join(out))
          PY
          )
          echo "$KD" | grep '^::' || true   # ok: a pipeline (its exit status is the last command; follow-up: pipefail)
          KDIRS=$(echo "$KD" | grep '^DIRS=' | cut -d= -f2-)
          for k in data/us-key data/ca-key data/world-key; do case " $KDIRS " in *" $k "*) ;; *) (cd kpcdata && git checkout -q HEAD -- "$k" 2>/dev/null; git clean -qfd -- "$k" 2>/dev/null) ;; esac; done
          # a key build made before the stamp existed gets an id from its content fingerprint (same build = same id every hour)
          # Nov 2 review (Mapping #7): the fingerprint is now THIS key's own (kpc_key_id.py one), not one sha1 over all three keys,
          # and it leaves out time stamps, so a Canada or world change no longer gives the US key a new id (and the other way round)
          for k in $KDIRS; do KID=$(python3 kpcdata/.github/scripts/kpc_key_id.py one links "${k#data/}" 2>/dev/null) || KID="${{ needs.gate.outputs.fp }}"
            python3 - "$k" "$KID" <<'PY' || echo "::error title=inline Python::stopped with an error (exit $?), see the log above"
          import json, sys
          k, rid = sys.argv[1], sys.argv[2]
          p = f'kpcdata/{k}/index.json'
          try: d = json.load(open(p))
          except Exception: d = {}
          if not d.get('build'):
              d['build'] = {'data/us-key': 'US', 'data/ca-key': 'CA', 'data/world-key': 'W'}[k] + '-f' + rid[:10]   # same build content = same id
              json.dump(d, open(p, 'w'), indent=1, ensure_ascii=False)
              print(f'::notice title=Copy::{k} had no build id: stamped {d["build"]} on its way to the waiting room')
          PY
          done
          (cd kpcdata && LINKS=../links python3 .github/scripts/kpc_waiting_room.py divert $KDIRS data/campstate) || echo "::error title=kpc_waiting_room.py::stopped with an error (exit $?), see the log above"
          # Oct 29 11:45 PM (BOT C, plan KPC_Key_And_2fer_Automation_Plan.md): held build vs live key + chat 11's sample of 30
          (cd kpcdata && LINKS=../links python3 .github/scripts/kpc_key_summary.py) || echo "::error title=kpc_key_summary.py::stopped with an error (exit $?), see the log above"
          # Oct 30 7:40 AM (chat 3 via HQ): the per-program park lists come from THIS copy of locations.json, so they never go stale
          [ -f links/locations.json ] && python3 kpcdata/.github/scripts/kpc_split_locations.py links/locations.json kpcdata || echo "::error title=kpc_split_locations.py::stopped with an error (exit $?), see the log above"
          echo "::notice title=Step B3 copy::$(du -sh kpcdata/data | cut -f1) in kpcdata/data"
      - name: Save (once)
        id: kept_green_2
        continue-on-error: true
        run: |
          # the layer collector moved to kpc-collector.yml (Oct 30 10:45 AM: starts itself every 2 h when the Fable / atlas files have new work)
          (cd kpcdata && LINKS=../links python3 .github/scripts/kpc_hunter_trigger.py > /tmp/hunt.txt) || echo "::error title=kpc_hunter_trigger.py::stopped with an error (exit $?), see the log above"; cat /tmp/hunt.txt || true   # ok: nothing to do is fine
          echo "${{ needs.gate.outputs.fp }}" > kpcdata/data/waiting/key-seen.txt   # the key build this copy carried (the hourly look compares with it)
          bash links/.github/scripts/kpc_push_data.sh kpcdata "Site data copied from KPC-Links (Step B3)" data locations-pota.json locations-sota.json locations-wwff.json
      - name: The picture-map branch (daily cleanup)
        id: kept_green_3
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: picture-maps
          path: pm
      - name: A park with an OFFICIAL outline now loses its picture map (HQ Oct 30 8:45 AM (2); house rule Oct 29 11:10 PM)
        id: kept_green_4
        continue-on-error: true
        run: |
          cd pm
          PIC_ROOT=. LINKS=../links python3 ../kpcdata/.github/scripts/kpc_lookup.py map-cleanup || echo "::error title=kpc_lookup.py::stopped with an error (exit $?), see the log above"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; git diff --cached --quiet && exit 0
          git commit -qm 'picture maps: daily cleanup (parks now with an official outline)'
          { saved=0; for i in 1 2 3; do git pull -q --rebase origin picture-maps && git push -q origin HEAD:picture-maps && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || echo "::error title=Save::not saved after every try; the next run tries again"; }
          true
      - name: The look-up branch (the new-park pipeline files a page read there)
        id: kept_green_5
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: lookup
          path: lk
      - name: New parks with no outline -> one hunter areas-run + one look-up read (HQ Oct 30 7:40 AM (b); never posts)
        id: kept_green_6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd kpcdata && LINKS=../links LOOKUP_ROOT=../lk python3 .github/scripts/kpc_new_park_flow.py > /tmp/newp.txt) || echo "::error title=kpc_new_park_flow.py::stopped with an error (exit $?), see the log above"; cat /tmp/newp.txt || true   # ok: nothing to do is fine
          bash links/.github/scripts/kpc_push_data.sh kpcdata "new-park pipeline: handled list" data/gis-hunter/new-parks.json || echo "::error title=kpc_push_data.sh::stopped with an error (exit $?), see the log above"
          (cd lk && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add requests && ! git diff --cached --quiet && git commit -qm 'new-park pipeline: page reads' && { saved=0; for i in 1 2 3; do git pull -q --rebase origin lookup && git push -q origin HEAD:lookup && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || echo "::error title=Save::not saved after every try; the next run tries again"; }) || true   # ok: nothing new to commit; a lost save is reported by the loop itself
          A=$(grep -o '^AREAS=.*' /tmp/newp.txt | cut -d= -f2)
          if [ -n "$A" ] && ! grep -q '^RUN=' /tmp/hunt.txt 2>/dev/null; then   # a full pass already started covers them (two queued runs would cancel each other)
            gh api -X POST repos/${{ github.repository }}/actions/workflows/kpc-gis-hunter.yml/dispatches -f ref=main -f "inputs[areas]=$A" -f 'inputs[chunks]=2' -f 'inputs[chain]=0' || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
          fi
      - name: The map key or the layer list changed, so the GIS hunter starts one full pass (Brandon Oct 29 11:50 PM)
        id: kept_green_7
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=$(grep -o '^RUN=.*' /tmp/hunt.txt 2>/dev/null) || exit 0
          set -- $R; RUN=${1#RUN=}; THEN=${2#THEN=}; PASS=${3#PASS=}
          gh api -X POST repos/${{ github.repository }}/actions/workflows/kpc-gis-hunter.yml/dispatches -f ref=main -f "inputs[country]=$RUN" -f 'inputs[chunks]=5' -f 'inputs[chain]=4' -f "inputs[pass]=$PASS" -f "inputs[then]=$THEN" || echo "::error title=Next run::could not start the next run; the chain stops here (exit $?)"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
