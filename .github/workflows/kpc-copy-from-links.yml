name: KPC copy site data to KPC-Data (Step B3)
# Oct 27 (storage plan Stage 2, step B3; HQ 5:39 PM): copies the bot-rewritten data folders the pages fetch from KPC-Links to the
# SAME paths here (KPC.dataUrl tries /KPC-Data/<path> first). Runs once by hand, then daily, so these copies never go stale while
# the bots still write in KPC-Links. Step B5 (a bot moves here): take its folder OUT of the list below the same day.
# B5 (chat 5, Oct 27): data/leaders came off this list (its bot now writes here). LEFT OUT (HQ 5:41 PM: written more than once a day, so pages must keep reading the site's fresh copy): data/alerts (US closures 4x a day,
# EU alerts every 6 h). They come here the day their bot moves (B5). Only folders changed daily or less are copied.
# KPC-Links is read only. One commit per run, only when something changed. Never fails.
on:
  # Nov 2 review (G11): a watchdog restart passes as_schedule=<the missed cron>, so it runs exactly like that scheduled run.
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '40 10 * * *'   # G9 Nov 2: was '41 10 * * *' (spread the start times; now 1 min earlier)
    # Oct 29 (BOT C): a second look in the evening so a key rebuilt in the day reaches chat 11's sample the same night
    - cron: '40 1 * * *'   # G9 Nov 2: was '41 1 * * *' (spread the start times; now 1 min earlier)
    # Oct 30 (Brandon 11:01 AM, 'All 3'): every hour a quick look: only when a map key changed in KPC-Links does the copy run
    # (so chat 11's sample shows a new build within the hour); else the run ends in seconds
    - cron: '11 * * * *'   # PR3 (Nov 2): back to hourly, as Brandon asked Oct 30 (PR2 had made it every 3 h); a run with no new map key ends in seconds
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-copy-from-links
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      work: ${{ steps.g.outputs.work }}
      fp: ${{ steps.g.outputs.fp }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            data/us-key
            data/ca-key
            data/world-key
      - uses: actions/checkout@v5
        with:
          path: kpcdata
          sparse-checkout: |
            data/waiting/key-seen.txt
            .github/scripts/kpc_key_id.py
      - id: g
        run: |
          # Nov 2 review: a fingerprint that leaves out time stamps (kpc_key_id.py), so a rebuild that changed nothing is not new work
          F=$(python3 kpcdata/.github/scripts/kpc_key_id.py all links 2>/dev/null) || F=""
          [ -n "$F" ] || F=$(cat links/data/us-key/*.json links/data/ca-key/*.json links/data/world-key/*.json 2>/dev/null | sha1sum | cut -c1-16)
          O=$(cat kpcdata/data/waiting/key-seen.txt 2>/dev/null || echo none)
          echo "fp=$F" >> "$GITHUB_OUTPUT"
          H=$(date -u +%H:%M)
          if [ "${{ (inputs.as_schedule && 'schedule') || github.event_name }}" = schedule ] && [ "${{ (github.event.schedule || inputs.as_schedule) }}" = '11 * * * *' ] && [ "$F" = "$O" ]; then echo "work=0" >> "$GITHUB_OUTPUT"; echo "::notice title=Copy::no new key build: nothing to do"; else echo "work=1" >> "$GITHUB_OUTPUT"; fi
  copy:
    needs: gate
    if: ${{ needs.gate.outputs.work == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Copy (folders mirrored, single files copied)
        id: kept_green_1
        continue-on-error: true
        run: |
          # Oct 29 8:25 PM (Brandon 7:48 PM release GO, chat 11 RELEASE YES): the Rule G keys data/us-key + data/ca-key are back in
          # Oct 29 10:15 PM (chat 2): data/us-key HELD again until chat 11 passes the next rebuild's sample (the waiting-room hold for
          # the key bot is not wired yet); chat 2 puts it back after chat 11's YES
          DIRS="data/pota data/canada-bounds data/campfed data/campstate-manual data/nwr"   # Oct 30: data/campstate goes through the waiting room (below)
          FILES="data/northam.json data/canada.json data/parkinfo-web.json data/boundary-score.json data/boundary-report.json data/state-gis-found.json data/access-layers.json data/state-gis.json"
          # Nov 7 audit: data/pota/tiles.json is written HERE by kpc-tile-index.yml (07:46 UTC), not in KPC-Links, so --delete removed it at the
          # next copy (10:40 UTC) every day and the site found no index for the POTA tiles. Keep it out of the mirror.
          for d in $DIRS; do [ -d "links/$d" ] && mkdir -p "kpcdata/$d" && rsync -a --delete --exclude='/tiles.json' "links/$d/" "kpcdata/$d/"; done
          for f in $FILES; do [ -f "links/$f" ] && mkdir -p "kpcdata/$(dirname $f)" && cp "links/$f" "kpcdata/$f"; done
          # Oct 29 10:25 PM (chat 2 request, Brandon 10:21 PM 'map key bot isn't hooked into the waiting room yet'): the keys come over into
          # a working copy, then every CHANGED key file goes to data/waiting/in/ (checked: outlines lost, names vs POTA, retired parks,
          # PAD-US shape test) and the live key stays as it was; chat 11 approves (+ chat 2 rechecks) in data/waiting/approved.json, and
          # the waiting-room workflow mode release-approved puts it live. A Rule G change on purpose = a G5 stamp (big-change alarm only).
          # Oct 30 5:55 AM (Brandon: 'World boundaries ... a go', release after chat 11's check): the world key is held the same way
          for d in data/us-key data/ca-key data/world-key; do [ -d "links/$d" ] && mkdir -p "kpcdata/$d" && rsync -a "links/$d/" "kpcdata/$d/"; done
          # Oct 30 11:12 AM (HQ, Brandon 11:10 AM 'turn bot on'): US camping is shown again and refreshed weekly: the state camping bot's
          # files (KPC-Links data/campstate, every state but KY, Wednesdays) come over and every CHANGED file waits for chat 11 (Rule F checks)
          [ -d links/data/campstate ] && mkdir -p kpcdata/data/campstate && rsync -a links/data/campstate/ kpcdata/data/campstate/
          # Nov 2 (Brandon 7:11 AM, BUILD STAMP + FREEZE): a held key build chat 11 is grading (or has passed, not yet released) is never
          # replaced: that key's copy is put back and not diverted. A KEY NO frees the Canada / world copy (the next build fixes it);
          # a US KEY NO goes out per park first (kpc_release_approved.py), which empties the held folder.
          KD=$(cd kpcdata && python3 - <<'PY'
          import json, os
          ap = json.load(open('data/waiting/approved.json')) if os.path.exists('data/waiting/approved.json') else {}
          out = []
          # Nov 2 12:40 PM (HQ ruling on chat 2's stale Quebec copy): KEYS FLOW ONE WAY, KPC-Data -> website. The key bots BUILD in
          # KPC-Links, so only key FILES a build has CHANGED since the last copy come over (data/waiting/key-files-seen.json = the
          # hash of every KPC-Links key file at its last copy); an unchanged KPC-Links copy is an old mirror and never replaces
          # KPC-Data's file (it is put back here). First run: everything recorded, nothing copied.
          import hashlib, subprocess
          SP = 'data/waiting/key-files-seen.json'
          first = not os.path.exists(SP)
          seen = {} if first else json.load(open(SP))
          def back(rel):   # put KPC-Data's own file back (or remove a file KPC-Data does not have)
              if subprocess.run(['git', 'checkout', '-q', 'HEAD', '--', rel], capture_output=True).returncode:
                  try: os.remove(rel)
                  except OSError: pass
          newk, hashes = {}, {}
          for k in ('us-key', 'ca-key', 'world-key'):
              d = f'../links/data/{k}'
              for f in sorted(os.listdir(d)) if os.path.isdir(d) else []:
                  rel = f'data/{k}/{f}'
                  if not os.path.isfile('../links/' + rel): continue
                  h = hashes[rel] = hashlib.sha1(open('../links/' + rel, 'rb').read()).hexdigest()
                  if not first and f != 'index.json' and seen.get(rel) != h: newk.setdefault(k, []).append(f)
              if first: seen.update({r: h for r, h in hashes.items() if r.startswith(f'data/{k}/')})
          for k in ('us-key', 'ca-key', 'world-key'):
              n = newk.get(k, [])
              print(f'::notice title=Copy::{k}: {len(n)} key file(s) changed by a build since the last copy' + (f' ({" ".join(n[:12])})' if n else ': nothing comes over (keys flow KPC-Data -> website)'), flush=True)
              if not n: continue
              try: hb = json.load(open(f'data/waiting/in/data/{k}/index.json')).get('build')
              except Exception: hb = None
              v = [str(it.get('chat11') or '').upper() for it in (ap.get('items') or []) if isinstance(it, dict) and it.get('what') == k and str(it.get('build') or '') == str(hb)]
              # Nov 4 (data-03; per Brandon via Super Head Bot (relayed), 4:51 AM CST Nov 4: "In the new pr fix that issues so we no longer have that problem so once quality is done and we push problems solved and we on the new system"; what this step does
              # about it: the freeze no longer waits on chat 11): a held build that was
              # built on OTHER rules (no 'rules' hash in its stamp, or not KPC-Links' current one) or is older than KPC_FREEZE_MAX_DAYS
              # (3) is SUPERSEDED: the new build replaces it here. The decision is KPC-Links' own (kpc_key_freeze.not_blocking), so both
              # repos use one rule. Its held files are OVERWRITTEN by the new build's files (nothing is deleted); a held file the new
              # build does not have is named in a notice and listed in data/status/key-copy/dropped-<key>.json for a person.
              sup = ''
              try:
                  import sys as _s; _s.path.insert(0, '../links/.github/scripts'); import kpc_key_freeze as KF
                  if hb and hasattr(KF, 'not_blocking'): sup = KF.not_blocking(json.load(open(f'data/waiting/in/data/{k}/index.json')), k)
              except Exception as e: print(f'::warning title=Copy::{k}: the superseded test could not run ({str(e)[:120]}): the held build is kept', flush=True); sup = ''
              # Nov 8 (Brandon 1:50 PM CST, card t748s2719): a NEWER build with Quality's KEY YES (approved.json, what + build) replaces the
              # held one. Nothing of the old build goes live; it is logged in data/status/key-copy/replaced-<key>.json (kpc_key_supersede.py).
              if hb and not sup:
                  try:
                      import sys as _s2; _s2.path.insert(0, '.github/scripts'); import kpc_key_supersede as KS
                      nb0 = json.load(open(f'../links/data/{k}/index.json')).get('build')
                      sup = KS.reason(ap, k, hb, nb0)
                      if sup: KS.log_replaced(k, hb, nb0, sup)
                  except Exception as e: print(f'::warning title=Copy::{k}: the newer-YES test could not run ({str(e)[:120]}): the held build is kept', flush=True); sup = ''
              if hb and sup:
                  import shutil
                  stray = []
                  for f in sorted(os.listdir(f'data/waiting/in/data/{k}')):
                      if f == 'index.json': continue
                      if os.path.isfile(f'../links/data/{k}/{f}'): shutil.copy2(f'../links/data/{k}/{f}', f'data/waiting/in/data/{k}/{f}')
                      else: stray.append(f)
                  print(f'::notice title=Copy::{k}: held build {hb} is SUPERSEDED ({sup}): the new build replaces it in the waiting room (held files overwritten, nothing deleted)'
                        + (f'; held files the new build does not have (a person decides): {" ".join(stray[:20])}' if stray else ''), flush=True)
                  # FINAL-v2 (Quality should-fix): the old held files the new build DROPS are LISTED in a status report for a person
                  # (data/status/key-copy/dropped-<key>.json + .md, saved with the copy). They stay where they are: no deletion
                  # without Brandon's yes. Rewritten on every supersede (an empty list = the new build has every held file).
                  import time as _t
                  try: nb = json.load(open(f'../links/data/{k}/index.json')).get('build')
                  except Exception: nb = None
                  try: hs = json.load(open('data/waiting/held-since.json'))
                  except Exception: hs = {}
                  rows = [{'file': f'data/waiting/in/data/{k}/{f}', 'bytes': os.path.getsize(f'data/waiting/in/data/{k}/{f}'), 'held_since': (hs or {}).get(f'data/{k}/{f}')} for f in stray]
                  rep = {'about': f'{k}: old HELD files of build {hb} that the new build {nb} does not have. LISTED ONLY: they stay in data/waiting/in (no deletion without Brandon\'s yes); a person decides. Written by kpc-copy-from-links.yml (data-03).',
                         'key': k, 'old_build': hb, 'new_build': nb, 'superseded': sup, 'written': _t.strftime('%Y-%m-%d %H:%M UTC', _t.gmtime()), 'count': len(rows), 'files': rows}
                  os.makedirs('data/status/key-copy', exist_ok=True)
                  json.dump(rep, open(f'data/status/key-copy/dropped-{k}.json', 'w'), indent=1)
                  open(f'data/status/key-copy/dropped-{k}.md', 'w').write(f"# {k}: held files the new build drops\n\n{rep['about']}\n\nOld build {hb} -> new build {nb} ({sup}); {rep['written']}.\n\n"
                      + ('\n'.join(f"- {r['file']} ({r['bytes']} bytes; held since {r['held_since'] or 'unknown'})" for r in rows) or '- none: the new build has every held file') + '\n')
              if hb and not sup and not (v and k != 'us-key' and v[-1].lstrip('KEY ').startswith('NO')):
                  print(f'::notice title=Copy::{k} build {hb} is held for chat 11 / its release: not replaced (comes over once it is graded)', flush=True); continue
              d = f'../links/data/{k}'
              for f in os.listdir(d):
                  rel = f'data/{k}/{f}'
                  if f in n: seen[rel] = hashes[rel]
                  elif f != 'index.json': back(rel)   # unchanged = an old mirror: KPC-Data's own file stays
              out.append(f'data/{k}')
          json.dump(seen, open(SP, 'w'), indent=0, sort_keys=True)
          print('DIRS=' + ' '.join(out))
          PY
          )
          echo "$KD" | grep '^::' || true   # ok: a pipeline (its exit status is the last command; follow-up: pipefail)
          KDIRS=$(echo "$KD" | grep '^DIRS=' | cut -d= -f2-)
          for k in data/us-key data/ca-key data/world-key; do case " $KDIRS " in *" $k "*) ;; *) (cd kpcdata && git checkout -q HEAD -- "$k" 2>/dev/null; git clean -qfd -- "$k" 2>/dev/null) ;; esac; done
          # a key build made before the stamp existed gets an id from its content fingerprint (same build = same id every hour)
          # Nov 2 review (Mapping #7): the fingerprint is now THIS key's own (kpc_key_id.py one), not one sha1 over all three keys,
          # and it leaves out time stamps, so a Canada or world change no longer gives the US key a new id (and the other way round)
          for k in $KDIRS; do KID=$(python3 kpcdata/.github/scripts/kpc_key_id.py one links "${k#data/}" 2>/dev/null) || KID="${{ needs.gate.outputs.fp }}"
            python3 - "$k" "$KID" <<'PY' || { kpc_rc=$?; echo "::error title=inline Python::stopped with an error (exit $kpc_rc), see the log above"; echo "inline Python - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          import json, sys
          k, rid = sys.argv[1], sys.argv[2]
          p = f'kpcdata/{k}/index.json'
          try: d = json.load(open(p))
          except Exception: d = {}
          if not d.get('build'):
              d['build'] = {'data/us-key': 'US', 'data/ca-key': 'CA', 'data/world-key': 'W'}[k] + '-f' + rid[:10]   # same build content = same id
              json.dump(d, open(p, 'w'), indent=1, ensure_ascii=False)
              print(f'::notice title=Copy::{k} had no build id: stamped {d["build"]} on its way to the waiting room')
          PY
          done
          # Nov 6 improvements v2 item 3 (AU gap; Mapping's chat 5:28 PM CST Nov 5 "a count/stamp check in the copy step that fails closed"):
          # FIRST the world overrides 'no' takes the approved joins it names out (v2.1: AU-8945 vs record 805 Godwin Beach), THEN the layer
          # labels KPC-Data's own approved joins (kpc_key_approved.py) point at are put back into layers.json, before the waiting room
          # (KPC-Links' layers.json never has them); every changed world file waits for chat 11 like any key file
          (cd kpcdata && LINKS=../links python3 .github/scripts/kpc_key_reconcile.py merge-layers) || true   # ok: never fails; the check below fails closed
          case " $KDIRS " in *" data/world-key "*) ;; *) KDIRS="$KDIRS $(cd kpcdata && git status --porcelain -- data/world-key | awk '{print $2}' | tr '\n' ' ')" ;; esac
          (cd kpcdata && LINKS=../links python3 .github/scripts/kpc_waiting_room.py divert $KDIRS data/campstate) || { kpc_rc=$?; echo "::error title=kpc_waiting_room.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_room.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # ... and the copy is RECONCILED: under one build stamp KPC-Data's newest key copy must equal KPC-Links' except approved joins
          # with a drawable layer; otherwise that key's stamp is NOT copied (index.json put back) and the error is reported
          RC=$(cd kpcdata && LINKS=../links python3 .github/scripts/kpc_key_reconcile.py | tee /dev/stderr | grep '^FAILED=' | cut -d= -f2-) || true   # ok: FAILED= lists the keys
          for k in $RC; do (cd kpcdata && git checkout -q HEAD -- "data/$k/index.json" 2>/dev/null); echo "::error title=Key reconcile::$k: KPC-Data and KPC-Links differ under one stamp (data/status/key-copy/reconcile.md): stamp not copied"; echo "kpc_key_reconcile.py - $k failed closed: stamp not copied, see data/status/key-copy/reconcile.md" >> "$RUNNER_TEMP/kpc-hidden.txt"; done
          # Oct 29 11:45 PM (BOT C, plan KPC_Key_And_2fer_Automation_Plan.md): held build vs live key + chat 11's sample of 30
          (cd kpcdata && LINKS=../links python3 .github/scripts/kpc_key_summary.py) || { kpc_rc=$?; echo "::error title=kpc_key_summary.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_key_summary.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          # Oct 30 7:40 AM (chat 3 via HQ): the per-program park lists come from THIS copy of locations.json, so they never go stale
          [ -f links/locations.json ] && python3 kpcdata/.github/scripts/kpc_split_locations.py links/locations.json kpcdata || { kpc_rc=$?; echo "::error title=kpc_split_locations.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_split_locations.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          echo "::notice title=Step B3 copy::$(du -sh kpcdata/data | cut -f1) in kpcdata/data"
      - name: Save (once)
        id: kept_green_2
        continue-on-error: true
        run: |
          # the layer collector moved to kpc-collector.yml (Oct 30 10:45 AM: starts itself every 2 h when the Fable / atlas files have new work)
          (cd kpcdata && LINKS=../links python3 .github/scripts/kpc_hunter_trigger.py > /tmp/hunt.txt) || { kpc_rc=$?; echo "::error title=kpc_hunter_trigger.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_hunter_trigger.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; cat /tmp/hunt.txt || true   # ok: nothing to do is fine
          echo "${{ needs.gate.outputs.fp }}" > kpcdata/data/waiting/key-seen.txt   # the key build this copy carried (the hourly look compares with it)
          bash links/.github/scripts/kpc_push_data.sh kpcdata "Site data copied from KPC-Links (Step B3)" data locations-pota.json locations-sota.json locations-wwff.json
      - name: The picture-map branch (daily cleanup)
        id: kept_green_3
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: picture-maps
          path: pm
      - name: A park with an OFFICIAL outline now loses its picture map (HQ Oct 30 8:45 AM (2); house rule Oct 29 11:10 PM)
        id: kept_green_4
        continue-on-error: true
        run: |
          cd pm
          PIC_ROOT=. LINKS=../links python3 ../kpcdata/.github/scripts/kpc_lookup.py map-cleanup || { kpc_rc=$?; echo "::error title=kpc_lookup.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_lookup.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A; python3 ../kpcdata/.github/scripts/kpc_stamp_only.py   # Nov 3 (Brandon YES 5:29 PM): a cleanup that only moved a time stamp saves nothing
          git diff --cached --quiet && exit 0
          git commit -qm 'picture maps: daily cleanup (parks now with an official outline)'
          { saved=0; for i in 1 2 3; do git pull -q --rebase origin picture-maps && git push -q origin HEAD:picture-maps && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; }
          true
      - name: The look-up branch (the new-park pipeline files a page read there)
        id: kept_green_5
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: lookup
          path: lk
      - name: New parks with no outline -> one hunter areas-run + one look-up read (HQ Oct 30 7:40 AM (b); never posts)
        id: kept_green_6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd kpcdata && LINKS=../links LOOKUP_ROOT=../lk python3 .github/scripts/kpc_new_park_flow.py > /tmp/newp.txt) || { kpc_rc=$?; echo "::error title=kpc_new_park_flow.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_new_park_flow.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; cat /tmp/newp.txt || true   # ok: nothing to do is fine
          bash links/.github/scripts/kpc_push_data.sh kpcdata "new-park pipeline: handled list" data/gis-hunter/new-parks.json || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          (cd lk && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add requests && ! git diff --cached --quiet && git commit -qm 'new-park pipeline: page reads' && { saved=0; for i in 1 2 3; do git pull -q --rebase origin lookup && git push -q origin HEAD:lookup && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; }) || true   # ok: nothing new to commit; a lost save is reported by the loop itself
          A=$(grep -o '^AREAS=.*' /tmp/newp.txt | cut -d= -f2)
          if [ -n "$A" ] && ! grep -q '^RUN=' /tmp/hunt.txt 2>/dev/null; then   # a full pass already started covers them (two queued runs would cancel each other)
            # PAUSED Nov 4 (fix bundle; Brandon's yes relayed via Super Head Bot 4:53 PM CST; revert this one commit to resume): was: gh api -X POST repos/${{ github.repository }}/actions/workflows/kpc-gis-hunter.yml/dispatches -f ref=main -f "inputs[areas]=$A" -f 'inputs[chunks]=2' -f 'inputs[chain]=0' || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
            echo "::warning title=Paused bot::kpc-gis-hunter.yml is paused (Nov 4 fix bundle) - its next run was NOT started, start it by hand (workflow_dispatch) if it is needed"
          fi
      - name: The map key or the layer list changed, so the GIS hunter starts one full pass (Brandon Oct 29 11:50 PM)
        id: kept_green_7
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=$(grep -o '^RUN=.*' /tmp/hunt.txt 2>/dev/null) || exit 0
          set -- $R; RUN=${1#RUN=}; THEN=${2#THEN=}; PASS=${3#PASS=}
          # PAUSED Nov 4 (fix bundle; Brandon's yes relayed via Super Head Bot 4:53 PM CST; revert this one commit to resume): was: gh api -X POST repos/${{ github.repository }}/actions/workflows/kpc-gis-hunter.yml/dispatches -f ref=main -f "inputs[country]=$RUN" -f 'inputs[chunks]=5' -f 'inputs[chain]=4' -f "inputs[pass]=$PASS" -f "inputs[then]=$THEN" || echo "::error title=Next run::could not start the next run; the chain stops here (exit $?)"
          echo "::warning title=Paused bot::kpc-gis-hunter.yml is paused (Nov 4 fix bundle) - its next run was NOT started, start it by hand (workflow_dispatch) if it is needed"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
  # Nov 4 PM fix bundle item 3 (Brandon's yes relayed via Super Head Bot 4:53 PM CST): the 2-fer chain must start right after each
  # key copy. A scheduled run fires kpc-fers-chain.yml by workflow_run; a run a bot started (the watchdog's restart passes
  # as_schedule, other dispatches) fires none, so this job starts the chain itself. No new cron. The chain's plan skips areas it
  # already ran (data/status/fers-chain/seen.json), so a start with no new key build does nothing.
  chain:
    needs: copy
    if: ${{ needs.copy.result == 'success' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the 2-fer chain after this copy
        run: |
          if gh api -X POST "repos/${{ github.repository }}/actions/workflows/kpc-fers-chain.yml/dispatches" -f ref=main; then
            echo "::notice title=2-fer chain::started after this copy (${{ github.event_name }}${{ inputs.as_schedule && format(', as the missed {0} run', inputs.as_schedule) || '' }})"
          else
            echo "::error title=2-fer chain::could not start the 2-fer chain (exit $?); start kpc-fers-chain.yml by hand"
            echo "**Step B3:** the 2-fer chain could NOT be started after this copy; start kpc-fers-chain.yml by hand" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
