name: KPC discovery bot (hidden)
# Oct 27 (HQ: the Discovery Bot, Fable's design .claude/build/research/KPC_DiscoveryBot_Design_Fable.md in KPC-Links; replaces the
# portal scout). Asks the agencies' catalogs by keyword, tests new leads, ranks them -> data/discovery/leads.json + leads.md here.
# Never adds to live data, never emails, never fails. By hand only until the Ohio test passes; then monthly (the 1st).
on:
  workflow_dispatch:
    inputs:
      states:
        description: 'States / provinces (e.g. "OH", "UT", "CA-QC")'
        default: 'OH'
      steps:
        description: 'Steps: A (catalog search) B (test leads) C (Maps tab, browser) D (write the list)'
        default: 'A,B,C,D'
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '29 9 * * 3'   # Brandon Nov 1 1:20 PM 'set all them to run on their own': every Wednesday, 8 states / provinces in turn (all of them in 8 weeks)
permissions:
  contents: write
env:   # the inputs with their defaults: a timed run has no inputs (Nov 1, chat 10)
  I_STATES: ${{ inputs.states || '' }}
  I_STEPS: ${{ inputs.steps || 'A,B,C,D' }}
concurrency:
  group: kpc-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Tools + the last lead list
        continue-on-error: true
        run: |
          mkdir -p data/discovery && cp -r kpcdata/data/discovery/. data/discovery/ 2>/dev/null || true
          case "${{ env.I_STEPS }}" in *C*) pip install -q playwright && python3 -m playwright install --with-deps chromium >/dev/null 2>&1 || true;; esac
      - name: Discover
        continue-on-error: true
        timeout-minutes: 160
        env:
          STEPS: ${{ env.I_STEPS }}
        run: |
          S="${{ env.I_STATES }}"
          if [ -z "$S" ]; then   # timed run: 8 states / provinces in turn by week number, so all 64 are asked every 8 weeks
            S=$(python3 -c "import time; L='AL AK AZ AR CA CO CT DE DC FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY CA-AB CA-BC CA-MB CA-NB CA-NL CA-NS CA-NT CA-NU CA-ON CA-PE CA-QC CA-SK CA-YT'.split(); w=int(time.strftime('%W')) % 8; print(' '.join(L[w::8]))")
          fi
          echo "::notice title=Discovery bot::asking $S"
          STATES="$S" python3 .github/scripts/kpc_discovery.py || true
      - name: Save (once)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p kpcdata/data/discovery
          for f in data/discovery/*; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/discovery/; done
          cd kpcdata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "discovery bot ${{ env.I_STATES }} (hidden leads)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 9)); done
          true
