name: KPC waiting room (by hand; nightly release-approved)
# Oct 28 2026 night (chat 10, Opus): RULE SHEET F (KPC-Links .claude/notes/mapping.md). The checker that looks at every CHANGED
# data file before it goes live: kpc_waiting_room.py. NO SCHEDULE and no bot writes to data/waiting/in/ yet: Brandon's GO switches
# it on, bot by bot. Promotion also needs the repo variable WAITING_ON=1 (Settings -> Secrets and variables -> Actions -> Variables).
# Modes: replay (the replay test: real bad outputs from git history must all HOLD, good outputs must all PASS) · check (every file in
# data/waiting/in/) · undo (one file) · undo-bot (one bot, optionally one area) · release (a person approved a held file).
# Never goes red (EMAIL rule): every step continues on error; the only save is data/waiting + data/status.
# Nov 7 (round 4, item 1): the run's title says which cron started it, so the GPS packs workflow (workflow_run on this one) can
# follow the NIGHTLY release-approved run only, not the every-2-hours ones. The cron string must equal the nightly cron below.
run-name: "KPC waiting room (${{ github.event.schedule == '13 11 * * *' && 'nightly' || (github.event_name == 'schedule' && 'every 2 h') || inputs.mode || 'by hand' }})"
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '42 */2 * * *'   # PR3 (Nov 2): back to every 2 h, as Brandon asked Oct 31 (PR2 had made it every 4 h)   # Oct 31 1:15 AM (HQ, Brandon 'no rest for the bots'): release-approved every 2 hours too, so chat 11's YES goes live the same night   # G9 Nov 2: was '43 */2 * * *' (spread the start times; now 1 min earlier)
    - cron: '13 11 * * *'   # Oct 29 11:25 PM (chat 2 BOT D, Brandon 11:18 PM 'build it!'): nightly release-approved, after the 10:41 UTC daily copy
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      mode:
        description: 'replay | check | undo | undo-bot | release | release-areas | questions | release-approved'
        default: 'replay'
      target:
        description: 'undo / release: the live path (data/access/US-NY.json; undo: add @2 or @3 to go 2 or 3 copies back); undo-bot: the bot (access, campfed, docs, hours, truth, ...)'
        default: ''
      area:
        description: 'undo-bot only: one area (e.g. US-KY); blank = every area'
        default: ''
      areas:
        description: 'release-areas: space-separated areas to consider (e.g. CA-AB US-KY). Each is promoted on its own if Quality said RELEASE-READY: YES and it is no worse than live. A held area keeps its live data and does not block the others. Do not run this while a US 2-fer line is in progress on these files.'
        required: false
        default: ''
      grade:
        description: 'release-areas: path to a Quality verdicts.json (RELEASE-READY). Empty = data/status/quality/verdicts.json if present.'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-waiting-room
  cancel-in-progress: false
jobs:
  waiting:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
          fetch-depth: 0
      - name: KPC-Links (park outlines of the states, hand-checked campgrounds, retired parks, campground files; read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          fetch-depth: 0
          persist-credentials: false
      - name: Replay-test case files (branch replay-files; Nov 2 history restart)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: replay-files
          path: replay-files
      - name: Run the waiting room
        id: kept_green_1
        continue-on-error: true
        env:
          LINKS: ../links
          NET: '1'
          WAITING_ON: ${{ vars.WAITING_ON }}
        run: |
          cd kpcdata
          M="${{ inputs.mode || 'check' }}"
          case "$M" in
            replay) python3 .github/scripts/kpc_waiting_room.py replay ;;
            check) python3 .github/scripts/kpc_waiting_room.py check --promote ;;
            undo) python3 .github/scripts/kpc_waiting_room.py undo "${{ inputs.target }}" ;;
            undo-bot) python3 .github/scripts/kpc_waiting_room.py undo-bot "${{ inputs.target }}" "${{ inputs.area }}" ;;
            release) python3 .github/scripts/kpc_waiting_room.py release "${{ inputs.target }}" ;;
            questions) python3 .github/scripts/kpc_key_questions.py ;;
            release-approved|release-areas)
              echo "::notice title=Waiting room::$M is owner-dispatch only: it runs in the next step, never on a schedule and never inside continue-on-error"
              ;;
            *) echo "::notice title=Waiting room::unknown mode $M" ;;
          esac
      - name: Owner release (release-approved or release-areas)
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode == 'release-approved' || inputs.mode == 'release-areas') }}
        env:
          LINKS: ../links
          NET: '1'
          WAITING_ON: ${{ vars.WAITING_ON }}
          GITHUB_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          cd kpcdata
          # Quality D2 (Brandon, Nov 13 2026 7:48 AM CT): only his own login kpcwebhost may release; no repo-owner
          # fallback (the bots commit as KentuckyPortableClub) and the check reads triggering_actor, not actor.
          ACTOR="${{ github.triggering_actor }}"
          if [ "$ACTOR" != "kpcwebhost" ]; then
            echo "::error title=Release::${ACTOR:-no actor} is not kpcwebhost (the only release login). Nothing was released."
            exit 1
          fi
          M="${{ inputs.mode }}"
          case "$M" in
            release-approved) python3 .github/scripts/kpc_release_approved.py ;;
            release-areas) python3 .github/scripts/kpc_fers_release_areas.py --areas "${{ inputs.areas }}" --grade "${{ inputs.grade }}" ;;
            *) echo "::error title=Release::unknown mode $M"; exit 1 ;;
          esac
      - name: The look-up branch (AUTO-3 files save-map requests there)
        if: ${{ (github.event_name == 'schedule' || inputs.as_schedule) || inputs.mode == 'release-approved' }}
        id: kept_green_2
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: lookup
          path: lk
      - name: Work the bots do themselves (AUTO-1 recheck of SURE rows, AUTO-2 strong layers, AUTO-3 picture maps; Brandon Oct 30 6:17 AM)
        if: ${{ (github.event_name == 'schedule' || inputs.as_schedule) || inputs.mode == 'release-approved' }}
        id: kept_green_3
        continue-on-error: true
        env:
          LINKS: ../links
          LOOKUP_ROOT: ../lk
          PIC_INDEX: /tmp/pic-index.json
          GH_TOKEN: ${{ github.token }}
        run: |
          cd kpcdata
          git fetch -q origin picture-maps 2>/dev/null && git show FETCH_HEAD:index.json > /tmp/pic-index.json 2>/dev/null || true   # ok: optional git step; the next step reports
          python3 .github/scripts/kpc_auto_flow.py recheck layers maps || { kpc_rc=$?; echo "::error title=kpc_auto_flow.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_auto_flow.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          cd ../lk
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requests 2>/dev/null; git diff --cached --quiet && exit 0
          git commit -qm 'AUTO-3: save-map requests from the documents bot (nightly)'
          { saved=0; for i in 1 2 3; do git pull -q --rebase origin lookup && git push -q origin HEAD:lookup && { saved=1; break; }; sleep 5; done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; }
          gh workflow run kpc-lookup.yml -R ${{ github.repository }} --ref lookup || { kpc_rc=$?; echo "::error title=start the next run::could not start the next run (exit $kpc_rc); the chain stops here"; echo "start the next run - could not start the next run (exit $kpc_rc); the chain stops here" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # a bot push starts nothing by itself: start the look-up bot
          true
      - name: KEY DOCTOR after the build (report only; outside review Nov 2, Brandon OK 6:34 AM) -> data/status/key-doctor/ + the board
        # Nov 2 general review: every release run (the 2-hourly ones too), so a stuck YES / build-id trap shows within 2 h, not next morning
        if: ${{ (github.event_name == 'schedule' || inputs.as_schedule) || inputs.mode == 'release-approved' }}
        id: kept_green_4
        continue-on-error: true
        run: |
          cd kpcdata
          python3 .github/scripts/draft/tools/kpc_engine/kpc_engine.py doctor --links ../links --data . --out /tmp/kd > /tmp/kd.txt 2>&1 || { kpc_rc=$?; echo "::error title=kpc_engine.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_engine.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          grep '^::' /tmp/kd.txt || tail -5 /tmp/kd.txt
          mkdir -p data/status/key-doctor && rm -f data/status/key-doctor/stuck-*.md
          cp /tmp/kd/key-doctor/summary.json /tmp/kd/key-doctor/nos.json /tmp/kd/key-doctor/release.json /tmp/kd/key-doctor/stuck-*.md data/status/key-doctor/ 2>/dev/null || true   # ok: nothing to do is fine
          cp /tmp/kd/key-doctor/resources.json /tmp/kd/key-doctor/resources.md data/status/key-doctor/ 2>/dev/null || true   # ok: an optional file or tidy step (engine v0.5.1+ (report only))
          S=$(grep -h 'title=Key doctor' /tmp/kd.txt | sed 's/^::[a-z]* title=Key doctor \([^:]*\)::/\1: /' | tr '\n' ' ' | cut -c1-400)
          C=green; grep -q '^::error title=Key doctor' /tmp/kd.txt && C=amber
          python3 .github/scripts/kpc_status.py board key-doctor $C "${S:-no result}" "chat 10 (came-back NOs / stuck areas); per-park release in release-approved" || true   # ok: a status-board line (reporting only)
      - name: Intake files for the chats (questions for chat 2 / 11, hours-fees saved only; HQ Oct 31 7:55 PM)
        id: kept_green_5
        continue-on-error: true
        run: cd kpcdata && python3 .github/scripts/kpc_intake_reader.py questions && python3 .github/scripts/kpc_intake_reader.py hours || { kpc_rc=$?; echo "::error title=kpc_intake_reader.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_intake_reader.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: The week's numbers + the control panel's data (data/status/week-review.md, panel.json; Brandon Oct 30 11:01 AM)
        id: kept_green_6
        continue-on-error: true
        env:
          LINKS: ../links
        run: cd kpcdata && python3 .github/scripts/kpc_week_numbers.py || { kpc_rc=$?; echo "::error title=kpc_week_numbers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_week_numbers.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: The morning list for chat 11 (data/waiting/today.md; Brandon Oct 29 11:50 PM)
        id: kept_green_7
        continue-on-error: true
        run: cd kpcdata && python3 .github/scripts/kpc_waiting_today.py || { kpc_rc=$?; echo "::error title=kpc_waiting_today.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_waiting_today.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save (data/waiting + data/status, plus the live files an undo / release / promotion changed)
        id: kept_green_8
        continue-on-error: true
        run: |
          cd kpcdata
          D="data/waiting data/status"
          if [ "${{ inputs.mode || 'check' }}" != replay ]; then D="data"; fi
          # Nov 12 (KPC owner, 2026-11-11; Quality's #72 follow-up): STRICT=1 as in kpc-fers.yml, so a push that did not land exits 1 and
          # this step goes red (its outcome is failure, so the 2-fer rerun below never starts). Without it the script only printed a notice.
          STRICT=1 bash ../links/.github/scripts/kpc_push_data.sh . "waiting room: ${{ inputs.mode || 'check (nightly)' }} ${{ inputs.target }}" $D || { kpc_rc=$?; echo "::error title=Save::a save or push failed; this run is NOT saved, the next run tries again (exit $kpc_rc)"; echo "Save - a save or push failed; this run is NOT saved, the next run tries again (exit $kpc_rc)" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit 1; }
      - name: A key went live -> the 2-fers rerun for those states (chat 2 BOT E reads data/waiting/released-key.json)
        # Nov 12 (a cancelled world key run still committed, KPC-Links): was if: always(), so a CANCELLED run, or a run whose Save never
        # reached main, still started kpc-fers-pending (force=yes) for a key that was not live. Now: never on a cancel, only after Save
        # finished, and only when main really holds this run's released-key.json. Kept on purpose: an earlier kept-green step that
        # failed (look-up branch, key doctor, intake, week numbers, morning list) does not stop it once the release itself is saved.
        if: ${{ !cancelled() && steps.kept_green_8.outcome == 'success' }}
        id: kept_green_9
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/kpc-key-released ] || exit 0
          # Save runs with STRICT=1 (Nov 12), so a save that did not land makes it red and skips this step; main is still checked here as a
          # second lock: no saved release = no 2-fer rerun
          if ! { git -C kpcdata fetch -q origin main && git -C kpcdata diff --quiet FETCH_HEAD -- data/waiting/released-key.json; }; then
            echo "::error title=Waiting room::the key release for $(cat /tmp/kpc-key-released) is not on main (the save did not land): no 2-fer rerun started; the next run releases it again and starts it"
            echo "Waiting room - the key release is not on main: no 2-fer rerun started" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"
            exit 0
          fi
          gh api -X POST repos/${{ github.repository }}/actions/workflows/kpc-fers-pending.yml/dispatches -f ref=main -f 'inputs[force]=yes' || { kpc_rc=$?; echo "::error title=start the next run::could not start the next run (exit $kpc_rc); the chain stops here"; echo "start the next run - could not start the next run (exit $kpc_rc); the chain stops here" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          echo "::notice title=Waiting room::2-fer rerun started for $(cat /tmp/kpc-key-released)"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
