name: KPC sharpen (T7 national trail lines / T8 Canada outlines) - review outputs on tools-out
# Oct 31 2026 (chat 10; Brandon 8:13 PM 'any bot that needs testing test it'): the outside coder's two sharpening tools, run live.
# Outputs on KPC-Data branch tools-out (sharpen/trails, sharpen/canada; BRANCH FIRST): nothing replaces a live line or outline
# until chat 2 compares them and Brandon says where the files live. Chains on exit 3. Never red.
on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'trails or canada'
        default: 'trails'
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-sharpen-${{ inputs.tool }}
  cancel-in-progress: false
# PR2 (Nov 2): a push to tools-out that loses a race with another bot pulls --rebase and tries again (5 tries; no force).
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            data/state-gis.json
            data/ca-key
            data/canada-bounds
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: kpcdata/.sharpen_cache
          key: kpc-sharpen-${{ inputs.tool }}-${{ github.run_id }}
          restore-keys: kpc-sharpen-${{ inputs.tool }}-
      - name: Side branch
        id: kept_green_1
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin tools-out:tools-out && git worktree add -q ../out tools-out || true   # ok: optional git step; the next step reports
      - name: Run
        id: r
        continue-on-error: true
        run: |
          cd kpcdata
          D=.github/scripts/draft/tools
          set +e
          if [ "${{ inputs.tool }}" = trails ]; then
            pip install -q -r $D/kpc_trail_lines/requirements.txt
            python $D/kpc_trail_lines/kpc_trail_lines.py --selftest | tail -1
            SG=../links/data/state-gis.json; [ -f $SG ] || SG=data/state-gis.json
            python $D/kpc_trail_lines/kpc_trail_lines.py --trails $D/kpc_trail_lines/trails_list.json --state-gis $SG --out ../out/sharpen/trails --max-minutes 50 --resume --cache .sharpen_cache --acceptance 2>&1 | tail -25
            E=${PIPESTATUS[0]}
          else
            pip install -q -r $D/kpc_ca_sharpen/requirements.txt
            python $D/kpc_ca_sharpen/kpc_ca_sharpen.py --selftest | tail -1
            B=../links/data/canada-bounds; [ -d $B ] || B=data/canada-bounds
            [ -f ../out/sharpen/canada/parks.json ] || python $D/kpc_ca_sharpen/kpc_ca_sharpen.py --make-list --bounds $B --key ../links/data/ca-key --out ../out/sharpen/canada
            python $D/kpc_ca_sharpen/kpc_ca_sharpen.py --parks ../out/sharpen/canada/parks.json --out ../out/sharpen/canada --max-minutes 50 --resume --cache .sharpen_cache --cap-points 0 2>&1 | tail -25
            E=${PIPESTATUS[0]}
          fi
          echo "::notice title=Sharpen ${{ inputs.tool }}::exit $E ($( [ "$E" = 3 ] && echo 'time ran out: the next run continues' || echo done ))"
          [ "$E" = 3 ] && echo "more=yes" >> $GITHUB_OUTPUT
          cd ../out && rm -rf sharpen/*/work && git add -A sharpen && git commit -qm "sharpen ${{ inputs.tool }} (run ${{ github.run_id }})" && (for i in 1 2 3 4 5; do git push -q origin tools-out && exit 0; git pull -q --rebase origin tools-out || git rebase --abort 2>/dev/null; sleep $((i*7)); done; exit 1) || echo "::error title=git push::a push failed (exit $?); this run is NOT saved"
          true
      - name: Next run
        if: steps.r.outputs.more == 'yes'
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR2 (fewer runs, Nov 2): CHAIN BRAKE. A self-starting chain stops for the day after 12 runs in 24 h (Nov 2: the hard look
          # reader chained 187 times and the WDPA phone book 178 times in one day, each one a commit and a site rebuild). The next
          # scheduled run picks the work up again. Raise the number here if a backlog really needs more.
          kpc_brake() { n=$(gh api "repos/${{ github.repository }}/actions/workflows/kpc-sharpen.yml/runs?created=>=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=1" --jq .total_count 2>/dev/null || echo 0); if [ "${n:-0}" -ge 12 ]; then echo "::notice title=Chain brake::kpc-sharpen.yml ran $n times in 24 h (limit 12): no next run now; the next scheduled run goes on"; return 1; fi; return 0; }
          kpc_brake || exit 0
          gh workflow run kpc-sharpen.yml -R ${{ github.repository }} --ref main -f tool=${{ inputs.tool }} || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
