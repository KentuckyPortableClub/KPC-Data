name: KPC hand-off gate (by hand)
# 19 Nov 2026 (Opus; key-quality.md section 19 items 39 + 41 + 42): THE GATE RUNS ON GITHUB, never in a chat. tests/HANDOFF-GATE.md:
# the full suite (.github/scripts/kpc_full_suite.py: every tests/test_*.py + every --selftest) on main AND on the branch to merge,
# with KPC-Links main checked out beside it (LINKS) and every library the tests import installed. Main's own failures today are
# the baseline, so GATE PASS = the branch adds no failure main does not already have. Python 3.12 and 3.13 (hand-off 06 part 2).
# Never red: the verdict is the notice line and the report artifact. Reads only; writes nothing, pushes nothing, no secrets.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'the branch or commit to gate (the top of a stack, e.g. prep/park-pages-part5-review)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: kpc-handoff-gate
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          path: branch
          fetch-depth: 50
      - uses: actions/checkout@v5
        with:
          ref: main
          path: main
          fetch-depth: 50
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          ref: main
          path: links
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Libraries the tests import
        run: |
          set +e
          python -m pip install -q shapely pyproj numpy scipy scikit-learn opencv-python-headless rapidfuzz requests pyyaml \
            beautifulsoup4 lxml pypdf pypdfium2 pillow openpyxl owslib pyshp geopandas pyogrio h3 playwright pytest > "$RUNNER_TEMP/pip.txt" 2>&1
          echo "pip exit $?" >> "$RUNNER_TEMP/pip.txt"
          tail -3 "$RUNNER_TEMP/pip.txt"
          exit 0
      - name: Full suite on main, then on the branch (main's failures are the baseline)
        run: |
          set +e
          R="$RUNNER_TEMP/gate"; mkdir -p "$R"
          for d in branch main; do git -C "$d" fetch -q --depth 50 origin "+refs/heads/main:refs/remotes/origin/main"; done
          export LINKS="$GITHUB_WORKSPACE/links"
          ( cd main && DATA="$PWD" python .github/scripts/kpc_full_suite.py --label "main (Python ${{ matrix.python }})" --report "$R/main.txt" > /dev/null 2>&1 )
          {
            echo "# Failures of KPC-Data main $(git -C main rev-parse --short=12 HEAD) today, Python ${{ matrix.python }}, made by the gate run ${{ github.run_id }}"
            grep -E '^FAIL' "$R/main.txt" | sed -E 's/^FAIL( \(known on main\)| NEW)? +//; s/  \([0-9.]+s\)$//'
          } > "$R/baseline-main-today.txt"
          ( cd branch && DATA="$PWD" python .github/scripts/kpc_full_suite.py --baseline "$R/baseline-main-today.txt" --label "${{ inputs.ref }} (Python ${{ matrix.python }})" --report "$R/branch.txt" > /dev/null 2>&1 )
          rc=$?
          git -C branch status --porcelain > "$R/branch-left-changed.txt"
          main_line=$(grep -E '^TOTAL' "$R/main.txt" | tail -1)
          br_line=$(grep -E '^TOTAL' "$R/branch.txt" | tail -1)
          verdict=$([ "$rc" = 0 ] && echo 'GATE PASS' || echo 'GATE FAIL')
          [ -z "$br_line" ] && verdict='GATE NOT RUN (the suite did not finish on the branch)'
          echo "::notice title=Gate ${{ matrix.python }}::${verdict} for ${{ inputs.ref }} ($(git -C branch rev-parse --short=12 HEAD)). Branch: ${br_line:-no total}. Main: ${main_line:-no total}"
          grep -E '^FAIL NEW' "$R/branch.txt" | head -20 | while IFS= read -r l; do echo "::warning title=New failure ${{ matrix.python }}::$l"; done
          { echo "### Hand-off gate, Python ${{ matrix.python }}: ${verdict}"; echo; echo "- branch \`${{ inputs.ref }}\`: ${br_line}"; echo "- main: ${main_line}"; echo; echo '```'; grep -E '^FAIL NEW' -A3 "$R/branch.txt" | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-gate-${{ matrix.python }}-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/gate/
            ${{ runner.temp }}/pip.txt
