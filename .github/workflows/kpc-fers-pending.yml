name: KPC 2-fer small batches (hidden)
# Oct 28 2026 (HQ 2:58 PM, Brandon): parks with a new or changed outline wait in data/fers/pending.json (+ the US key's
# data/us-key/changed-parks.json in KPC-Links). Daily look: when 5+ parks wait, or on Sunday when any wait, each area that has
# waiting parks gets ONE line run with 'parks' = only the pairs touching them (minutes, from the saved copies), 3 areas at most
# at once; never while the full queue (kpc-fers-lines) is running. Its checker writes a 'grade me' line for chat 8 as usual.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '23 10 * * *'
  # Oct 29 11:30 PM: after a key release the waiting room (chat 10, BOT D) dispatches this workflow itself (force=yes)
  workflow_dispatch:
    inputs:
      force:
        description: 'yes = run now whatever the count (by hand)'
        default: ''
permissions:
  contents: write
  actions: write
concurrency:   # PR2 (Nov 2): one run of this bot at a time; a second start waits instead of piling up
  group: kpc-fers-pending
  cancel-in-progress: false
jobs:
  look:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
      - name: Waiting parks -> one small batch per area
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ -n "$(gh run list -R ${{ github.repository }} --workflow kpc-fers-lines.yml --status in_progress --json databaseId --jq '.[].databaseId' 2>/dev/null)" ]; then echo "::notice title=2-fer small batches::the full queue is running: nothing started"; exit 0; fi
          python3 - <<'PY'
          import json, os, subprocess, time
          P = json.load(open('data/fers/pending.json'))
          # Oct 29 11:40 PM (BOT E): parks whose LIVE outline changed = the released key here (data/us-key, data/ca-key) vs what this
          # bot saw last time (data/fers/key-seen.json: ref -> its joined piece ids). A held build that chat 11 rejects never shows here.
          # Only states already rerun on the new key (data/fers/new-key-states.json) rerun by themselves; the rest wait their wave.
          import glob, hashlib
          SEEN = 'data/fers/key-seen.json'
          try: seen = json.load(open(SEEN))
          except Exception: seen = {}
          try: newkey = set(json.load(open('data/fers/new-key-states.json')).get('states') or [])
          except Exception: newkey = set()
          now, key_changed = {}, False
          for f in sorted(glob.glob('data/us-key/US-??.json') + glob.glob('data/ca-key/CA-??.json')):
              area = os.path.basename(f)[:-5]
              try: parks = json.load(open(f)).get('parks') or {}
              except Exception: continue
              for r, p in parks.items():
                  h = hashlib.md5(','.join(sorted(str(x[0]) for x in p.get('m') or [])).encode()).hexdigest()[:10]
                  now[f'{area}:{r}'] = h
                  if seen and seen.get(f'{area}:{r}') != h and area in newkey:
                      P['parks'].append({'ref': r, 'area': area, 'why': 'live outline changed (key release)', 'date': time.strftime('%Y-%m-%d')}); key_changed = True
          json.dump(now, open(SEEN, 'w'), separators=(',', ':'))
          if not seen: print('::notice title=2-fer small batches::first look at the live key: remembered, nothing started for it')
          wait = P['parks']; sunday = time.gmtime().tm_wday == 6
          if not wait or not (len(wait) >= 5 or sunday or key_changed or os.environ.get('FORCE') == 'yes'):
              print(f'::notice title=2-fer small batches::{len(wait)} park(s) waiting: nothing to run today'); json.dump(P, open('data/fers/pending.json', 'w'), indent=1); raise SystemExit
          R = {'southeast': 'US-TN US-NC US-VA US-WV US-GA US-AL US-SC US-FL US-MS', 'midwest': 'US-IN US-IL US-MO US-WI US-MN US-IA US-ND US-SD',
               'northeast': 'US-PA US-NY US-NJ US-CT US-RI US-MA US-VT US-NH US-ME US-MD US-DE US-DC', 'southcentral': 'US-AR US-LA US-OK US-TX US-KS US-NE',
               'mountain': 'US-CO US-WY US-ID US-MT US-NV US-AZ US-NM', 'pacific': 'US-CA US-OR US-WA US-AK US-HI',
               'canadaeast': 'CA-ON CA-QC CA-NB CA-NS CA-PE CA-NL', 'canadawest': 'CA-MB CA-SK CA-AB CA-BC CA-YT CA-NT CA-NU'}
          OWN = {'US-KY': ('US-KY', 'ky'), 'US-OH': ('US-OH', 'oh'), 'US-MI': ('US-MI', 'mi'), 'US-UT': ('US-UT', 'ut')}
          def area_of(ref):
              st = None
              try:
                  for f in os.listdir('links/data/parkinfo'):
                      if f.startswith(('US-', 'CA')) and f.endswith('.json') and f != 'index.json':
                          d = json.load(open('links/data/parkinfo/' + f)).get('parks') or {}
                          if ref in d: st = f[:-5] if f.startswith('US-') else 'CA-' + (d[ref][10] if len(d[ref]) > 10 else ''); break
              except Exception: pass
              if not st: return None
              if st in OWN: return OWN[st]
              for tag, sts in R.items():
                  if st in sts.split(): return (sts, tag)
              return None
          by = {}
          for x in wait:
              # BOT E: a key-release park reruns its OWN state as one area (1/3-size areas, HQ Oct 29 3:11 PM), tag = state letters
              a = (x['area'], x['area'].lower().replace('us-', '').replace('-', '')) if x.get('area') else area_of(x['ref'])
              if a: by.setdefault(a, []).append(x)
          # Nov 2 (Brandon 7:01 AM 'Yes, tired of going in circles'; outside review): KEYS FIRST. An area whose state still has a NEW key
          # file waiting for chat 11 (data/waiting/in/data/us-key|ca-key/<st>.json) is not run: its 2-fers would be measured on outlines
          # that may still change. It stays waiting; the release of that key starts this workflow again (BOT D).
          def _held_key(sts):
              return [s for s in sts.split() if os.path.exists(f"data/waiting/in/data/{'ca' if s.startswith('CA-') else 'us'}-key/{s}.json")]
          _skip = {a: _held_key(a[0]) for a in by if _held_key(a[0])}
          if _skip: print('::notice title=2-fer small batches::keys first: waiting for the key of ' + ', '.join(sorted({s for v in _skip.values() for s in v})))
          by = {a: xs for a, xs in by.items() if a not in _skip}
          # Nov 2 bot fixes (Mapping #1, Quality 2a): THE MAP-AUDIT GATE. 2-fers start over area by area only when the gate
          # (kpc_fers_gate.py -> data/status/fers-ready.json) says 'ready for 2-fers' for EVERY state of the batch. This bot started
          # batches without asking it. A batch that is not ready stays waiting here; nothing is dropped.
          try: _ready = {a for a, v in ((json.load(open('data/status/fers-ready.json')).get('areas')) or {}).items() if str(v.get('status') or '').startswith('ready for 2-fers')}
          except Exception: _ready = set()
          _gate = {a: [s for s in a[0].split() if s not in _ready] for a in by}
          _gate = {a: v for a, v in _gate.items() if v}
          if _gate: print('::notice title=2-fer small batches::map-audit gate: not ready yet, kept waiting: ' + ', '.join(sorted({s for v in _gate.values() for s in v})))
          by = {a: xs for a, xs in by.items() if a not in _gate}
          started = 0
          for (sts, tag), xs in sorted(by.items(), key=lambda kv: -len(kv[1]))[:3]:
              refs = ' '.join(sorted({x['ref'] for x in xs}))
              ok = subprocess.run(['gh', 'workflow', 'run', 'kpc-fers-line.yml', '-R', os.environ['GITHUB_REPOSITORY'], '-f', f'states={sts}', '-f', f'tag={tag}', '-f', 'stage=all', '-f', f'parks={refs}']).returncode == 0
              if ok:
                  started += 1; P['done'] += [dict(x, run=time.strftime('%Y-%m-%d')) for x in xs]; P['parks'] = [y for y in P['parks'] if y not in xs]
                  print(f'::notice title=2-fer small batches::{tag}: started for {refs}')
          P['done'] = P['done'][-500:]
          json.dump(P, open('data/fers/pending.json', 'w'), indent=1)
          PY
          # BOT F (Oct 29 11:30 PM; plan KPC_Key_And_2fer_Automation_Plan.md): a state chat 3 / 8 marked DONE in KPC-Links
          # .claude/build/research/fable-state-done.json gets its FIRST new-key 2-fer run (whole state), then joins new-key-states.json
          # (BOT E reruns it from then on). At most 3 states a run, fewest parks first; AK held (file-size fix), KY never (own key).
          python3 - <<'PY' || { kpc_rc=$?; echo "::error title=inline Python::stopped with an error (exit $kpc_rc), see the log above"; echo "inline Python - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          import json, os, subprocess
          # Nov 2 bot fixes (Mapping #1, Quality 2a): BOT F IS PAUSED. It starts whole-state 2-fer runs from the Fable 'DONE' lines and
          # never asked the map-audit gate. The gate (kpc_fers_gate.py, run by the map audit and the watchdog) now starts every
          # first run. To bring BOT F back it must first check data/status/fers-ready.json like the batch step above.
          print('::notice title=2-fer first runs (BOT F)::paused (Nov 2 bot fixes): the map-audit gate starts first runs now')
          raise SystemExit(0)
          try: done = json.load(open('links/.claude/build/research/fable-state-done.json'))
          except Exception: done = {}
          # HQ Oct 30 6:55 AM: also read the Fable file's own 'STATE XX DONE' lines (chats 3 / 8 write them there): no hand step
          import re
          try:
              # Oct 30 7:40 AM (HQ): the Fable book is one file per state now (fable/US-XX.md); its 'STATE XX DONE' line sits at the END
              # the combined book too (chats 3 / 8 still write 'STATE XX DONE' lines there, Oct 30 morning)
              for m_ in re.finditer(r'STATE\s+(?:US-)?([A-Z]{2})\s+DONE', open('links/.claude/build/research/KPC_MissingBoundaries_ForFable_desk.md', encoding='utf-8').read()):
                  if m_.group(1) != 'XX': done.setdefault('US-' + m_.group(1), {'by': 'Fable book line'})
              import glob as _g
              for fp in _g.glob('links/.claude/build/research/fable/US-??.md'):
                  st_ = os.path.basename(fp)[:5]
                  tail = open(fp, encoding='utf-8').read()[-3000:]
                  if re.search(r'STATE\s+(?:US-)?' + st_[3:] + r'\s+DONE', tail): done.setdefault(st_, {'by': 'fable/' + st_ + '.md'})
          except Exception: pass
          NK = 'data/fers/new-key-states.json'
          nk = json.load(open(NK)); have = set(nk.get('states') or [])
          HOLD = {'US-AK', 'US-KY'}
          todo = [s for s in done if s.startswith('US-') and len(s) == 5 and s not in have and s not in HOLD]
          def size(st):
              try: return len((json.load(open(f'data/parkinfo/{st}.json')).get('parks') or {}))
              except Exception: return 9999
          started = []
          for st in sorted(todo, key=size)[:3]:
              ok = subprocess.run(['gh', 'workflow', 'run', 'kpc-fers-line.yml', '-R', os.environ['GITHUB_REPOSITORY'], '-f', f'states={st}', '-f', f'tag={st[3:].lower()}', '-f', 'stage=all']).returncode == 0
              if ok: started.append(st); nk['states'] = sorted(set(nk['states']) | {st})
          json.dump(nk, open(NK, 'w'), indent=1)
          print(f"::notice title=2-fer first runs (BOT F)::{'started: ' + ' '.join(started) if started else 'no newly finished state'}" + (f"; waiting: {' '.join(sorted(set(todo) - set(started)))}" if set(todo) - set(started) else ''))
          PY
          git config user.name kpc-bot; git config user.email bot@kpc.local
          git add data/fers/pending.json data/fers/key-seen.json data/fers/new-key-states.json && git commit -qm "2-fer small batches: waiting list" || true   # ok: nothing to commit is fine
          git pull -q --rebase || { kpc_rc=$?; echo "::warning title=git fetch::git could not fetch or merge the newest main (exit $kpc_rc)"; echo "git fetch - git could not fetch or merge the newest main (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; git push -q || { kpc_rc=$?; echo "::error title=git push::a push failed (exit $kpc_rc); this run is NOT saved"; echo "git push - a push failed (exit $kpc_rc); this run is NOT saved" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8; Nov 4 PM fix bundle item 7)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
