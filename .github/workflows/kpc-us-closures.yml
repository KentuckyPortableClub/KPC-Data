name: KPC US park closures (state agencies)
# OFF since Oct 29 (Brandon's SCOPE: no closures outside Kentucky): timer removed, by hand only (the script also stops unless FORCE_RUN=1).
# Moved here from KPC-Links Oct 27 (storage plan Stage 2, step B5; chat 5; the closure watcher itself is chat 2's).
# Reads the state agencies' own closure feeds and ties them to POTA parks -> data/alerts/us-parks.json (pages read it here).
# KPC-Links keeps a small merge job (its kpc-us-closures.yml, 30 min later) that copies these 'uc-' items into its
# kpc-conditions.json, the small file the park cards need. Posts nothing. Every 6 hours + by hand. Never fails. No secrets.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-us-closures
  cancel-in-progress: false
jobs:
  closures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the scripts (KPC-Links, read-only; public, no token)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data) and lay its fresh data on top
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B; stops red on empty input)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Fresh data first
        run: |
          rsync -a kpcdata/data/ data/ 2>/dev/null || true   # ok: nothing to do is fine
          cp kpcdata/locations.json kpcdata/locations-ky.json . 2>/dev/null || true   # ok: nothing to do is fine
      - name: Read the closure feeds
        id: kept_green_1
        continue-on-error: true
        timeout-minutes: 20
        run: python3 .github/scripts/kpc_us_closures.py || echo "::error title=kpc_us_closures.py::stopped with an error (exit $?), see the log above"
      - name: Save (once, only real changes)
        id: kept_green_2
        continue-on-error: true
        run: |
          [ -s data/alerts/us-parks.json ] || exit 0
          mkdir -p kpcdata/data/alerts kpcdata/data/status
          cp data/alerts/us-parks.json kpcdata/data/alerts/us-parks.json
          cp data/status/kpc_us_closures.json kpcdata/data/status/ 2>/dev/null || true   # ok: nothing to do is fine
          cd kpcdata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ../.github/scripts/kpc_save_filter.py data/alerts/us-parks.json data/status/kpc_us_closures.json || echo "::error title=kpc_save_filter.py::stopped with an error (exit $?), see the log above"
          git add data/alerts/us-parks.json data/status/kpc_us_closures.json 2>/dev/null || git add data/alerts/us-parks.json
          git diff --cached --quiet && exit 0
          git commit -qm 'US park closures'
          { for i in 1 2 3 4; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*10)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }; exit 0
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
