name: KPC map audit (every saved outline graded, worst first) - outputs on tools-out audit/
# World: the 5 countries with saved shapes (world-bounds) from those, every other key country read live from its key (HQ: all 28+).
# Nov 2 2026 (chat 10; HQ 10:35 AM, Brandon: '28 of 30 = probably a ton of parks mismatched worldwide'). KPC_10_map_audit (outside
# coder, draft/tools) grades every saved outline: pin inside / near / far, size vs official acres, name, kind, spill onto another
# park, broken shapes. Decides nothing. US first, then Canada, then the world; 50-min jobs that chain until every area is done;
# then weekly (Sunday after the key builds). Output: tools-out audit/ (worst.csv, summary.md, questions.json), latest run only.
# Never red.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '43 13 * * 0'   # weekly, Sunday 7:43 AM CST, after the night's key builds
  workflow_dispatch:
    inputs:
      fresh:
        description: 'yes = start every area over (clears the last audit on tools-out)'
        default: 'no'
      areas:
        description: 'blank = every area (US, then Canada, then the world); or a list like "US-TN CA-ON CH"'
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-map-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            /data/ky-answer-key.json
            /ky-*.geojson
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: kpcdata/.audit_cache
          key: kpc-map-audit-${{ github.run_id }}
          restore-keys: kpc-map-audit-
      - name: Audit
        id: r
        continue-on-error: true
        env:
          KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
          FRESH: ${{ inputs.fresh }}
          AREAS: ${{ inputs.areas }}
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git worktree add -q -B tools-out ../out origin/tools-out
          mkdir -p ../club ../kyo
          for d in us-key ca-key canada-bounds fers trails parkinfo world-bounds world-key; do [ -e data/$d ] && ln -s "$PWD/data/$d" ../club/$d; done
          cp ../links/data/ky-answer-key.json ../club/ 2>/dev/null || true   # ok: Kentucky is skipped without it
          cp ../links/ky-*.geojson ../kyo/ 2>/dev/null || true   # ok: Kentucky outlines come from the answer key too
          [ "$FRESH" = yes ] && rm -rf ../out/audit
          mkdir -p ../out/audit
          if [ -z "$AREAS" ]; then
            AREAS="US-KY $(ls data/parkinfo/US-*.json | xargs -n1 basename | sed 's/.json//' | grep -v US-KY | tr '\n' ' ') $(ls data/ca-key/CA-??.json 2>/dev/null | xargs -n1 basename | sed 's/.json//' | tr '\n' ' ') $(ls data/world-key/*.json | xargs -n1 basename | sed 's/.json//' | grep -E '^[A-Z0-9]{1,3}$' | tr '\n' ' ')"
          fi
          AC=""; [ -f ../out/acres/acres-list.json ] && AC="--acres ../out/acres/acres-list.json"
          pip install -q -r .github/scripts/draft/tools/KPC_10_map_audit/requirements.txt 2>&1 | tail -1
          set +e
          python3 .github/scripts/draft/tools/KPC_10_map_audit/kpc_map_audit.py --areas $AREAS --data ../club --ky-outlines ../kyo $AC --out ../out/audit --cache .audit_cache --max-minutes 50 --resume > ../out/audit/run-log.txt 2>&1
          E=$?
          tail -8 ../out/audit/run-log.txt
          echo "::notice title=Map audit::exit $E ($([ $E = 3 ] && echo 'time ran out: the next job goes on' || echo done)); $(tail -1 ../out/audit/run-log.txt | cut -c1-300)"
          [ "$E" = 3 ] && echo "more=yes" >> $GITHUB_OUTPUT
          echo "areas=$AREAS" >> $GITHUB_OUTPUT
          python3 .github/scripts/kpc_status.py board 'Map audit' $([ $E = 0 ] || [ $E = 3 ] && echo green || echo amber) "exit $E $(date -u +%F): $(tail -1 ../out/audit/run-log.txt | cut -c1-140)" 'chat 2 (worst rows = fixes) + chat 11 / 12 (questions)' || true   # ok: the board line is a courtesy
          (for i in 1 2 3; do git add data/status && git commit -qm "board: map audit" && git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 7; done) || true   # ok: the board line is a courtesy
          cd ../out && find audit -size +20M -delete; git add -A audit && git commit -qm "map audit (run ${{ github.run_id }})" && { for i in 1 2 3 4 5 6; do git push -q origin HEAD:tools-out && break; git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git rebase -q origin/tools-out; sleep $((RANDOM % 15 + 5)); done; } || echo "::warning title=Map audit::results not saved to tools-out this time"
          true   # ok: the notices above say what happened
      - name: Next job (the audit goes on until every area is done)
        if: steps.r.outputs.more == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/kpc-map-audit.yml/dispatches -f ref=main -f "inputs[areas]=${{ inputs.areas }}" || echo "::warning title=Map audit::could not start the next job"
