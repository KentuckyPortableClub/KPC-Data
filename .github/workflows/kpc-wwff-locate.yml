name: KPC WWFF missing pins (temporary, chat 2)
# One run: WWFF references with no location -> official EEA registers (rule in KPC-Links notes/mapping.md 'WWFF MISSING PINS').
# Saves only data/wwff-locate/ (held, nothing on a map). Never fails. Deleted after its run.
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: kpc-wwff-locate
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay this repo's data over the checkout
        continue-on-error: true
        run: mkdir -p data/wwff && cp -a kpcdata/data/wwff/. data/wwff/
      - name: Find the pins
        continue-on-error: true
        env:
          MINUTES: '100'
        run: python3 .github/scripts/kpc_wwff_locate.py || true
      - name: Save (once)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p kpcdata/data/wwff-locate && cp -a data/wwff-locate/. kpcdata/data/wwff-locate/ 2>/dev/null || true
          bash .github/scripts/kpc_push_data.sh kpcdata "WWFF missing pins (held)" data/wwff-locate
