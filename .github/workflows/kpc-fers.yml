name: KPC 2-fer bot (hidden)
# Oct 27 (storage plan Stage 2 step A): runs in KPC-Data. It checks out KPC-Links read-only (public: the scripts and the park data),
# lays this repo's data/fers on top, runs, and saves data/fers + the observations log HERE. Files over 20 MB are kept gzipped.
# Oct 26 2026 (Brandon via HQ: 'GO on the all-states 2-fer bot'; Brandon 5:37 AM: 'do the world'). Finds spots where
# POTA parks share 100 yards of official ground. HIDDEN: writes data/fers/ only; nothing links to it.
# Nov 8: Save only on real success (never on cancel/fail). Stale/failed-key gate before the bot runs.
# Waiting-room divert for this workflow is a follow-up (2-fers not public yet). Three passes, run
# one after another by hand (1 = saved outlines, 2 = fresh downloads, 3 = finest shapes + pins). Two jobs per pass:
# North America (US + Canada) and the rest of the world. Never fails (a failed run emails Brandon). Chat 2 starts it.
# Nov 9 PM (run 42649544758 never finished; Brandon t905u 'get a good run on all that', regions are fine; t906u into the weekly
# batch): AREAS. region = one or more area names from .github/fers-areas.json (southeast, canadaeast, ...) or 'areas' for all of
# them: one job per area, each with its own time budget, 3 at a time. An area out of time keeps its previous files; run it again
# by name (python3 .github/scripts/kpc_fers_areas.py status prints the line). A time-out or a crash now shows RED, not green.
# Nov 9 evening (Brandon t909u-t918u, 4:33-4:45 PM CST): ONE monthly cron (his t911u/t912u 'once a month'): pass all on every area.
# Saved outlines first (the key's saved copy, then this bot's own saved-live copy on KPC-Data's fers-cache release; a live read is
# saved for next time and re-read about once a month, a quarter of them per run). Only the pairs whose parks changed (outline,
# record ids, POTA entry, or a declared rule change in KPC-Links .github/fers-rule-scope.json) are tested again. Each run also
# rebuilds the due areas in full, round-robin (one full rebuild per area per full_cycle_days = 90, Brandon confirmed t918u).
on:
  schedule:
    - cron: '23 8 5 * *'   # monthly, the 5th, 2:23 AM CST (after the monthly US key on the 1st and Canada key on the 2nd)
  workflow_dispatch:
    inputs:
      pass:
        description: 'Pass: 1 (saved outlines), 2 (fresh downloads), 3 (finest shapes), 4 (access pins only), all (1+2+3 in one run)'
        default: '1'
      minutes:
        description: 'Minutes per job (default 320)'
        default: '320'
      states:
        description: 'Only these (e.g. "US-OH CA-ON W-GB"; blank = all)'
        default: ''
      region:
        description: 'Area name(s) from .github/fers-areas.json (e.g. "southeast canadaeast"), areas (all of them, one job each), or as before: both, na (US + Canada), world, ky'
        default: 'both'
      full:
        description: 'Full rebuild: blank = the due areas only (round-robin), all = every job (emergency), none = no full area'
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-fers
  cancel-in-progress: false
jobs:
  plan:
    # Nov 9 PM: which jobs to run (one per area, or the old na / world / ky / both)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            data/fers/full-rebuild-*.txt
          sparse-checkout-cone-mode: false
      - id: p
        env:
          REGION: ${{ inputs.region || 'areas' }}
          STATES: ${{ inputs.states }}
          FULL: ${{ inputs.full }}
        run: python3 .github/scripts/kpc_fers_areas.py plan >> "$GITHUB_OUTPUT"
  fers:
    needs: plan
    if: ${{ needs.plan.outputs.list != '[]' }}
    name: fers (${{ matrix.r.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 3   # never more than 3 jobs at the agency servers (Oct 27 rule)
      matrix:
        r: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - name: Note the job start (Nov 9 time budget)
        run: echo "KPC_JOB_T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: Get the scripts and park data (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data)
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Tools + saved outlines + the last 2-fer files
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KPC_ARCHIVE_TOKEN: ${{ secrets.KPC_ARCHIVE_TOKEN }}
        run: |
          pip install -q numpy opencv-python-headless || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          mkdir -p cache/us cache/ca cache/world data/fers
          rm -rf data/fers && cp -r kpcdata/data/fers data/fers 2>/dev/null || mkdir -p data/fers
          for f in data/fers/*.json.gz; do [ -f "$f" ] && gunzip -f "$f"; done
          if [ "${{ matrix.r.region }}" = world ]; then
            gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'W-*.json.gz' -D cache/world --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          else
            gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-*.json.gz' -D cache/us --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'CA-ALL.json.gz' -D cache/ca --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          fi
          # Nov 9 evening: this bot's own saved outlines for the area (read live once, saved on this repo's fers-cache release)
          mkdir -p cache/fers
          # Nov 9 evening (4:52 PM): KPC-Archive is the store; the fers-cache release is only the fallback when KPC_ARCHIVE_TOKEN is missing
          bash .github/scripts/kpc_archive.sh get fers-saved-live cache/fers "saved-live-${{ matrix.r.tag || matrix.r.name }}.json.gz" \
            || gh release download fers-cache -R "$GITHUB_REPOSITORY" -p "saved-live-${{ matrix.r.tag || matrix.r.name }}.json.gz" -D cache/fers --clobber 2>/dev/null \
            || echo "::notice title=2-fer saved outlines::no saved-live copy for ${{ matrix.r.name }} yet (first run reads live and saves)"
      - name: Refuse a stale or incomplete key for this region (Nov 8)
        # Root cause: run 42451234481 measured W-AU on world W-42410527148 while a newer world build was coming; bad output followed.
        id: key_gate
        env:
          REGION: ${{ matrix.r.region }}
          STATES: ${{ matrix.r.states }}
        run: |
          python3 kpcdata/.github/scripts/kpc_fers_key_gate.py || { kpc_rc=$?; echo "::error title=kpc_fers_key_gate.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers_key_gate.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit 1; }
      - name: POTA activation history (pairs worked the same day, counts only)
        if: ${{ matrix.r.region == 'ky' || (matrix.r.region == 'na' && matrix.r.states != '') }}
        id: kept_green_2
        continue-on-error: true
        timeout-minutes: 45
        env:
          STATES: ${{ matrix.r.region == 'ky' && 'US-KY' || matrix.r.states }}
          PAIR_MINUTES: '40'
        run: python3 .github/scripts/kpc_pota_pairs.py || { kpc_rc=$?; echo "::error title=kpc_pota_pairs.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_pota_pairs.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Look for shared ground
        id: kept_green_3
        continue-on-error: true
        timeout-minutes: 335
        env:
          PASS: ${{ inputs.pass || 'all' }}
          MINUTES: ${{ inputs.minutes || '320' }}
          STATES: ${{ matrix.r.states }}
          REGION: ${{ matrix.r.region }}
          RUN_TAG: ${{ matrix.r.tag }}
          KPC_FERS_FULL: ${{ matrix.r.full }}         # Nov 9 evening: '1' = this area's round-robin full rebuild (every pair again)
          KPC_FERS_LIVE_DIR: cache/fers
          KPC_FERS_PARK_S: '600'   # Nov 9 PM: one park / pair / map request may take 10 minutes at most (skipped + listed after)
        run: |
          # Nov 9 PM (Quality NO on #57): every handler below ENDS the step with the script's own exit code (1 = crash, 3 = hard stop),
          # so this step's outcome is 'failure' and Save (if: steps.kept_green_3.outcome == 'success') does not run; Report then goes red.
          # Nov 9 PM: the bot stops by itself 5 minutes before this step's limit (exit 3 = red), so it never hits the 335-minute cut
          export KPC_HARD_END=$(( ${KPC_JOB_T0:-$(date +%s)} + 335 * 60 - 300 ))
          # Oct 27 (SAVE USAGE): pass 'all' = passes 1, 2 and 3 back to back in ONE run (no waiting between dispatches)
          # Oct 27 (Fable review #1, HQ GO): the passes SHARE the time: pass 1 at most a fifth, pass 2 half of what is left, pass 3
          # the rest; a pass out of time saves 'waiting for pass N' and the next run carries on (never a red run)
          if [ "$PASS" = all ]; then
            END=$(( $(date +%s) + ${MINUTES:-320} * 60 ))
            # Nov 9 (Quality must-fix 1): never plan past this step's own 335-minute limit (a one-state run spends up to 45 minutes on
            # the POTA history first, and the passes then hit the job limit mid-pass); 5 minutes are kept for the save
            HARD=$(( ${KPC_JOB_T0:-$(date +%s)} + 335 * 60 - 300 )); [ $END -gt $HARD ] && END=$HARD
            TOTAL=$(( (END - $(date +%s)) / 60 ))
            for p in 1 2 3 5; do   # 5 = re-check water + tidy the rows + 'same land' owner / pin (Oct 27)
              LEFT=$(( (END - $(date +%s)) / 60 ))
              # Nov 9: pass 1 tests every touching pair (46,261 in US + Canada) and was cut at 359 with a fifth: it now gets 2/5
              if [ $p = 1 ]; then CAP=$(( TOTAL * 2 / 5 )); elif [ $p = 2 ]; then CAP=$(( LEFT / 2 )); elif [ $p = 3 ]; then CAP=$(( LEFT * 4 / 5 )); else CAP=$LEFT; fi
              [ $CAP -gt $LEFT ] && CAP=$LEFT
              [ $CAP -lt 5 ] && { echo "::notice title=2-fer bot::no time left for pass $p (next run carries on)"; break; }
              PASS=$p MINUTES=$CAP python3 .github/scripts/kpc_fers.py || { kpc_rc=$?; echo "::error title=kpc_fers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit $kpc_rc; }
            done
          else python3 .github/scripts/kpc_fers.py || { kpc_rc=$?; echo "::error title=kpc_fers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit $kpc_rc; }; fi
          # Oct 27 (HQ): Kentucky's known river + trail pairs must come out before any big run
          if [ "$REGION" = ky ]; then python3 .github/scripts/kpc_fers_known.py || { kpc_rc=$?; echo "::error title=kpc_fers_known.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers_known.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit $kpc_rc; }; fi
          # Oct 27 (HQ 3:46 PM): MISSING CHECK = every pair we have outside reason to expect: FOUND / DROPPED / NEVER LOOKED AT
          if [ "$REGION" = ky ]; then AREA=ky python3 .github/scripts/kpc_fers_expected.py || { kpc_rc=$?; echo "::error title=kpc_fers_expected.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers_expected.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit $kpc_rc; }
          elif [ -n "$STATES" ] && [ "$REGION" = na ]; then python3 .github/scripts/kpc_fers_expected.py || { kpc_rc=$?; echo "::error title=kpc_fers_expected.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fers_expected.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit $kpc_rc; }; fi
      - name: Observations log (new possible overlaps)
        if: ${{ matrix.r.region != 'world' }}
        id: kept_green_4
        continue-on-error: true
        env:
          OBS_RUN: 2-fer bot pass ${{ inputs.pass || 'all' }} (${{ matrix.r.name }})
          OBS_FILE: kpcdata/data/observations/fers-${{ matrix.r.name }}.json
          OBS_DATA_DIR: kpcdata
        run: mkdir -p kpcdata/data/observations; python3 .github/scripts/kpc_map_observations.py || { kpc_rc=$?; echo "::error title=kpc_map_observations.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_map_observations.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; exit $kpc_rc; }
      - name: Save (once, at the end; never on cancel or failed Look)
        # Nov 8: cancelled run 42543101862 still pushed W-AU because Save was if: always(). Require real success + Look outcome.
        if: ${{ success() && steps.kept_green_3.outcome == 'success' }}
        id: kept_green_5
        run: |
          # limits plan L-b: a file over 20 MB is kept gzipped (GitHub refuses 100 MB)
          for f in data/fers/*.json; do [ -f "$f" ] && [ $(stat -c %s "$f") -gt 20000000 ] && gzip -9nf "$f"; done
          mkdir -p kpcdata/data/fers
          # only the files THIS job changed (the two jobs share the folder)
          # Fable review A6: only THIS run's files go back (own states + the run's own report/looked/expected/missing files); all states only when STATES is blank
          if [ -n "${{ matrix.r.states }}" ] || [ "${{ matrix.r.region }}" = ky ]; then
            for st in ${{ matrix.r.states }} ${{ matrix.r.region == 'ky' && 'US-KY' || '' }}; do for f in data/fers/$st.json data/fers/$st.json.gz data/fers/pota-pairs-$st.json; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/fers/ && case "$f" in *.json.gz) rm -f "kpcdata/${f%.gz}";; data/fers/US-*|data/fers/CA-*|data/fers/W-*) rm -f "kpcdata/$f.gz";; esac; done; done   # Nov 1: the new copy replaces the other name (.json vs .json.gz), so a stale twin never wins
            TAG="${{ matrix.r.tag }}"; [ -n "$TAG" ] && for f in data/fers/*-"$TAG".json; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/fers/; done   # Nov 9 PM: the area's own report / looked / missing files
            for f in data/fers/*-ky.json data/fers/known-answers.json data/fers/ky-outline-drift.json data/fers/report.json data/fers/same-outline.json data/fers/missing-na.json data/fers/looked-*.json data/fers/expected-*.json; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/fers/; done
          else
            for f in data/fers/*; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/fers/; done
          fi
          # Nov 9 evening: the round-robin full rebuild is recorded only after it finished and saved
          if [ "${{ matrix.r.full }}" = 1 ] && [ -n "${{ matrix.r.tag }}" ]; then
            date +%F > "kpcdata/data/fers/full-rebuild-${{ matrix.r.tag }}.txt"   # one small file per area (3 jobs push at once: no clashes)
          fi
          cd kpcdata
          for f in data/fers/*.json.gz; do [ -f "$f" ] && rm -f "${f%.gz}"; done
          cd ..
          STRICT=1 bash .github/scripts/kpc_push_data.sh kpcdata "2-fer bot pass ${{ inputs.pass || 'all' }} (${{ matrix.r.name }}, hidden data)" data || exit 1   # Nov 8: no continue-on-error; never if: always()
      - name: The run broke - save only what finished (Nov 9 evening, Brandon t926u)
        # a crash (1) or time-out (3) in Look: keep the pair answers that finished (reuse files: the next run skips those pairs) and the
        # live file of a state ONLY if it finished every pass today; a partly done state keeps its previous file. The job stays red (Report).
        if: ${{ !cancelled() && steps.kept_green_3.outcome == 'failure' && matrix.r.region != 'world' }}
        env:
          STATES: ${{ matrix.r.states }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kpcdata/data/fers; n=0
          for f in data/fers/reuse-p*-"${{ matrix.r.tag || matrix.r.region }}".json; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/fers/ && n=$((n + 1)); done
          if [ "${{ inputs.pass || 'all' }}" = all ] && [ -n "$STATES" ]; then
            for f in $(python3 kpcdata/.github/scripts/kpc_fers_areas.py finished); do ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/fers/ && n=$((n + 1)) && echo "::notice title=2-fer bot::$f finished every pass before the break: saved"; done
          fi
          echo "::warning title=2-fer bot::the run broke; saved $n finished file(s) (pair answers + fully finished states only). Partly done states keep their previous files."
          [ "$n" -gt 0 ] || exit 0
          STRICT=1 bash .github/scripts/kpc_push_data.sh kpcdata "2-fer bot: finished parts of a broken run (${{ matrix.r.name }}, hidden data)" data || exit 1
      - name: Keep the outlines read live for next time (KPC-Archive; fers-cache release only as the fallback, Nov 9 evening)
        if: ${{ !cancelled() && (steps.kept_green_3.outcome == 'success' || steps.kept_green_3.outcome == 'failure') }}   # t926u: also after a break (only finished reads are in the file)
        env:
          GH_TOKEN: ${{ github.token }}
          KPC_ARCHIVE_TOKEN: ${{ secrets.KPC_ARCHIVE_TOKEN }}
        run: |
          ls cache/fers/saved-live-*.json.gz >/dev/null 2>&1 || { echo "nothing read live"; exit 0; }
          if bash .github/scripts/kpc_archive.sh put fers-saved-live "2-fer saved outlines (${{ matrix.r.name }}, run $GITHUB_RUN_ID)" cache/fers/saved-live-*.json.gz; then exit 0; fi
          echo "::warning title=KPC-Archive::2-fer saved outlines not saved to KPC-Archive (see above); saved to the fers-cache release instead"
          gh release view fers-cache -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create fers-cache -R "$GITHUB_REPOSITORY" --prerelease --title '2-fer saved outlines' --notes "Outlines the 2-fer bot had to read live (no saved copy in KPC-Links boundary-cache), one file per area; re-read about once a month."
          gh release upload fers-cache cache/fers/saved-live-*.json.gz -R "$GITHUB_REPOSITORY" --clobber
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          # Nov 9 PM (run 42649544758 showed a green check after 'Look for shared ground' timed out at 335 minutes): a Look step that
          # failed or timed out makes the job RED, always (nothing was saved; the areas keep their previous files)
          if (s.get('kept_green_3') or {}).get('outcome') in ('failure', 'cancelled'):
              print("::error title=2-fer bot::'Look for shared ground' did not finish (time-out or error): nothing was saved, the areas keep their previous files. Run this area again.")
              sys.exit(1)
          PY
