name: KPC camping refresh, every US state once a week (staggered)
# Oct 30 2026 (chat 10; HQ 11:12 AM, Brandon 11:10 AM 'turn bot on'): CAMPING only (hours / fees / closures outside Kentucky stay
# off and hidden). Each day one slice of the states (Kentucky on Thursdays with its slice) gets the campground info bot through the
# workshop (kpc-workshop.yml, bots=campinfo): every changed file waits in data/waiting/in/ for the waiting room's Rule F checks +
# chat 11's YES. State park camping (data/campstate, KPC-Links' Wednesday bot) reaches the waiting room through the daily copy.
# Never red.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '29 7 * * *'
  workflow_dispatch:
    inputs:
      areas:
        description: 'Areas to do now instead of today''s slice (e.g. "US-TN")'
        default: ''
permissions:
  actions: write
jobs:
  slice:
    runs-on: ubuntu-latest
    steps:
      - name: Today's slice -> the workshop (campinfo only)
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          A="${{ inputs.areas }}"
          if [ -z "$A" ]; then
            S="AK AL AR AZ CA CO CT DC DE FL GA HI IA ID IL IN KS KY LA MA MD ME MI MN MO MS MT NC ND NE NH NJ NM NV NY OH OK OR PA RI SC SD TN TX UT VA VT WA WI WV WY"
            D=$(date -u +%u); i=0; A=""
            for s in $S; do [ $((i % 7 + 1)) = "$D" ] && A="$A US-$s"; i=$((i+1)); done
          fi
          echo "::notice title=Camping weekly::today: $A"
          gh api -X POST repos/${{ github.repository }}/actions/workflows/kpc-workshop.yml/dispatches -f ref=main -f 'inputs[bots]=campinfo' -f "inputs[areas]=$A" -f 'inputs[chain]=0' || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
