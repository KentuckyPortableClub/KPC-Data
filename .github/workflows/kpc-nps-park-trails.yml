# NPS park trail lines (Nov 8 2026; Brandon: 'NPS offers trails'). MANUAL ONLY (no schedule). Reads the NPS's own public
# NPS_Public_Trails_Geographic service on mapservices.nps.gov (no key needed, none sent; robots.txt checked first), drops OSM-sourced
# lines, writes one gz GeoJSON per NPS unit + index.json as a run ARTIFACT for review. Nothing is committed or pushed.
# The NPS DataStore is robots-disallowed for bots: hand download only.
name: KPC NPS park trails (manual, artifact only)
on:
  workflow_dispatch:
    inputs:
      units:
        description: "NPS unit codes, comma separated (e.g. GRSM,BUFF,MACA); blank or ALL = every NPS unit (about 1 request a second)"
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: kpc-nps-park-trails
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pull
        env:
          UNITS: ${{ inputs.units }}
        run: |
          case "$UNITS" in *[!A-Za-z,]*) echo "::error::units takes codes like GRSM,BUFF (blank = all)"; exit 1;; esac
          python3 .github/scripts/kpc_nps_park_trails.py --units "$UNITS" --out "$GITHUB_WORKSPACE/nps-trails"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nps-park-trails, path: nps-trails/, retention-days: 14 }
