name: KPC map watch (near misses + observations log)
# Oct 27 (storage plan Stage 2 step A): the two HIDDEN review lists chat 8 reads, kept in KPC-Data.
#   near misses      data/outline-leads/near-miss.json (parks with no outline + official areas around their pin)
#   observations     data/map-observations.json (what changed in the park data over the last day: outlines, closures,
#                    campgrounds, access points, links, new possible 2-fers) - compares KPC-Links now with ~25 hours ago
# Reads KPC-Links (public) read-only. Daily after the nightly boundary check, and by hand. Never fails, never emails.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '53 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the park data (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data)
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Near misses
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cache/us cache/ca data/outline-leads
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-*.json.gz' -D cache/us --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'CA-ALL.json.gz' -D cache/ca --clobber || { kpc_rc=$?; echo "::warning title=download::a download failed (exit $kpc_rc); results may use old or missing files"; echo "download - a download failed (exit $kpc_rc); results may use old or missing files" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          rm -f cache/us/prev-*.json.gz
          python3 .github/scripts/kpc_near_miss.py || { kpc_rc=$?; echo "::error title=kpc_near_miss.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_near_miss.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          mkdir -p kpcdata/data/outline-leads
          [ -f data/outline-leads/near-miss.json ] && cp data/outline-leads/near-miss.json kpcdata/data/outline-leads/ || true   # ok: nothing to do is fine
      - name: Observations log (the last day's changes)
        id: kept_green_2
        continue-on-error: true
        run: |
          git fetch -q --shallow-since="2 days ago" origin HEAD || { kpc_rc=$?; echo "::warning title=git fetch::git could not fetch or merge the newest main (exit $kpc_rc)"; echo "git fetch - git could not fetch or merge the newest main (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          BASE=$(git rev-list -1 --before="25 hours ago" HEAD 2>/dev/null)
          [ -z "$BASE" ] && BASE=$(git rev-list --max-parents=0 HEAD 2>/dev/null | tail -1)
          [ -z "$BASE" ] && BASE=HEAD
          cp kpcdata/data/outline-leads/near-miss.json data/outline-leads/near-miss.json 2>/dev/null || true   # ok: nothing to do is fine
          git -C kpcdata fetch -q --shallow-since="2 days ago" origin HEAD || true   # ok: optional git step; the next step reports
          DBASE=$(git -C kpcdata rev-list -1 --before="25 hours ago" HEAD 2>/dev/null); [ -z "$DBASE" ] && DBASE=HEAD
          OBS_DATA_BASE=$DBASE OBS_BASE=$BASE OBS_DATA_DIR=kpcdata OBS_FILE=kpcdata/data/map-observations.json OBS_RUN='daily watch' python3 .github/scripts/kpc_map_observations.py || { kpc_rc=$?; echo "::error title=kpc_map_observations.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_map_observations.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save (once)
        if: always()
        id: kept_green_3
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data 2>/dev/null || true   # ok: an optional path may not exist
          git diff --cached --quiet && exit 0
          git commit -qm "Map watch: near misses + observations (hidden review lists)" || exit 0
          { for i in 1 2 3 4; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 7)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }
          true
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
