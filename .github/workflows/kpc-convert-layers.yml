name: KPC map-format converter (WFS / downloads / Socrata / CKAN -> GeoJSON near each pin; leads for the collector)
# Oct 31 2026 (chat 10; HQ 5:45 PM, Brandon 'let 10 wire in'): the outside coder's converter (.github/scripts/tools/
# kpc_convert_layers) reads every non-ArcGIS lead (data/intake/leads-oct31.json 'other_layer', US + Canada first) and writes a
# small GeoJSON of the records near each pin to branch tools-out (convert/) + report.csv. The layer collector then tests the
# OK ones (pin inside / named line within 200 m + name tiers) and asks chat 11, like every layer. Decides nothing. Nightly while
# leads are left, straight through. Never red.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '53 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-convert-layers
  cancel-in-progress: false
# PR2 (Nov 2): a push to tools-out that loses a race with another bot pulls --rebase and tries again (5 tries; no force).
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
    steps:
      - name: Wait for HQ's stop-gap run to finish (same files)
        id: gap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(gh run list -R ${{ github.repository }} --workflow kpc-outside-tools.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0)
          if [ "$B" != 0 ]; then echo "busy=yes" >> $GITHUB_OUTPUT; echo "::notice title=Outside tools::HQ's stop-gap run is still going: skipped this time"; fi
      - uses: actions/checkout@v5
        if: steps.gap.outputs.busy != 'yes'
        with:
          path: kpcdata
      - uses: actions/setup-python@v5
        if: steps.gap.outputs.busy != 'yes'
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        if: steps.gap.outputs.busy != 'yes'
        with:
          path: kpcdata/.kpc_cache
          key: kpc-convert-${{ github.run_id }}
          restore-keys: kpc-convert-
      - name: The side branch for the converter's files (tools-out, never main)
        if: steps.gap.outputs.busy != 'yes'
        id: kept_green_1
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin tools-out:tools-out && git worktree add -q ../out tools-out || true   # ok: optional git step; the next step reports
      - name: Convert (resumes)
        if: steps.gap.outputs.busy != 'yes'
        id: c
        continue-on-error: true
        env:
          KPC_CONVERT_MIN_NEW: ${{ vars.KPC_CONVERT_MIN_NEW || '25' }}
        run: |
          cd kpcdata
          pip install -q -r .github/scripts/tools/kpc_convert_layers/requirements.txt || { kpc_rc=$?; echo "::warning title=install::an install step failed (exit $kpc_rc); the next steps may not work"; echo "install - an install step failed (exit $kpc_rc); the next steps may not work" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          python3 .github/scripts/kpc_intake_reader.py convert || { kpc_rc=$?; echo "::error title=kpc_intake_reader.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_intake_reader.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # pulls its own files from branch intake-files
          python3 .github/scripts/kpc_tools_run.py prep-convert no /tmp/leads.json || { kpc_rc=$?; echo "::error title=kpc_tools_run.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_tools_run.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          R0=$(( $(wc -l < ../out/convert/report.csv 2>/dev/null || echo 1) - 1 ))   # Nov 3: leads read BEFORE this run (progress check below)
          python3 .github/scripts/tools/kpc_convert_layers/kpc_convert_layers.py --leads /tmp/leads.json --out ../out/convert --cache .kpc_cache --max-minutes 50 --resume 2>&1 | tail -20; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { kpc_rc=$?; echo "::warning title=kpc_convert_layers.py::stopped with an error (exit $rc), see the log above"; echo "kpc_convert_layers.py - stopped with an error (exit $rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/leads.json'))))" 2>/dev/null || echo 0)
          R=$(( $(wc -l < ../out/convert/report.csv 2>/dev/null || echo 1) - 1 ))
          echo "::notice title=Map-format converter::$R of $N leads read"
          # Nov 3 (Brandon YES 5:29 PM, 'what starts convert-layers 11x a day'): the 11-12 runs a day are THIS chain (each run starts the
          # next while leads are left, up to the 12-a-day brake); the 03:53 UTC timer only starts it. Now the chain goes on only while a
          # run really moves the backlog (at least KPC_CONVERT_MIN_NEW new leads, default 25); a run that reads (almost) nothing new
          # stops the chain until the next nightly start, instead of 10 more hour-long runs that redo the same leads.
          MIN=${KPC_CONVERT_MIN_NEW:-25}
          if [ "$R" -lt "$N" ] && [ $((R - R0)) -ge "$MIN" ]; then echo "more=yes" >> $GITHUB_OUTPUT
          elif [ "$R" -lt "$N" ]; then echo "::notice title=Map-format converter::only $((R - R0)) new lead(s) this run (< $MIN): no next run until the nightly start"; fi
          cd ../out && git add -A convert && git commit -qm "map-format converter (run ${{ github.run_id }})" && (for i in 1 2 3 4 5; do git push -q origin tools-out && exit 0; git pull -q --rebase origin tools-out || git rebase --abort 2>/dev/null || true; sleep $((i*7)); done; exit 1) || { kpc_rc=$?; echo "::error title=git push::a push failed (exit $kpc_rc); this run is NOT saved"; echo "git push - a push failed (exit $kpc_rc); this run is NOT saved" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Next run while leads are left
        if: steps.gap.outputs.busy != 'yes' && steps.c.outputs.more == 'yes'
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR2 (fewer runs, Nov 2): CHAIN BRAKE. A self-starting chain stops for the day after 12 runs in 24 h (Nov 2: the hard look
          # reader chained 187 times and the WDPA phone book 178 times in one day, each one a commit and a site rebuild). The next
          # scheduled run picks the work up again. Raise the number here if a backlog really needs more.
          kpc_brake() { n=$(gh api "repos/${{ github.repository }}/actions/workflows/kpc-convert-layers.yml/runs?created=>=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=1" --jq .total_count 2>/dev/null || echo 0); if [ "${n:-0}" -ge 12 ]; then echo "::notice title=Chain brake::kpc-convert-layers.yml ran $n times in 24 h (limit 12): no next run now; the next scheduled run goes on"; return 1; fi; return 0; }
          kpc_brake || exit 0
          gh workflow run kpc-convert-layers.yml -R ${{ github.repository }} --ref main || { kpc_rc=$?; echo "::error title=start the next run::could not start the next run (exit $kpc_rc); the chain stops here"; echo "start the next run - could not start the next run (exit $kpc_rc); the chain stops here" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
