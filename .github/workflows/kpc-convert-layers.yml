name: KPC map-format converter (WFS / downloads / Socrata / CKAN -> GeoJSON near each pin; leads for the collector)
# Oct 31 2026 (chat 10; HQ 5:45 PM, Brandon 'let 10 wire in'): the outside coder's converter (.github/scripts/tools/
# kpc_convert_layers) reads every non-ArcGIS lead (data/intake/leads-oct31.json 'other_layer', US + Canada first) and writes a
# small GeoJSON of the records near each pin to branch tools-out (convert/) + report.csv. The layer collector then tests the
# OK ones (pin inside / named line within 200 m + name tiers) and asks chat 11, like every layer. Decides nothing. Nightly while
# leads are left, straight through. Never red.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '53 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-convert-layers
  cancel-in-progress: false
# PR2 (Nov 2): a push to tools-out that loses a race with another bot pulls --rebase and tries again (5 tries; no force).
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
    steps:
      - name: Wait for HQ's stop-gap run to finish (same files)
        id: gap
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B=$(gh run list -R ${{ github.repository }} --workflow kpc-outside-tools.yml -L 5 --json status -q '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0)
          if [ "$B" != 0 ]; then echo "busy=yes" >> $GITHUB_OUTPUT; echo "::notice title=Outside tools::HQ's stop-gap run is still going: skipped this time"; fi
      - uses: actions/checkout@v5
        if: steps.gap.outputs.busy != 'yes'
        with:
          path: kpcdata
      - uses: actions/setup-python@v5
        if: steps.gap.outputs.busy != 'yes'
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        if: steps.gap.outputs.busy != 'yes'
        with:
          path: kpcdata/.kpc_cache
          key: kpc-convert-${{ github.run_id }}
          restore-keys: kpc-convert-
      - name: The side branch for the converter's files (tools-out, never main)
        if: steps.gap.outputs.busy != 'yes'
        id: kept_green_1
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin tools-out:tools-out && git worktree add -q ../out tools-out || true   # ok: optional git step; the next step reports
      - name: Convert (resumes)
        if: steps.gap.outputs.busy != 'yes'
        id: c
        continue-on-error: true
        run: |
          cd kpcdata
          pip install -q -r .github/scripts/tools/kpc_convert_layers/requirements.txt || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"
          python3 .github/scripts/kpc_intake_reader.py convert || echo "::error title=kpc_intake_reader.py::stopped with an error (exit $?), see the log above"   # pulls its own files from branch intake-files
          python3 .github/scripts/kpc_tools_run.py prep-convert no /tmp/leads.json || echo "::error title=kpc_tools_run.py::stopped with an error (exit $?), see the log above"
          python3 .github/scripts/tools/kpc_convert_layers/kpc_convert_layers.py --leads /tmp/leads.json --out ../out/convert --cache .kpc_cache --max-minutes 50 --resume 2>&1 | tail -20; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || echo "::warning title=kpc_convert_layers.py::stopped with an error (exit $rc), see the log above"
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/leads.json'))))" 2>/dev/null || echo 0)
          R=$(( $(wc -l < ../out/convert/report.csv 2>/dev/null || echo 1) - 1 ))
          echo "::notice title=Map-format converter::$R of $N leads read"
          [ "$R" -lt "$N" ] && echo "more=yes" >> $GITHUB_OUTPUT || true   # ok: nothing to do is fine
          cd ../out && git add -A convert && git commit -qm "map-format converter (run ${{ github.run_id }})" && (for i in 1 2 3 4 5; do git push -q origin tools-out && exit 0; git pull -q --rebase origin tools-out || git rebase --abort 2>/dev/null || true; sleep $((i*7)); done; exit 1) || echo "::error title=git push::a push failed (exit $?); this run is NOT saved"
      - name: Next run while leads are left
        if: steps.gap.outputs.busy != 'yes' && steps.c.outputs.more == 'yes'
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR2 (fewer runs, Nov 2): CHAIN BRAKE. A self-starting chain stops for the day after 12 runs in 24 h (Nov 2: the hard look
          # reader chained 187 times and the WDPA phone book 178 times in one day, each one a commit and a site rebuild). The next
          # scheduled run picks the work up again. Raise the number here if a backlog really needs more.
          kpc_brake() { n=$(gh api "repos/${{ github.repository }}/actions/workflows/kpc-convert-layers.yml/runs?created=>=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=1" --jq .total_count 2>/dev/null || echo 0); if [ "${n:-0}" -ge 12 ]; then echo "::notice title=Chain brake::kpc-convert-layers.yml ran $n times in 24 h (limit 12): no next run now; the next scheduled run goes on"; return 1; fi; return 0; }
          kpc_brake || exit 0
          gh workflow run kpc-convert-layers.yml -R ${{ github.repository }} --ref main || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
