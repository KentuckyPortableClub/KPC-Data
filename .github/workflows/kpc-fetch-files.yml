name: KPC fetch files - boundary files by their link (daily for new links, monthly refresh)
# Nov 1 2026 (chat 10; Brandon 8:59 PM links-pl.csv: Poland's GDOS zips on www.gov.pl/attachment). Reads fetch-*.json on the
# intake-files branch, downloads each published file honestly (kpc_manners; a 403 / robot check is never bypassed), converts it
# (kpc_handfile_convert) and puts file-<area>-<name>-*.geojson.gz on intake-files, where the layer collector's hand-file pass
# matches them at the POTA pins. Daily = only links not fetched yet (quick, no download when there is nothing new);
# the 4th of the month = every link again (a newer file replaces the old). Never red, never emails.
on:
  workflow_dispatch:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '38 10 * * *'   # G9 Nov 2: was '41 10 * * *' (spread the start times; now 3 min earlier)
permissions:
  contents: write
concurrency:
  group: kpc-fetch-files
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            /.github/scripts/kpc_push_data.sh
          sparse-checkout-cone-mode: false
      - name: Fetch + convert
        id: kept_green_1
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name 'KPC bot'; git config user.email 'kpc-bot@users.noreply.github.com'
          git fetch -q origin +refs/heads/intake-files:refs/remotes/origin/intake-files || exit 0
          git worktree add -q ../inf origin/intake-files || exit 0
          L=$(ls ../inf/fetch-*.json 2>/dev/null)
          [ -z "$L" ] && { echo "::notice title=Fetch files::no fetch-*.json on intake-files"; exit 0; }
          [ "$(date -u +%d)" = "04" ] && export REFRESH=1
          python3 .github/scripts/kpc_fetch_files.py $L ../inf || { kpc_rc=$?; echo "::error title=kpc_fetch_files.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_fetch_files.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          cd ../inf
          git add -A file-*.geojson.gz 2>/dev/null || true   # ok: an optional path may not exist
          if ! git diff --cached --quiet; then
            git commit -qm "fetch files: boundary files by their link" || true   # ok: nothing to commit is fine
            { saved=0; for i in 1 2 3; do git push -q origin HEAD:intake-files && { saved=1; break; }; git pull -q --rebase origin intake-files || { kpc_rc=$?; echo "::warning title=git fetch::git could not fetch or merge the newest main (exit $kpc_rc)"; echo "git fetch - git could not fetch or merge the newest main (exit $kpc_rc)" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; sleep 5; done; [ "$saved" = 1 ] || { kpc_rc=$?; echo "::error title=Save::not saved after every try; the next run tries again"; echo "Save - not saved after every try; the next run tries again" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; }
          fi
          cd ../kpcdata
          bash ../links/.github/scripts/kpc_push_data.sh . "fetch files: seen list" data/intake/fetch-seen.json || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
