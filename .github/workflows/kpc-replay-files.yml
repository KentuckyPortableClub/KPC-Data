name: KPC replay-test files from the history backup (one time, by hand)
# Nov 2 2026 (chat 10): the waiting room's REPLAY TEST (data/waiting/replay.json: 38 real good / bad outputs) read each case's
# file from KPC-Data's git history by commit id; the history restart this morning moved that history into the backup bundle
# (release history-20261102-1350), so the replay said FAIL 17 of 38. This run takes each case's file out of the bundle ONCE and
# keeps it on the small orphan branch 'replay-files' as <commit>/<path>; the waiting room reads them from there.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:   # PR2 (Nov 2): one run of this bot at a time; a second start waits instead of piling up
  group: kpc-replay-files
  cancel-in-progress: false
jobs:
  files:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Take the case files out of the backup bundle
        run: |
          set -euo pipefail
          mkdir -p /tmp/b && gh release download history-20261102-1350 -R "$R" -D /tmp/b -p '*.part*' -p '*.bundle' 2>/dev/null || gh release download history-20261102-1350 -R "$R" -D /tmp/b
          cat /tmp/b/*.part* > /tmp/h.bundle 2>/dev/null || mv /tmp/b/*.bundle /tmp/h.bundle
          git clone -q --bare /tmp/h.bundle /tmp/old.git
          mkdir -p /tmp/out
          python3 - <<'PY'
          import json, os, subprocess
          cases = json.load(open('data/waiting/replay.json'))['cases']
          n = miss = 0
          for c in cases:
              if c.get('repo') != 'data': continue
              for f in c['files']:
                  for sha, path in ((f.get('new'), f.get('src_path') or f['path']), (f.get('live'), f.get('live_path') or f['path'])):
                      if not sha or sha in ('live', 'HEAD', 'none'): continue
                      p = subprocess.run(['git', '--git-dir=/tmp/old.git', 'show', f'{sha}:{path}'], capture_output=True)
                      if p.returncode != 0: miss += 1; print(f'::warning title=Replay files::{sha}:{path} not in the bundle'); continue
                      o = os.path.join('/tmp/out', sha, path); os.makedirs(os.path.dirname(o), exist_ok=True)
                      open(o, 'wb').write(p.stdout); n += 1
          print(f'::notice title=Replay files::{n} case files taken out of the backup, {miss} missing')
          PY
          du -sh /tmp/out
      - name: Save on the orphan branch replay-files
        run: |
          cd /tmp/out && git init -q && git checkout -q -b replay-files
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'Replay-test case files (chat 10, Nov 2): <commit>/<path>, taken from the backup release history-20261102-1350.\n' > README.md
          git add -A && git commit -qm 'replay-test case files from the history backup'
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${R}" HEAD:replay-files
          echo "::notice title=Replay files::saved on branch replay-files"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: '0'   # Nov 6 (G8 added here): report only; red/green of this job is unchanged
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
