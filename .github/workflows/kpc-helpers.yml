name: KPC helper tools (T1 map-match nightly, T2 dead-link fixer + T5 site checker weekly)
# Oct 31 2026 (chat 10; Brandon 8:31 PM 'wire them if they good enough for u'). The outside coder's tools from
# .github/scripts/draft/tools (Fable still reviews Nov 6). Outputs on KPC-Data branch tools-out (BRANCH FIRST). Never red.
#   match     nightly 10:23 UTC (before the waiting room's release): scores every OPEN question; STRONG -> bot YES with the
#             1-in-10 sample (kpc_auto_flow.py match), WEAK / CONFLICT get their band + reason on the row for chat 11.
#   linkfix   Sundays: dead official map / page links in data/docs -> new addresses that open AND name the park ->
#             docs-found-linkfix.json on branch intake-files -> the docs merge picks it up by itself (waiting room, chat 11).
#   sitecheck Sundays: the live site as a guest on a phone + a desktop for 40 parks (10 official / approximate / pin / 2-fer);
#             failures on the status board (amber) for chat 3.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '23 10 * * *'
    - cron: '37 5 * * 0'
  workflow_dispatch:
    inputs:
      as_schedule:
        description: 'Set by the watchdog only: run as the missed scheduled run of this cron (empty = a normal by-hand run)'
        required: false
        default: ''
      jobs:
        description: 'Which: match linkfix sitecheck (any)'
        default: 'match'
permissions:
  contents: write
  actions: write
# PR2 (Nov 2): a push to tools-out that loses a race with another bot pulls --rebase and tries again (5 tries; no force).
jobs:
  match:
    if: ${{ ((github.event_name == 'schedule' || inputs.as_schedule) && (github.event.schedule || inputs.as_schedule) == '23 10 * * *') || contains(inputs.jobs, 'match') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: kpc-helpers-match
      cancel-in-progress: false
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            data/us-key
            data/ca-key
            data/world-key
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: kpcdata/.t1_cache
          key: kpc-t1-${{ github.run_id }}
          restore-keys: kpc-t1-
      - name: Score the open questions + bot YES on STRONG
        id: m
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin tools-out:tools-out && git worktree add -q ../out tools-out || true   # ok: optional git step; the next step reports
          D=.github/scripts/draft/tools/kpc_map_match
          pip install -q -r $D/requirements.txt
          set +e
          python $D/kpc_map_match.py --questions 'data/waiting/questions/*.json' --parkinfo data/parkinfo --pota-tiles data/pota/t --docs data/docs/*.json --out ../out/map-match --cache .t1_cache --max-minutes 45 --resume 2>&1 | tail -8
          [ "${PIPESTATUS[0]}" = 3 ] && echo "more=yes" >> $GITHUB_OUTPUT
          set -e
          LINKS=../links MATCH_FILE=../out/map-match/map_match.json python3 .github/scripts/kpc_keep_answers.py questions >/dev/null 2>&1 || echo "::error title=kpc_keep_answers.py::stopped with an error (exit $?), see the log above"
          LINKS=../links MATCH_FILE=../out/map-match/map_match.json python3 .github/scripts/kpc_auto_flow.py match || echo "::error title=kpc_auto_flow.py::stopped with an error (exit $?), see the log above"
          python3 .github/scripts/kpc_status.py board "T1 map-match" green "open questions scored (STRONG = bot YES, 1 in 10 sampled)" "chat 11 answers WEAK / CONFLICT (band + reason on each row)" || true   # ok: a status-board line (reporting only)
          bash ../links/.github/scripts/kpc_push_data.sh . "T1 map-match: STRONG -> bot YES, bands on the rest" data/waiting/questions data/status || echo "::error title=kpc_push_data.sh::stopped with an error (exit $?), see the log above"
          (cd ../out && find map-match -name '*.jpg' -mtime +7 -delete; git add -A map-match && git commit -qm "T1 map-match (run ${{ github.run_id }})" && (for i in 1 2 3 4 5; do git push -q origin tools-out && exit 0; git pull -q --rebase origin tools-out || git rebase --abort 2>/dev/null || true; sleep $((i*7)); done; exit 1)) || echo "::error title=git push::a push failed (exit $?); this run is NOT saved"
          true
      - name: Next run while questions are left
        if: steps.m.outputs.more == 'yes'
        id: kept_green_1
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PR2 (fewer runs, Nov 2): CHAIN BRAKE. A self-starting chain stops for the day after 12 runs in 24 h (Nov 2: the hard look
          # reader chained 187 times and the WDPA phone book 178 times in one day, each one a commit and a site rebuild). The next
          # scheduled run picks the work up again. Raise the number here if a backlog really needs more.
          kpc_brake() { n=$(gh api "repos/${{ github.repository }}/actions/workflows/kpc-helpers.yml/runs?created=>=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=1" --jq .total_count 2>/dev/null || echo 0); if [ "${n:-0}" -ge 12 ]; then echo "::notice title=Chain brake::kpc-helpers.yml ran $n times in 24 h (limit 12): no next run now; the next scheduled run goes on"; return 1; fi; return 0; }
          kpc_brake || exit 0
          gh workflow run kpc-helpers.yml -R ${{ github.repository }} --ref main -f jobs=match || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
  linkfix:
    if: ${{ ((github.event_name == 'schedule' || inputs.as_schedule) && (github.event.schedule || inputs.as_schedule) == '37 5 * * 0') || contains(inputs.jobs, 'linkfix') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix dead links
        id: kept_green_2
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          D=.github/scripts/draft/tools/kpc_link_fix
          pip install -q -r $D/requirements.txt
          python3 .github/scripts/kpc_helpers_prep.py links-list /tmp/links.json
          python $D/kpc_link_fix.py --links /tmp/links.json --parkinfo data/parkinfo --docs data/docs/*.json --out /tmp/lf --max-minutes 45 2>&1 | tail -6; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || echo "::warning title=kpc_link_fix.py::stopped with an error (exit $rc), see the log above"
          python3 .github/scripts/kpc_helpers_prep.py linkfix-docs /tmp/lf/link_fix.json /tmp/docs-found-linkfix.json
          git fetch -q origin intake-files && git worktree add -q ../if FETCH_HEAD && cd ../if && git checkout -q -B intake-files && cp /tmp/docs-found-linkfix.json . && git add docs-found-linkfix.json && git commit -qm "dead-link fixer (T2): fixed links for the docs merge" && git push -q origin intake-files || echo "::error title=git push::a push failed (exit $?); this run is NOT saved"
          true
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
  sitecheck:
    if: ${{ ((github.event_name == 'schedule' || inputs.as_schedule) && (github.event.schedule || inputs.as_schedule) == '37 5 * * 0') || contains(inputs.jobs, 'sitecheck') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            data/us-key
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the live site as a guest
        id: kept_green_3
        continue-on-error: true
        run: |
          cd kpcdata
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin tools-out:tools-out && git worktree add -q ../out tools-out || true   # ok: optional git step; the next step reports
          D=.github/scripts/draft/tools/kpc_site_check
          pip install -q -r $D/requirements.txt; python -m playwright install --with-deps chromium >/dev/null 2>&1 || echo "::warning title=install::an install step failed (exit $?); the next steps may not work"
          python3 .github/scripts/kpc_helpers_prep.py site-sample ../links/data/us-key data/fers /tmp/sample.json
          rm -rf ../out/site-check; python $D/kpc_site_check.py --sample /tmp/sample.json --tools us_planner --out ../out/site-check --max-minutes 45 2>&1 | tail -6; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || echo "::warning title=kpc_site_check.py::stopped with an error (exit $rc), see the log above"
          F=$(python3 -c "import json;d=json.load(open('../out/site-check/site_check.json'));print(sum(1 for v in d.values() for x in (v if isinstance(v,list) else [v]) if not (x.get('label_ok',True) and x.get('fits_phone',True) and x.get('outline_drawn',True) is not False)))" 2>/dev/null || echo '?')
          if [ "$F" = 0 ]; then python3 .github/scripts/kpc_status.py board "T5 site checker" green "40 parks x phone + desktop: all fine" "nothing" || true   # ok: a status-board line (reporting only)
          else python3 .github/scripts/kpc_status.py board "T5 site checker" amber "$F checks failed (tools-out site-check/summary.md)" "chat 3 fixes the site" || true; fi   # ok: a status-board line (reporting only)
          bash ../links/.github/scripts/kpc_push_data.sh . "T5 site checker: status" data/status || echo "::error title=kpc_push_data.sh::stopped with an error (exit $?), see the log above"
          (cd ../out && git add -A site-check && git commit -qm "T5 site check (run ${{ github.run_id }})" && (for i in 1 2 3 4 5; do git push -q origin tools-out && exit 0; git pull -q --rebase origin tools-out || git rebase --abort 2>/dev/null || true; sleep $((i*7)); done; exit 1)) || echo "::error title=git push::a push failed (exit $?); this run is NOT saved"
          true
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
