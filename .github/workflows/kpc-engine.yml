name: KPC park-info engine (outside build) - nightly, outputs on tools-out engine/
# Nov 1 2026 (chat 10; Brandon 3:19 AM 'wire it to the bots let it eat and see what 11 says tomorrow'). Waits for the outside
# coder's engine in .github/scripts/draft/tools/kpc_engine/ (spec KPC_10_Engine_Spec.md): while the folder is missing this run does
# nothing (green, one notice). Once it is there it runs by itself every night: selftest, then the test areas (US-KY, US-TN, US-RI,
# CA-ON, CH), outputs on tools-out engine/ (nothing live: chat 11 grades through the waiting room). Chains on exit 3. Never red.
on:
  workflow_dispatch:
    inputs:
      areas:
        description: 'areas (blank = the acceptance areas)'
        default: ''
  schedule:
    - cron: '7 4 * * *'
    - cron: '37 */3 * * *'   # Brandon Nov 1 4:37 AM 'leave test running 24 hours': every 3 h for the first 24 h after it lands (the step below stops these after day 1)
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-engine
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75   # Nov 1 chat 10: was 60; runs of 16:19 + 17:17 UTC hit it and lost all their saves
    env:
      KPC_CONTACT: 'https://github.com/KentuckyPortableClub (Kentucky Portable Club ham radio club)'
      KPC_TOOLS_DIR: .github/scripts   # the club's own kpc_manners.py (the engine asked for it)
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            /kpc-ky-data.json
            /ky-*.geojson
            data/ky-answer-key.json
            data/world-key
            .claude/build/research/agency-atlas
            .claude/build/research/WORLD/world_agencies.json
            data/pota/index.json
            /.github/scripts/kpc_push_data.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: kpcdata/.engine_cache
          key: kpc-engine-${{ github.run_id }}
          restore-keys: kpc-engine-
      - name: Run
        id: r
        continue-on-error: true
        run: |
          cd kpcdata; set +e   # never stop half way: every step below reports and goes on
          T0=$(date +%s)   # time budget: the engine gets what is left of 50 min after setup, so the saves below always run
          D=.github/scripts/draft/tools/kpc_engine
          if [ ! -d $D ]; then echo "::notice title=Engine::not delivered yet (waiting for $D): nothing to do"; exit 0; fi
          F=$(git log --diff-filter=A --format=%ct -- $D | tail -1); NOW=$(date +%s)
          if [ "${{ github.event.schedule }}" = '37 */3 * * *' ] && [ -n "$F" ] && [ $((NOW - F)) -gt 86400 ]; then echo "::notice title=Engine::24-hour test over: nightly runs only"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git worktree add -q -B tools-out ../out origin/tools-out
          for k in hardlook camping parking docs portals acres layers; do python3 .github/scripts/kpc_intake_reader.py $k >/dev/null 2>&1 || true; done
          python3 .github/scripts/kpc_gps_prep.py ../links ../prep >/dev/null 2>&1 || true   # Kentucky in the club shapes (pins, parking, outlines)
          [ -f $D/requirements.txt ] && pip install -q -r $D/requirements.txt openpyxl 2>&1 | tail -1
          grep -qi playwright $D/requirements.txt 2>/dev/null && python -m playwright install --with-deps chromium >/dev/null 2>&1
          # STEER (Brandon Nov 1 3:30 AM: 'so I can see it and direct its searches'): open KPC-Data issues labelled engine-steer, e.g. title
          # "steer: US-TN trail" or "steer: NZ outline" -> data/engine/steer.json (areas + kinds first in the queue); the bot never comments on them
          mkdir -p data/engine
          GH_TOKEN=${{ github.token }} gh api "repos/${{ github.repository }}/issues?labels=engine-steer&state=open&per_page=50" --jq '[.[]|{n:.number,title:.title,body:(.body//""),by:.user.login,date:.created_at}]' > /tmp/steer.json 2>/dev/null || echo '[]' > /tmp/steer.json
          python3 - <<'PY' || true
          import json, re
          rows = json.load(open('/tmp/steer.json')); out = []
          for r in rows:
              t = (r['title'] + ' ' + r['body']).upper()
              areas = sorted(set(re.findall(r'\b(?:US|CA)-[A-Z]{2}\b', t)) | {c for c in re.findall(r'\b[A-Z]{2}\b', r['title'].upper()) if c not in ('US', 'CA', 'KY')} )
              kinds = [k for k in ('outline', 'map', 'page', 'parking', 'camping', 'trail', 'hours', 'fees', 'closures') if k.upper() in t]
              out.append({'issue': r['n'], 'title': r['title'], 'areas': areas, 'kinds': kinds or ['outline'], 'by': r['by'], 'date': r['date'][:10]})
          json.dump({'about': 'Brandon\'s steering: these areas / kinds go first (KPC-Data issues labelled engine-steer; close the issue to stop)', 'steer': out}, open('data/engine/steer.json', 'w'), indent=1)
          print(f'::notice title=Engine steer::{len(out)} open steer requests')
          PY
          git fetch -q origin +refs/heads/engine-registry:refs/remotes/origin/engine-registry && git archive origin/engine-registry registry | tar -x -C $D || true   # the 2 big registry files live on branch engine-registry (BRANCH FIRST)
          python3 .github/scripts/kpc_engine_extra.py $D data/intake/queue.json || true   # Brandon Nov 1 1:20 PM: the finders feed the engine (its own crawler finds + the club layer queue)
          P=$D/kpc_engine.py
          A="${{ inputs.areas }}"   # Brandon Nov 1 4:42 AM 'why search ky why not the world': blank = EVERY area in the club order (US + Canada, North America, W1-W10, the rest)
          SA=$(python3 -c "import json;print(','.join(a for s in json.load(open('data/engine/steer.json')).get('steer',[]) for a in s.get('areas',[])))" 2>/dev/null); [ -n "$SA" ] && A="$SA${A:+,$A}"   # Brandon's steer issues go first
          mkdir -p ../out/engine
          python3 $P selftest > ../out/engine/selftest.txt 2>&1; echo "::notice title=Engine selftest::$(tail -3 ../out/engine/selftest.txt | tr '\n' ' ' | cut -c1-400)"
          set +e
          if [ -z "$A" ] || [ "$A" = "$SA" ]; then   # blank = EVERY area (the engine itself needs a list): US states, Canadian provinces, world countries, club order
            ALL=$(python3 - <<'PY'
          import glob, json, os, sys
          sys.path.insert(0, '.github/scripts'); import kpc_order as O
          a = {os.path.basename(f)[:-5] for f in glob.glob('data/parkinfo/US-*.json')} | {'US-KY'}
          a |= {'CA-' + v[10] for v in (json.load(open('data/parkinfo/CA.json')).get('parks') or {}).values() if isinstance(v, list) and len(v) > 10 and v[10]}
          try: a |= {c for c in json.load(open('../links/data/pota/index.json'))['programs'] if len(c) == 2 and c not in ('US', 'CA')}
          except Exception: pass
          key = lambda x: (0 if x == 'US-KY' else 1, O.rank(x if '-' in x else 'W-' + x), 0 if x.startswith('US-') else 1, x)   # Kentucky first, then US, Canada, North America, W1-W10, the rest
          print(','.join(sorted(a, key=key)))
          PY
          ); A="${SA:+$SA,}$ALL"
          fi
          AR="--areas $A"
          MM=$(( 50 - ($(date +%s) - T0) / 60 )); [ $MM -lt 15 ] && MM=15; echo "::notice title=Engine budget::$MM min for the engine after setup"
          python3 $P run $AR --data . --links ../links --out ../out/engine --cache .engine_cache --max-minutes $MM --resume > ../out/engine/run-log.txt 2>&1
          E=$?; tail -15 ../out/engine/run-log.txt
          echo "::notice title=Engine::exit $E (${A:-every area}); board: tools-out engine/board.md"
          # HAND BACK = the bots' drop-off (Brandon 4:42 AM 'go to waiting room'): export the finds in the club's shapes and put them on
          # branch intake-files; the readers that already exist take them from there to the waiting room for chat 11 (hard look reader,
          # collector, converter, docs merge, parking + camping bots, acres). Same names each run = the newest finds replace the last.
          python3 $P export --out ../out/engine --name engine > /dev/null 2>&1 || true
          if [ -d ../out/engine/handback ]; then
            git fetch -q origin +refs/heads/intake-files:refs/remotes/origin/intake-files && git worktree add -q -B intake-files ../ib origin/intake-files \
              && cp ../out/engine/handback/*.json ../out/engine/handback/*.xlsx ../out/engine/handback/*.csv ../ib/ 2>/dev/null; \
              (cd ../ib && git add -A && git commit -qm "engine finds (run ${{ github.run_id }}): handback for the readers -> waiting room" && git push -q origin HEAD:intake-files) || true
            echo "::notice title=Engine::handback: $(ls ../out/engine/handback | tr '\n' ' ' | cut -c1-300)"
          fi
          [ "$E" = 3 ] && echo "more=yes" >> $GITHUB_OUTPUT
          python3 .github/scripts/kpc_status.py board 'Park-info engine' green "exit $E $(date -u +%F) ($A)" 'chat 11 grades tools-out engine/ per kind' || true
          [ -f ../out/engine/board.md ] && cp ../out/engine/board.md data/status/engine-board.md   # the Bot Control Panel reads it (small)
          bash ../links/.github/scripts/kpc_push_data.sh . "board: engine" data/status data/engine && echo '::notice title=Engine save::board saved on main' || true   # Nov 1: the club's safe save (fresh main + only these files); the rebase loop failed every run
          cd ../out && find engine -size +40M -delete; echo "::notice title=Engine out::$(du -sh engine | cut -f1), $(find engine -type f | wc -l) files"; git add -A engine && git commit -qm "engine (run ${{ github.run_id }})" && { for i in 1 2 3 4 5 6; do git push -q origin HEAD:tools-out && { echo '::notice title=Engine save::tools-out saved'; break; }; git fetch -q origin +refs/heads/tools-out:refs/remotes/origin/tools-out && git rebase -q origin/tools-out; sleep $((RANDOM % 15 + 5)); done; } || true
          true
      - name: Next run
        if: steps.r.outputs.more == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run kpc-engine.yml -R ${{ github.repository }} -f areas="${{ inputs.areas }}" || true
