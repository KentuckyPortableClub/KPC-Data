name: KPC world finder v2 (stage 1, hidden)
# Oct 29 2026 (chat 10, Opus; Fable's design KPC-Links .claude/build/research/KPC_WorldHarvester_Redesign_Fable.md; Brandon 10:12 PM
# 'build v2 and test it, timed auto test to run for awhile and shut off ... dump the worlds list of parks with no boundaries in it and
# let it eat'). STAGE 1 only (W9 / W2 off). Biggest gap first, France last; chains itself until the world list is done or the stop
# time passes. Hidden data only (freeze): candidates for chat 11, leads for the intake. Never goes red.
on:
  # PAUSED Nov 4 (fix bundle; Brandon's yes relayed via Super Head Bot 4:53 PM CST; revert this one commit to resume): the schedule is off, by hand (workflow_dispatch) only
  # schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    # - cron: '24 8 * * *'   # PR2 (Nov 2): daily (was every 6 h, '24 */6 * * *'); each start still chains itself through its chunks   # Oct 30 (Brandon 6:01 AM 'set timer'): 5 chunks every 6 h = round the clock until stage 1 is done (then each run finds nothing and stops)   # G9 Nov 2: was '23 */6 * * *' (spread the start times; now 1 min later)
  workflow_dispatch:
    inputs:
      countries:
        description: 'Countries, e.g. "GB NZ" (blank = the whole world list, biggest gap first)'
        default: ''
      chunks:
        description: 'Chunks of 55 min in this job (max 5)'
        default: '5'
      chain:
        description: 'How many MORE jobs may follow by themselves (0 = none)'
        default: '3'
      stop_at:
        description: 'Stop chaining after this UTC time (e.g. 2026-10-30T15:00); blank = no time limit'
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: kpc-world-finder
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: KPC-Links (world key + chat 8's agency table; read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          path: links
          persist-credentials: false
          sparse-checkout: |
            data/world-key
            .claude/build/research/WORLD
            .claude/build/research/agency-atlas
            .github/scripts
      - name: Find, ONE save at the end (Nov 3)
        timeout-minutes: 288   # Nov 3: the step stops before the job's limit, so the one save below always runs
        id: kept_green_1
        continue-on-error: true
        env:
          KPC_SAVE_EACH_CHUNK: ${{ vars.KPC_SAVE_EACH_CHUNK || 'no' }}   # Nov 3 (Brandon YES 5:29 PM): yes = the old way, a save after every chunk
          LINKS: ../links
          COUNTRIES: ${{ inputs.countries }}
        run: |
          cd kpcdata
          N=${{ inputs.chunks || 5 }}; [ "$N" -gt 5 ] && N=5
          for i in $(seq 1 $N); do
            if [ -n "${{ inputs.stop_at }}" ] && [ "$(date -u +%Y-%m-%dT%H:%M)" \> "${{ inputs.stop_at }}" ]; then echo "::notice title=World finder v2::stop time reached: shutting off"; echo "STOP=1" >> "$GITHUB_ENV"; break; fi
            python3 .github/scripts/kpc_keep_answers.py questions data/waiting/questions/world-finder.json || { kpc_rc=$?; echo "::error title=kpc_keep_answers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_keep_answers.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; python3 .github/scripts/kpc_keep_answers.py state data/world-finder/state.json || { kpc_rc=$?; echo "::error title=kpc_keep_answers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_keep_answers.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 30: never save over chat 11's answers (chunk 2 of the world run did)
            MINUTES=55 python3 .github/scripts/kpc_world_finder.py | tee /tmp/w.log; rc=${PIPESTATUS[0]}; [ "$rc" = 0 ] || { kpc_rc=$?; echo "::warning title=kpc_world_finder.py::stopped with an error (exit $rc), see the log above"; echo "kpc_world_finder.py - stopped with an error (exit $rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            python3 .github/scripts/kpc_status.py board "world finder v2" green "chunk $i: data/world-finder + questions" "chat 11 answers data/waiting/questions/world-finder.json" || true   # ok: a status-board line (reporting only)
            python3 .github/scripts/kpc_keep_answers.py questions data/waiting/questions/world-finder.json || { kpc_rc=$?; echo "::error title=kpc_keep_answers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_keep_answers.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }; python3 .github/scripts/kpc_keep_answers.py state data/world-finder/state.json || { kpc_rc=$?; echo "::error title=kpc_keep_answers.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_keep_answers.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }   # Oct 30: never save over chat 11's answers (chunk 2 of the world run did)
            [ "${KPC_SAVE_EACH_CHUNK:-no}" != yes ] || bash ../links/.github/scripts/kpc_push_data.sh . "world finder v2: chunk $i (hidden)" data/world-finder data/harvest data/waiting/questions data/status data/intake/found-layers-stage2.json || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
            L=$(grep -o '^LEFT=[0-9]*' /tmp/w.log | tail -1 | cut -d= -f2); echo "LEFT=$L" >> "$GITHUB_ENV"
            [ "${L:-0}" = 0 ] && break
          done
      - name: ONE save for the whole run (Nov 3, Brandon YES 5:29 PM; was one save per chunk = up to 5 commits a run)
        if: always()
        id: save_once
        continue-on-error: true
        run: |
          cd kpcdata
          [ "${{ vars.KPC_SAVE_EACH_CHUNK || 'no' }}" = yes ] && { echo 'saved after every chunk (KPC_SAVE_EACH_CHUNK=yes)'; exit 0; }
          bash ../links/.github/scripts/kpc_push_data.sh . "world finder v2: one save for the run (hidden)" data/world-finder data/harvest data/waiting/questions data/status data/intake/found-layers-stage2.json || { kpc_rc=$?; echo "::error title=kpc_push_data.sh::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_push_data.sh - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Countries remain, so the next job starts itself (until the stop time)
        if: ${{ env.STOP != '1' && env.LEFT != '0' && env.LEFT != '' && inputs.chain != '0' && inputs.countries == '' }}
        id: kept_green_2
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.stop_at }}" ] && [ "$(date -u +%Y-%m-%dT%H:%M)" \> "${{ inputs.stop_at }}" ]; then echo "::notice title=World finder v2::stop time reached: not chaining"; exit 0; fi
          C=$(( ${{ inputs.chain }} - 1 ))
          # PAUSED Nov 4 (fix bundle; Brandon's yes relayed via Super Head Bot 4:53 PM CST; revert this one commit to resume): was: gh workflow run kpc-world-finder.yml -R ${{ github.repository }} -f countries= -f chunks=5 -f chain=$C -f stop_at="${{ inputs.stop_at }}" || echo "::error title=start the next run::could not start the next run (exit $?); the chain stops here"
          echo "::warning title=Paused bot::kpc-world-finder.yml is paused (Nov 4 fix bundle) - its next run was NOT started, start it by hand (workflow_dispatch) if it is needed"
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
