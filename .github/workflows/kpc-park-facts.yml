name: KPC park facts (one file from the acreage bot, the page reader and the link IDs)
# NO TIMER: it runs only right after the page reader, the tool trial (acreage bot) or the PC upload pack (22 Nov) finish, or by hand. It downloads
# nothing from any agency and opens no website: it reads files already saved (data/parkinfo on main, acres/ and
# park-pages/facts/ on tools-out, the keeper's sizes when they exist), the key's joined layers (KPC-Links, public,
# read-only) for the size witness, runs kpc_link_ids (web addresses only) and kpc_park_facts, and saves ONE file on main:
#   data/park-facts.json.gz   one row per US / Canadian park: official size (with its witness), page facts, link facts
#   data/park-facts-summary.txt
# It COLLECTS, it does not DECIDE: no key, outline, 2-fer or release is built or changed here.
# STRICT (20 Nov 2026): no step is allowed to fail quietly. A missing input or an error holds the run (red) and nothing is
# saved: a missing file never means "no rule". Only the save job may write to the repository.
on:
  workflow_run:
    workflows:
      - "KPC park page reader (walks the US, one state per run)"
      - "KPC tool trial (outside tools' real-world test from GitHub) - outputs on tools-out"
      - "KPC PC upload pack (by hand)"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kpc-park-facts
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          path: kpcdata
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the saved files (a missing one holds the run)
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/pf"; mkdir -p "$W/pages" "$W/out" "$W/links"
          cd kpcdata
          git fetch -q --depth 1 origin "+refs/heads/tools-out:refs/remotes/origin/tools-out"
          git show origin/tools-out:acres/acres.json > "$W/acres.json"
          git archive origin/tools-out park-pages/facts | tar -x -C "$W/pages" --strip-components=2
          ls "$W"/pages/*.json > /dev/null
          if [ -f data/keeper-sizes/latest.json ]; then cp data/keeper-sizes/latest.json "$W/keeper-sizes.json"; fi
          if ls data/agency-crosswalk/*.json > /dev/null 2>&1; then mkdir -p "$W/crosswalk"; cp data/agency-crosswalk/*.json "$W/crosswalk/"; fi
          cd "$W"
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone -q --depth 1 --filter=blob:none --no-checkout https://github.com/KentuckyPortableClub/KPC-Links links
          git -C links sparse-checkout set --no-cone 'data/us-key/US-*.json' data/us-key/layers.json 'data/ca-key/CA-*.json'
          git -C links checkout -q
          ls links/data/us-key/US-*.json links/data/us-key/layers.json > /dev/null
      - name: Build the one file
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/pf"
          cd kpcdata
          T=.github/scripts/draft/tools
          python3 $T/kpc_link_ids/kpc_link_ids.py --parkinfo data/parkinfo --areas "US CA" --out "$W/links-out"
          L=$(ls "$W"/links-out/*/link-ids.csv | tail -1)
          K=""; [ -f "$W/keeper-sizes.json" ] && K="--keeper-sizes $W/keeper-sizes.json"
          X=""; [ -d "$W/crosswalk" ] && X="--crosswalk $W/crosswalk"
          python3 $T/kpc_park_facts/kpc_park_facts.py --parkinfo data/parkinfo --acres "$W/acres.json" $K $X --pages "$W/pages" \
            --links "$L" --key "$W/links/data/us-key" --key "$W/links/data/ca-key" --layers "$W/links/data/us-key/layers.json" --out "$W/out"
          mkdir -p "$W/save"
          gzip -9 -n -c "$W/out/park-facts.json" > "$W/save/park-facts.json.gz"
          cp "$W/out/summary.txt" "$W/save/park-facts-summary.txt"
          S=$(stat -c %s "$W/save/park-facts.json.gz")
          if [ "$S" -gt 3000000 ]; then echo "::error title=Size::park-facts.json.gz is $S bytes (over 3 MB, owner 23 Nov 12:30 PM): not saved, ask the owner"; exit 1; fi
          echo "::notice title=Park facts::$(sed -n 3,6p "$W/save/park-facts-summary.txt" | tr '\n' ' ' | cut -c1-300)"
      - uses: actions/upload-artifact@v4
        with:
          name: park-facts
          path: ${{ runner.temp }}/pf/save/
          retention-days: 3
          if-no-files-found: error
  save:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: park-facts
          path: data/
      - name: Save the one file on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/park-facts.json.gz data/park-facts-summary.txt
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "park facts: one file from the acreage bot, the page reader and the link IDs"
          bash .github/scripts/kpc_push_retry.sh main 4 "data/park-facts.json.gz data/park-facts-summary.txt"
