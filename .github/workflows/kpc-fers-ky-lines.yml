name: KPC 2-fer Kentucky lines (hidden, once)
# Oct 27 5:36 PM (HQ): when the Kentucky river-bank run finishes, ONE small step adds each Kentucky area spot's LIVE boundary lines
# (pass 6, only the area around each spot) + measures the saved Kentucky outlines vs the live layers (ky-outline-drift.json).
# Starts by itself when a 2-fer bot run ends; does nothing once Kentucky has its lines. Never fails. Delete after it has run.
on:
  workflow_run:
    workflows: ['KPC 2-fer bot (hidden)']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kpc-fers-ky-lines
  cancel-in-progress: false
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Kentucky done and still without lines?
        id: need
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          try: d = json.load(open('kpcdata/data/fers/US-KY.json'))
          except Exception: d = {}
          sp = [x for x in d.get('spots', []) if x.get('kind') == 'area']
          done = str(d.get('pass5', '')) >= '2026-10-27' and str(d.get('pass1', d.get('pass2', ''))) >= '2026-10-27'
          print('go=' + ('yes' if done and sp and not any(x.get('lines') for x in sp) else 'no'))
          PY
      - name: Lines + drift (pass 6)
        if: ${{ steps.need.outputs.go == 'yes' }}
        continue-on-error: true
        timeout-minutes: 75
        env:
          GH_TOKEN: ${{ github.token }}
          PASS: '6'
          REGION: ky
          MINUTES: '60'
        run: |
          pip install -q numpy opencv-python-headless || true
          mkdir -p cache/us cache/ca && rm -rf data/fers && cp -r kpcdata/data/fers data/fers
          for f in data/fers/*.json.gz; do [ -f "$f" ] && gunzip -f "$f"; done
          gh release download boundary-cache -R KentuckyPortableClub/KPC-Links -p 'US-KY.json.gz' -D cache/us --clobber || true
          python3 .github/scripts/kpc_fers.py || true
          cp data/fers/US-KY.json kpcdata/data/fers/ 2>/dev/null || true
          cp data/fers/ky-outline-drift.json kpcdata/data/fers/ 2>/dev/null || true
          cd kpcdata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "2-fer Kentucky: live boundary lines per spot + saved-outline drift (hidden data)" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase --autostash && git push -q && exit 0; sleep $((i * 9)); done
          true
