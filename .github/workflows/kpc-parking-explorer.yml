name: KPC parking layer explorer
# Oct 27 (storage plan Stage 2 step A): runs in KPC-Data; reads KPC-Links (public) read-only, saves the leads HERE.
# Oct 25 2026 (chat 2; Brandon via HQ): looks on the state servers already in data/state-gis.json for parking, trailhead,
# access, boat-ramp and entrance POINT layers -> data/access-leads.json + .md for chat 2 to review. Adds nothing by itself.
# Monthly (the 3rd, before the access run on the 6th) + by hand. Never fails (a failed run emails Brandon).
on:
  schedule:
    - cron: '17 9 3 * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to search (default 100; up to 330 for a long catch-up run)'
        default: '100'
      kind:
        description: 'parking (point layers) or outline (park POLYGON layers not used yet: the outline layer explorer)'
        default: 'parking'
      test_only:
        description: 'Outline kind: skip the search, only test the leads already found'
        type: boolean
        default: false
      deep:
        description: 'Canada deep look: search EVERY folder on the provincial / Parks Canada servers (two jobs, west + east)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-parking-explorer
  cancel-in-progress: false
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    # Oct 25 (Brandon: 'split it up between bots'): four jobs at once, each with its own share of the states / provinces and
    # its own files in data/access-leads/, so they never clash
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.test_only && '["us-a"]' || inputs.deep && '["canada-deep-west","canada-deep-east"]' || '["us-a","us-b","us-c","canada"]') }}
    steps:
      - name: Get the scripts and park data (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data) and lay its leads on top
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Last leads
        run: |
          rm -rf data/access-leads data/outline-leads
          cp -r kpcdata/data/access-leads data/ 2>/dev/null || mkdir -p data/access-leads
          cp -r kpcdata/data/outline-leads data/ 2>/dev/null || mkdir -p data/outline-leads
      - name: Look for parking layers
        continue-on-error: true
        timeout-minutes: 335
        env:
          MINUTES: ${{ inputs.minutes || '100' }}
          PART: ${{ matrix.part }}
          KIND: ${{ inputs.kind || 'parking' }}
        if: ${{ !inputs.test_only }}
        run: python3 .github/scripts/kpc_parking_explorer.py || true
      - name: Test the outline leads (outline kind, one job only)
        if: ${{ inputs.kind == 'outline' && (matrix.part == 'us-a' || inputs.test_only) }}
        continue-on-error: true
        timeout-minutes: 200
        env:
          MINUTES: '180'
        run: python3 .github/scripts/kpc_outline_lead_test.py || true
      - name: Save
        if: always()
        continue-on-error: true
        run: |
          mkdir -p kpcdata/data
          for d in access-leads outline-leads; do
            mkdir -p kpcdata/data/$d
            for f in data/$d/*; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/$d/; done
          done
          cd kpcdata
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/access-leads data/outline-leads 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "Layer leads (${{ inputs.kind || 'parking' }}, ${{ matrix.part }})" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 7)); done
          true
