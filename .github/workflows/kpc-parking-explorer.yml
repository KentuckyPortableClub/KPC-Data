name: KPC parking layer explorer
# Oct 27 (storage plan Stage 2 step A): runs in KPC-Data; reads KPC-Links (public) read-only, saves the leads HERE.
# Oct 25 2026 (chat 2; Brandon via HQ): looks on the state servers already in data/state-gis.json for parking, trailhead,
# access, boat-ramp and entrance POINT layers -> data/access-leads.json + .md for chat 2 to review. Adds nothing by itself.
# Monthly (the 3rd, before the access run on the 6th) + by hand. Never fails (a failed run emails Brandon).
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '18 9 3 * *'   # G9 Nov 2: was '17 9 3 * *' (spread the start times; now 1 min later)
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Minutes to search (default 100; up to 330 for a long catch-up run)'
        default: '100'
      kind:
        description: 'parking (point layers) or outline (park POLYGON layers not used yet: the outline layer explorer)'
        default: 'parking'
      test_only:
        description: 'Outline kind: skip the search, only test the leads already found'
        type: boolean
        default: false
      refresh:
        description: 'Re-read every layer (count + sample) even when it is already in the lead file'
        type: boolean
        default: false
      deep:
        description: 'Canada deep look: search EVERY folder on the provincial / Parks Canada servers (two jobs, west + east)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-parking-explorer
  cancel-in-progress: false
jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    # Oct 25 (Brandon: 'split it up between bots'): four jobs at once, each with its own share of the states / provinces and
    # its own files in data/access-leads/, so they never clash
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.test_only && '["us-a"]' || inputs.deep && '["canada-deep-west","canada-deep-east"]' || '["us-a","us-b","us-c","canada"]') }}
    steps:
      - name: Get the scripts and park data (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data) and lay its leads on top
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Last leads
        run: |
          rm -rf data/access-leads data/outline-leads
          cp -r kpcdata/data/access-leads data/ 2>/dev/null || mkdir -p data/access-leads
          cp -r kpcdata/data/outline-leads data/ 2>/dev/null || mkdir -p data/outline-leads
      - name: Look for parking layers
        id: kept_green_1
        continue-on-error: true
        timeout-minutes: 335
        env:
          MINUTES: ${{ inputs.minutes || '100' }}
          PART: ${{ matrix.part }}
          KIND: ${{ inputs.kind || 'parking' }}
          REFRESH: ${{ inputs.refresh && '1' || '' }}
        if: ${{ !inputs.test_only }}
        run: python3 .github/scripts/kpc_parking_explorer.py || { kpc_rc=$?; echo "::error title=kpc_parking_explorer.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_parking_explorer.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Test the outline leads (outline kind, one job only)
        if: ${{ inputs.kind == 'outline' && (matrix.part == 'us-a' || inputs.test_only) }}
        id: kept_green_2
        continue-on-error: true
        timeout-minutes: 200
        env:
          MINUTES: '180'
        run: python3 .github/scripts/kpc_outline_lead_test.py || { kpc_rc=$?; echo "::error title=kpc_outline_lead_test.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_outline_lead_test.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Save
        if: always()
        id: kept_green_3
        continue-on-error: true
        run: |
          mkdir -p kpcdata/data
          for d in access-leads outline-leads; do
            mkdir -p kpcdata/data/$d
            for f in data/$d/*; do [ -f "$f" ] && ! cmp -s "$f" "kpcdata/$f" && cp "$f" kpcdata/data/$d/; done
          done
          # Oct 28: the one safe save (only this job's files on a fresh main; four matrix jobs push at once)
          bash .github/scripts/kpc_push_data.sh kpcdata "Layer leads (${{ inputs.kind || 'parking' }}, ${{ matrix.part }})" data/access-leads data/outline-leads
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
