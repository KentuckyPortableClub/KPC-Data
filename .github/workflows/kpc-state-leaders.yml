name: KPC state leaders
# Moved here from KPC-Links Oct 27 (storage plan Stage 2, step B5; chat 5). Weekly: top activators in every US state (Hunters
# Lounge, VIP Top 50; the Discord helper's call look-ups read data/leaders/KY-calls.json from here). Weekly only since Oct 28.
# Only parks with new activations are re-read (the cache below). One commit per run, only real changes. Never fails. No secrets.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '21 6 * * 3'    # weekly only, Wed 1:23 AM Central (Brandon GO Oct 28: the daily Kentucky run was dropped)   # G9 Nov 2: was '23 6 * * 3' (spread the start times; now 2 min earlier)
  workflow_dispatch:
    inputs:
      states:
        description: 'States (blank = all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-state-leaders
  cancel-in-progress: false
jobs:
  leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Get the scripts (KPC-Links, read-only; public, no token)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data) and lay its fresh data on top
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B; stops red on empty input)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Fresh data first
        run: |
          rsync -a kpcdata/data/ data/ 2>/dev/null || true   # ok: nothing to do is fine
          cp kpcdata/locations.json kpcdata/locations-ky.json . 2>/dev/null || true   # ok: nothing to do is fine
      - uses: actions/cache/restore@v4
        id: kept_green_1
        continue-on-error: true
        with:
          path: .cache/leaders
          key: kpc-leaders-${{ github.run_id }}
          restore-keys: kpc-leaders-
      - name: Count
        id: kept_green_2
        continue-on-error: true
        env:
          STATES: ${{ inputs.states }}
          BUDGET_MIN: '300'
        run: python3 .github/scripts/kpc_state_leaders.py || { kpc_rc=$?; echo "::error title=kpc_state_leaders.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_state_leaders.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - uses: actions/cache/save@v4
        if: always()
        id: kept_green_3
        continue-on-error: true
        with:
          path: .cache/leaders
          key: kpc-leaders-${{ github.run_id }}
      - name: Save (once, only real changes)
        id: kept_green_4
        continue-on-error: true
        run: |
          [ -d data/leaders ] || exit 0
          mkdir -p kpcdata/data/leaders && rsync -a data/leaders/ kpcdata/data/leaders/
          cd kpcdata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ../.github/scripts/kpc_save_filter.py $(git diff --name-only -- data/leaders) || { kpc_rc=$?; echo "::error title=kpc_save_filter.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_save_filter.py - stopped with an error (exit $kpc_rc), see the log above" | tee -a "$RUNNER_TEMP/kpc-hidden-errors.txt" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
          git add data/leaders
          git diff --cached --quiet && exit 0
          git commit -qm 'State leaders'
          { for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*8)); done; echo "::error title=Save::not saved after every try; the next run tries again"; }; exit 0
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
          KPC_FAIL_SAFE: ${{ vars.KPC_HIDDEN_RED != 'off' && '1' || '0' }}   # next round C4: red on a caught error (safe: this job starts nothing after it)
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          # Next round C4 (Nov 5; Brandon's yes relayed via Super): the errors a step caught itself ('|| { ...; echo ::error ... }') are listed
          # too (kpc-hidden.txt), one 'Hidden failures' line is left for the check-up (data/status/hidden-failures.json), and a job the
          # check-up lists as safe to fail (KPC_FAIL_SAFE=1: it starts nothing after it) goes red on a caught ERROR (not on a warning).
          import sys
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt'); he = h[:-4] + '-errors.txt'
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          errs = [x.strip() for x in open(he, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(he) else []
          if said or bad:
              print(f"::warning title=Hidden failures::{len(errs)} error(s) and {len(said) - len(errs)} warning(s) caught inside steps, {len(bad)} step(s) failed but kept green (job {os.environ.get('GITHUB_JOB', '?')})")
          if errs and os.environ.get('KPC_FAIL_SAFE') == '1':
              print(f'::error title=Fail where safe::{len(errs)} error(s) were caught inside steps, so this job is red (it starts nothing after it). The repo variable KPC_HIDDEN_RED=off turns this off.')
              sys.exit(1)
          PY
