name: KPC state leaders
# Moved here from KPC-Links Oct 27 (storage plan Stage 2, step B5; chat 5). Weekly: top activators in every US state (Hunters
# Lounge, VIP Top 50; the Discord helper's call look-ups read data/leaders/KY-calls.json from here). Weekly only since Oct 28.
# Only parks with new activations are re-read (the cache below). One commit per run, only real changes. Never fails. No secrets.
on:
  schedule:
    - cron: '23 6 * * 3'    # weekly only, Wed 1:23 AM Central (Brandon GO Oct 28: the daily Kentucky run was dropped)
  workflow_dispatch:
    inputs:
      states:
        description: 'States (blank = all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: kpc-state-leaders
  cancel-in-progress: false
jobs:
  leaders:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Get the scripts (KPC-Links, read-only; public, no token)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data) and lay its fresh data on top
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay KPC-Data's moved data over the KPC-Links checkout (Step B; stops red on empty input)
        run: bash .github/scripts/kpc_overlay.sh kpcdata
      - name: Fresh data first
        run: |
          rsync -a kpcdata/data/ data/ 2>/dev/null || true
          cp kpcdata/locations.json kpcdata/locations-ky.json . 2>/dev/null || true
      - uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/leaders
          key: kpc-leaders-${{ github.run_id }}
          restore-keys: kpc-leaders-
      - name: Count
        continue-on-error: true
        env:
          STATES: ${{ inputs.states }}
          BUDGET_MIN: '300'
        run: python3 .github/scripts/kpc_state_leaders.py || true
      - uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: .cache/leaders
          key: kpc-leaders-${{ github.run_id }}
      - name: Save (once, only real changes)
        continue-on-error: true
        run: |
          [ -d data/leaders ] || exit 0
          mkdir -p kpcdata/data/leaders && rsync -a data/leaders/ kpcdata/data/leaders/
          cd kpcdata
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 ../.github/scripts/kpc_save_filter.py $(git diff --name-only -- data/leaders) || true
          git add data/leaders
          git diff --cached --quiet && exit 0
          git commit -qm 'State leaders'
          for i in 1 2 3 4 5 6; do git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && exit 0; sleep $((i*8)); done; exit 0
