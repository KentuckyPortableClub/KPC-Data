name: KPC state trail lines
# Step B5 (chat 2, Oct 27): MOVED from KPC-Links. Checks out KPC-Links read-only (scripts + the data that stays there), lays
# KPC-Data's moved data over it (kpc_overlay.sh), runs, and saves data/trails/ HERE (kpc_push_data.sh: only this job's files, no
# rebase). Never fails.
on:
  schedule:   # Nov 2: schedule re-registered after the history restart (GitHub ran no Data schedule since 8:26 AM CST)
    - cron: '28 7 4 * *'   # G9 Nov 2: was '29 7 4 * *' (spread the start times; now 1 min earlier)
  workflow_dispatch:
    inputs:
      states:
        description: 'States, e.g. "AR DE CANADA" (blank = every state + DC + Canada). Official lines first; OpenStreetMap only as a labelled unofficial fallback when no official line exists (data/trails-layers.json settings.osm_fallback, on by default; PR 4, Nov 2)'
        default: ''
      full:
        description: 'Search every park again, even ones with an official line read in the last 60 days'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: kpc-trails
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Get the scripts and park data (KPC-Links, read-only)
        uses: actions/checkout@v5
        with:
          repository: KentuckyPortableClub/KPC-Links
          persist-credentials: false
      - name: Get this repo (KPC-Data)
        uses: actions/checkout@v5
        with:
          path: kpcdata
      - name: Lay this repo's data over the checkout
        run: touch /tmp/kpc-start; (cd kpcdata && LINKS=.. python3 .github/scripts/kpc_waiting_room.py resume data/trails) || echo "::error title=kpc_waiting_room.py::stopped with an error (exit $?), see the log above"; bash .github/scripts/kpc_overlay.sh kpcdata   # Oct 29 (chat 2 8:20 PM): start from the HELD files
      - name: Build trail lines
        id: kept_green_1
        continue-on-error: true
        env:
          STATES: ${{ inputs.states }}
          FULL: ${{ inputs.full && '1' || '' }}
          MINUTES: '150'
        run: python3 .github/scripts/kpc_state_trails.py || echo "::notice title=State trails::stopped early (see the log)"
      - name: Save (once)
        if: always()
        id: kept_green_2
        continue-on-error: true
        run: |
          mkdir -p kpcdata/data/trails/ && rm -rf kpcdata/data/trails/ && cp -a data/trails kpcdata/data/trails 2>/dev/null || true   # ok: nothing to do is fine
          for f in data/status/*.json; do [ "$f" -nt /tmp/kpc-start ] && ! cmp -s "$f" "kpcdata/$f" && mkdir -p kpcdata/data/status && cp "$f" "kpcdata/$f"; done; true
          # Oct 28 self-grade: one 'grade me' (or 'FAILED its gate') line per batch for the checkers (data/status/inbox-checkers.md)
          if [ -s /tmp/kpc-gate.txt ]; then IFS=$'\t' read -r G A N < /tmp/kpc-gate.txt
            if [ "$G" = PASS ]; then STATUS_DIR=kpcdata/data/status python3 kpcdata/.github/scripts/kpc_status.py grade-me "kpc_state_trails" "${A:-all}" "data/trails/" "$N"
            else STATUS_DIR=kpcdata/data/status python3 kpcdata/.github/scripts/kpc_status.py gate "kpc_state_trails" "${A:-all}" FAIL "$N"; fi; fi; true
          (cd kpcdata && LINKS=.. python3 .github/scripts/kpc_waiting_room.py divert data/trails) || echo "::error title=kpc_waiting_room.py::stopped with an error (exit $?), see the log above"   # Oct 29 (chat 2 8:20 PM): changed files wait in data/waiting/in/ for chat 11, the live ones stay
          bash .github/scripts/kpc_push_data.sh kpcdata "State trails: POTA trail parks" data
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
