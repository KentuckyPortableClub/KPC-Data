name: KPC live chat watcher
# Oct 28 2026 (chat 5; HQ/Brandon): BY HAND ONLY. READ-ONLY watcher of YouTube live chats the club is on: a message that
# mentions the campout / KPC / Kentucky Portable / Taylorsville -> one post in the Discord STAFF room with a ready reply
# (staff paste it as themselves; this bot never writes in YouTube). Waits for the stream to go live (checks every 5 min),
# stops when it ends or after max_hours. Secrets (names only): YOUTUBE_API_KEY, KPC_DISCORD_STAFF_WEBHOOK. Never fails.
on:
  workflow_dispatch:
    inputs:
      videos:
        description: 'YouTube video ids or links, comma separated'
        default: '71y0HPdceXc, maI0-LOx8jY'
      max_hours:
        description: 'Stop after this many hours'
        default: '5'
      dry_run:
        description: 'Print instead of posting'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: kpc-live-chat
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - name: Watch the live chats
        id: kept_green_1
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KPC_DISCORD_STAFF_WEBHOOK: ${{ secrets.KPC_DISCORD_STAFF_WEBHOOK }}
          VIDEOS: ${{ inputs.videos }}
          MAX_HOURS: ${{ inputs.max_hours }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          # accept full links too: keep just the 11-letter ids
          export VIDEOS=$(echo "$VIDEOS" | grep -oE '([A-Za-z0-9_-]{11})' | tr '\n' ',')
          python3 .github/scripts/kpc_live_chat_watch.py || { kpc_rc=$?; echo "::error title=kpc_live_chat_watch.py::stopped with an error (exit $kpc_rc), see the log above"; echo "kpc_live_chat_watch.py - stopped with an error (exit $kpc_rc), see the log above" >> "$RUNNER_TEMP/kpc-hidden.txt"; }
      - name: Report hidden failures (Nov 2 review, G8)
        if: always()
        env:
          KPC_STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os
          s = json.loads(os.environ.get('KPC_STEPS') or '{}')
          bad = [k for k, v in s.items() if v.get('outcome') == 'failure' and v.get('conclusion') == 'success']
          for k in bad: print(f'::error title=Step failed (kept green)::step {k} failed; continue-on-error kept the job green. See its log.')
          print(f'{len(bad)} hidden step failure(s)')
          # Nov 4 PM fix bundle item 7: the errors a step caught itself ('|| echo ::error ...') are listed too (kpc-hidden.txt)
          h = os.path.join(os.environ.get('RUNNER_TEMP') or '/tmp', 'kpc-hidden.txt')
          said = [x.strip() for x in open(h, encoding='utf-8', errors='replace') if x.strip()] if os.path.exists(h) else []
          print(f'{len(said)} error(s) caught inside steps and kept green')
          if said and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write(f'**Errors caught inside steps and kept green ({len(said)}):**\n' + ''.join(f'- {x}\n' for x in said[:50]))
          if bad and os.environ.get('GITHUB_STEP_SUMMARY'):
              open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('**Steps that failed but were kept green:** ' + ', '.join(bad) + '\n')
          PY
