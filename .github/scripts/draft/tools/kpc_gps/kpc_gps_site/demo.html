<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPC GPS download - demo (sample data)</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; background: #f4f4f0; color: #222; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .warn { background: #fff4cc; border: 1px solid #e0c050; padding: 8px; border-radius: 6px; font-size: 14px; }
  .card { background: #fff; border: 1px solid #ccc; border-radius: 10px; padding: 12px; margin: 12px 0; max-width: 520px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .meta { font-size: 13px; color: #555; margin-bottom: 8px; }
  #layout { font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>⬇ GPS download: demo</h1>
<p class="warn">SAMPLE DATA ONLY. These parks (US-9001 to US-9003) are made up. On the real site, chat 3 replaces the stubs below
with the real <code>KPC.dataUrl</code> and <code>KPCB</code>. Files are made in the browser; nothing is sent anywhere.</p>

<div id="cards"></div>
<pre id="layout"></pre>

<script src="sample-data.js"></script>
<script src="kpc-gps.js"></script>
<script>
  // ---- stubs standing in for the site (ASSUMED shapes; see README "Adapters") ----
  window.KPC = { dataUrl: function (p) { return "kpcdata://" + p; }, area: "US-KY" };       // KPC-Data first ...
  window.KPCB = {                                                                         // ... outlines from kpc-bounds.js
    outline: function (ref) { return KPC_SAMPLE.outlines[ref] || null; },
    trails: function (ref) { return KPC_SAMPLE.trails[ref] || []; }
  };
  KPCGPS.config({ fetch: KPC_SAMPLE.fakeFetch(), siteBase: "/site/" });   // site link: default KPC-Links page

  var parks = [
    ["US-9001", "Sample Lake Wildlife Management Area", "Park Info card: official outline, 2-fer nearby"],
    ["US-9002", "Sample Creek State Natural Area", "Kit card: approximate outline"],
    ["US-9003", "Sample Ridge Preserve", "Am I in the Park card: pin only"]
  ];
  var cards = document.getElementById("cards");
  parks.forEach(function (p) {
    var c = document.createElement("div"); c.className = "card";
    c.innerHTML = "<h2>" + p[0] + " " + p[1] + "</h2><div class='meta'>" + p[2] + "</div>";
    cards.appendChild(c);
    KPCGPS.button(c, { ref: p[0], area: "US-KY" });
  });
  var t = document.createElement("div"); t.className = "card";
  t.innerHTML = "<h2>KY trip planner: 3 stops</h2><div class='meta'>US-9003 → US-9001 → US-9002 (route kept in this order)</div>";
  cards.appendChild(t);
  KPCGPS.button(t, { stops: function () { return ["US-9003", "US-9001", "US-9002"]; }, area: "US-KY" });

  // ?check=1 opens every chooser and reports the page width (used for the 390 px check)
  if (/check=1/.test(location.search)) {
    Array.prototype.forEach.call(document.querySelectorAll(".kpcgps"), function (b) { b.classList.add("open"); });
    setTimeout(function () {
      var d = document.documentElement, worst = 0;
      Array.prototype.forEach.call(document.querySelectorAll(".kpcgps-panel, .kpcgps-fmts button, .card"), function (e) { worst = Math.max(worst, e.getBoundingClientRect().right); });
      document.getElementById("layout").textContent = "LAYOUT innerWidth=" + window.innerWidth + " clientWidth=" + d.clientWidth + " scrollWidth=" + d.scrollWidth +
        " widestRight=" + Math.round(worst) + " sideways=" + (d.scrollWidth > d.clientWidth ? "YES" : "NO");
    }, 50);
  }
</script>
</body>
</html>
