# Example caller (layer collector). Goes in KPC-Data .github/workflows/; keeps the bot's own concurrency group.
name: layer collector (sharded)
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      areas:
        type: string
        default: all
      chain:
        type: number
        default: 0
concurrency:
  group: layer-collector
  cancel-in-progress: false
jobs:
  sharded:
    uses: ./.github/workflows/kpc-sharded.yml
    permissions:
      contents: write
      actions: write
    with:
      bot: .github/scripts/layer_collector.py
      areas: ${{ inputs.areas || 'all' }}
      groups: 8
      minutes: 50
      env: '{"KPC_CONTACT": "${{ vars.KPC_CONTACT }}"}'
      hosts_map: data/layers/layer_list.json
      into: data/layers
      concurrency_group: layer-collector
      divert: python3 .github/scripts/divert.py data/layers
      status_board: status/board.md
      chain_workflow: layer-collector-sharded.yml
      chain: ${{ inputs.chain || 0 }}
